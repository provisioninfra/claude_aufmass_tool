(function (global) {
  'use strict';

  var STANDARD_HOST = 'api.pipedrive.com';

  /* Ist die Weiterleitung über den eigenen Server verfügbar? Nur dann,
     wenn dieses Gerät dort angemeldet ist und der Server meldet, dass ein
     Schlüssel hinterlegt ist. */
  function serverWeg() {
    var Ab = global.Abgleich;
    if (!Ab || typeof Ab.zustand !== 'function') return null;
    var z = Ab.zustand();
    if (!z || !z.angemeldet || !z.pipedrive) return null;
    return { host: z.pipedriveHost || STANDARD_HOST };
  }

  /** 'server' | 'geraet' | null - woher der Zugriff kommt. */
  function quelle(einstellungen) {
    if (serverWeg()) return 'server';
    if (einstellungen && String(einstellungen.pipedriveToken || '').trim()) return 'geraet';
    return null;
  }

  /* --- Fehler mit verständlicher Ursache ---------------------------------- */
  function PipedriveFehler(text, art, zusatz) {
    var e = new Error(text);
    e.art = art || 'unbekannt';
    e.zusatz = zusatz || '';
    return e;
  }

  function hostAus(einstellungen) {
    var server = serverWeg();
    if (server) return server.host;
    var roh = String((einstellungen && einstellungen.pipedriveHost) || '').trim();
    if (!roh) return STANDARD_HOST;
    /* Auch eine vollständige Adresse aus dem Browser wird angenommen */
    roh = roh.replace(/^https?:\/\//, '').replace(/\/.*$/, '').trim();
    return roh || STANDARD_HOST;
  }

  /* =========================================================================
   * Eine lesende Abfrage. Andere Verfahren sind hier nicht vorgesehen.
   * ====================================================================== */
  /* Pipedrives Statuscode in eine verständliche Ursache übersetzen - für
     beide Wege dieselbe Regel, nur der Hinweis, wo man nachsieht, ist anders. */
  function statusBewerten(status, woPruefen) {
    if (status === 401 || status === 403) {
      return PipedriveFehler('Der Zugriffsschlüssel wurde abgelehnt.', 'schluessel-ungueltig', woPruefen);
    }
    if (status === 429) {
      return PipedriveFehler('Pipedrive hat zu viele Abfragen gemeldet.', 'zu-viele',
        'Bitte einen Moment warten und erneut versuchen.');
    }
    if (status === 404) {
      return PipedriveFehler('Der angefragte Eintrag wurde nicht gefunden.', 'nicht-gefunden', '');
    }
    if (status < 200 || status >= 300) {
      return PipedriveFehler('Pipedrive antwortete mit Fehler ' + status + '.', 'antwort-fehler', '');
    }
    return null;
  }
  function inhaltBewerten(daten) {
    if (daten && daten.success === false) {
      return PipedriveFehler(daten.error || 'Pipedrive meldet einen Fehler.', 'antwort-fehler',
        daten.error_info || '');
    }
    return null;
  }

  /* --- Der Weg über den eigenen Server ---------------------------------- */
  function holenUeberServer(pfad, parameter) {
    var weg = String(pfad).replace(/^\/?api\//, '');
    var url = (global.location ? global.location.origin : '') + '/wp-json/aufmass/v1/pipedrive/' + weg;
    var teile = [];
    Object.keys(parameter || {}).forEach(function (k) {
      var w = parameter[k];
      if (w === undefined || w === null || w === '') return;
      teile.push(encodeURIComponent(k) + '=' + encodeURIComponent(w));
    });
    if (teile.length) url += '?' + teile.join('&');

    var abbruch = new AbortController();
    var zeitgeber = setTimeout(function () { abbruch.abort(); }, 30000);

    return fetch(url, {
      method: 'GET', credentials: 'same-origin', signal: abbruch.signal,
      headers: { 'X-Aufmass-Abgleich': '1', 'Accept': 'application/json' }
    }).then(function (antwort) {
      clearTimeout(zeitgeber);
      return antwort.text().then(function (text) {
        var d = null;
        try { d = text ? JSON.parse(text) : null; } catch (e) { d = null; }
        if (antwort.status === 401) {
          throw PipedriveFehler('Die Anmeldung am Server ist abgelaufen.', 'nicht-angemeldet',
            'Bitte im Werkzeug erneut anmelden.');
        }
        if (antwort.status === 503) {
          throw PipedriveFehler((d && d.message) || 'Pipedrive ist auf dem Server nicht eingerichtet.',
            'nicht-eingerichtet', 'In WordPress unter Einstellungen → Aufmaß-Abgleich den Schlüssel hinterlegen.');
        }
        if (antwort.status === 502) {
          throw PipedriveFehler((d && d.message) || 'Pipedrive war vom Server aus nicht erreichbar.',
            'verbindung', 'Bitte später erneut versuchen.');
        }
        if (!antwort.ok || !d || typeof d.status !== 'number') {
          throw PipedriveFehler('Der eigene Server antwortete unerwartet (' + antwort.status + ').',
            'antwort-fehler', (d && d.message) || '');
        }
        var f = statusBewerten(d.status,
          'Der in WordPress hinterlegte Schlüssel wurde von Pipedrive abgelehnt. ' +
          'Bitte unter Einstellungen → Aufmaß-Abgleich prüfen.');
        if (f) throw f;
        f = inhaltBewerten(d.daten);
        if (f) throw f;
        return d.daten;
      });
    }).catch(function (fehler) {
      clearTimeout(zeitgeber);
      if (fehler && fehler.art) throw fehler;
      if (fehler && fehler.name === 'AbortError') {
        throw PipedriveFehler('Der Server hat nicht rechtzeitig geantwortet.', 'zeitueberschreitung',
          'Bitte Netzverbindung prüfen und erneut versuchen.');
      }
      throw PipedriveFehler('Die Verbindung zum eigenen Server kam nicht zustande.', 'verbindung',
        'Ohne Netz lässt sich kein Deal abholen. Das übrige Werkzeug arbeitet weiter.');
    });
  }

  function holen(einstellungen, pfad, parameter) {
    /* Der Server hat Vorrang: Dort liegt der Schlüssel, nicht hier. */
    if (serverWeg()) return holenUeberServer(pfad, parameter);

    var schluessel = (einstellungen && einstellungen.pipedriveToken || '').trim();
    if (!schluessel) {
      return Promise.reject(PipedriveFehler(
        'Es ist kein Pipedrive-Zugriffsschlüssel hinterlegt.', 'kein-schluessel',
        'Unter Einstellungen den Schlüssel eintragen.'));
    }
    var host = hostAus(einstellungen);
    var url = 'https://' + host + pfad;
    var teile = [];
    Object.keys(parameter || {}).forEach(function (k) {
      var w = parameter[k];
      if (w === undefined || w === null || w === '') return;
      teile.push(encodeURIComponent(k) + '=' + encodeURIComponent(w));
    });
    if (teile.length) url += (url.indexOf('?') === -1 ? '?' : '&') + teile.join('&');

    var abbruch = new AbortController();
    var zeitgeber = setTimeout(function () { abbruch.abort(); }, 25000);

    return fetch(url, {
      method: 'GET',                       /* ausschließlich lesend */
      headers: { 'x-api-token': schluessel, 'Accept': 'application/json' },
      signal: abbruch.signal,
      mode: 'cors',
      credentials: 'omit'
    }).then(function (antwort) {
      clearTimeout(zeitgeber);
      var f = statusBewerten(antwort.status,
        'Bitte den Schlüssel in Pipedrive prüfen: Einstellungen → Persönliche Einstellungen → API.');
      if (f) throw f;
      return antwort.json();
    }).then(function (daten) {
      var f = inhaltBewerten(daten);
      if (f) throw f;
      return daten;
    }).catch(function (fehler) {
      clearTimeout(zeitgeber);
      if (fehler && fehler.art) throw fehler;
      if (fehler && fehler.name === 'AbortError') {
        throw PipedriveFehler('Pipedrive hat nicht rechtzeitig geantwortet.', 'zeitueberschreitung',
          'Bitte Netzverbindung prüfen und erneut versuchen.');
      }
      /* Ein fehlgeschlagenes fetch ohne Statuscode deutet auf eine
       * abgewiesene Browser-Abfrage hin - meist CORS oder keine Verbindung. */
      throw PipedriveFehler('Die Verbindung zu Pipedrive kam nicht zustande.', 'verbindung',
        'Mögliche Ursachen: keine Internetverbindung, falsche Adresse, oder Pipedrive ' +
        'lässt die Abfrage aus dem Browser nicht zu. In diesem Fall ist ein Zwischendienst nötig.');
    });
  }

  /* =========================================================================
   * Abfragen
   * ====================================================================== */

  /* Verbindung prüfen und den angemeldeten Benutzer zurückgeben. */
  function verbindungPruefen(einstellungen) {
    return holen(einstellungen, '/api/v1/users/me').then(function (d) {
      var u = d && d.data;
      if (!u) throw PipedriveFehler('Unerwartete Antwort von Pipedrive.', 'antwort-fehler', '');
      return {
        name: u.name || '', email: u.email || '',
        firma: (u.company_name || ''), firmaId: u.company_id,
        domain: u.company_domain || ''
      };
    });
  }

  function pipelines(einstellungen) {
    return holen(einstellungen, '/api/v2/pipelines', { limit: 100 }).then(function (d) {
      return (d && d.data || []).map(function (p) {
        return { id: p.id, name: p.name || '', reihenfolge: p.order_nr };
      }).sort(function (a, b) { return (a.reihenfolge || 0) - (b.reihenfolge || 0); });
    });
  }

  function phasen(einstellungen, pipelineId) {
    return holen(einstellungen, '/api/v2/stages', { pipeline_id: pipelineId, limit: 100 })
      .then(function (d) {
        return (d && d.data || []).map(function (s) {
          return { id: s.id, name: s.name || '', reihenfolge: s.order_nr };
        }).sort(function (a, b) { return (a.reihenfolge || 0) - (b.reihenfolge || 0); });
      });
  }

  /* Ein Deal aus der Antwort in die Form dieses Werkzeugs bringen. */
  function dealAbbilden(deal, pipelineId) {
    return {
      id: deal.id,
      titel: deal.title || '',
      wert: deal.value, waehrung: deal.currency || '',
      pipelineId: deal.pipeline_id || pipelineId || null,
      phaseId: deal.stage_id,
      status: deal.status || '',
      orgId: deal.org_id || null,
      personId: deal.person_id || null,
      besitzerId: deal.owner_id || deal.user_id || null,
      erstellt: deal.add_time || '',
      geaendert: deal.update_time || '',
      phaseSeit: deal.stage_change_time || deal.update_time || ''
    };
  }

  /* Offene Deals einer Pipeline, auf Wunsch auf eine Phase eingegrenzt.
   * Die Phase wird sowohl in der Abfrage mitgegeben als auch anschliessend
   * geprueft - so greift die Eingrenzung auch dann, wenn die Schnittstelle
   * den Parameter einmal nicht beruecksichtigt.
   *
   * Mit optionen.ohneNachfilter unterbleibt die zweite Pruefung; das wird
   * fuer die Diagnose gebraucht, die sehen will, was ungefiltert ankommt. */
  function deals(einstellungen, pipelineId, optionen) {
    optionen = optionen || {};
    var phaseId = optionen.phaseId;
    return holen(einstellungen, '/api/v2/deals', {
      pipeline_id: pipelineId,
      stage_id: phaseId,
      status: optionen.status || 'open',
      limit: optionen.limit || 100,
      sort_by: 'update_time',
      sort_direction: 'desc'
    }).then(function (d) {
      var liste = (d && d.data || []).map(function (deal) {
        return dealAbbilden(deal, pipelineId);
      });
      if (!optionen.ohneNachfilter) {
        if (pipelineId) {
          liste = liste.filter(function (deal) {
            return String(deal.pipelineId) === String(pipelineId);
          });
        }
        if (phaseId) {
          liste = liste.filter(function (deal) {
            return String(deal.phaseId) === String(phaseId);
          });
        }
      }
      return liste;
    });
  }

  /* =========================================================================
   * Regel: Für welchen Deal soll ein Aufmaß entstehen?
   * ======================================================================
   * Ein Aufmaß entsteht, wenn der Deal in der festgelegten Pipeline und
   * Phase steht und zu ihm noch kein Projekt vorliegt. Dieselbe Prüfung
   * gilt gleichermaßen für einen neu angelegten wie für einen in die Phase
   * verschobenen Deal - maßgeblich ist allein, wo er jetzt steht.
   *
   * Bewusst ohne Seiteneffekte, damit ein späterer Webhook-Dienst dieselbe
   * Entscheidung mit denselben Daten treffen kann.
   */
  function istZuUebernehmen(deal, einstellungen, vorhandeneProjekte) {
    if (!deal) return { uebernehmen: false, code: 'kein-deal', grund: 'kein Deal' };

    var pipelineId = einstellungen && einstellungen.pipedrivePipelineId;
    var phaseId = einstellungen && einstellungen.pipedrivePhaseId;

    if (pipelineId && String(deal.pipelineId || '') !== String(pipelineId)) {
      return { uebernehmen: false, code: 'pipeline', grund: 'andere Pipeline' };
    }
    if (phaseId && String(deal.phaseId || '') !== String(phaseId)) {
      return { uebernehmen: false, code: 'phase', grund: 'andere Phase' };
    }
    if (deal.status && deal.status !== 'open') {
      return { uebernehmen: false, code: 'status', grund: 'Deal ist nicht offen' };
    }
    var vorhanden = projektZuDeal(deal.id, vorhandeneProjekte);
    if (vorhanden) {
      return { uebernehmen: false, code: 'vorhanden', grund: 'Aufmaß vorhanden', projekt: vorhanden };
    }
    return { uebernehmen: true, code: 'offen', grund: '' };
  }

  /* Gibt es zu diesem Deal bereits ein Aufmaß? */
  function projektZuDeal(dealId, projekte) {
    if (!dealId) return null;
    var treffer = (projekte || []).filter(function (p) {
      return p && p.pipedrive && String(p.pipedrive.dealId) === String(dealId);
    });
    return treffer[0] || null;
  }

  function organisation(einstellungen, orgId) {
    if (!orgId) return Promise.resolve(null);
    return holen(einstellungen, '/api/v2/organizations/' + orgId).then(function (d) {
      var o = d && d.data;
      if (!o) return null;
      return {
        id: o.id,
        name: o.name || '',
        adresse: adresseLesen(o.address),
        eigene: eigeneFelderLesen(o)
      };
    });
  }

  function person(einstellungen, personId) {
    if (!personId) return Promise.resolve(null);
    return holen(einstellungen, '/api/v2/persons/' + personId).then(function (d) {
      var p = d && d.data;
      if (!p) return null;
      return {
        id: p.id,
        name: p.name || [p.first_name, p.last_name].filter(Boolean).join(' '),
        telefon: erstesFeld(p.phones || p.phone, 'value'),
        email: erstesFeld(p.emails || p.email, 'value'),
        orgId: p.org_id || null
      };
    });
  }

  /* Adressfelder kommen je nach Fassung als Objekt oder als Text. */
  function adresseLesen(adresse) {
    if (!adresse) return { strasse: '', plz: '', ort: '', land: '', gesamt: '' };
    if (typeof adresse === 'string') {
      return { strasse: '', plz: '', ort: '', land: '', gesamt: adresse };
    }
    var strasse = [adresse.street_number ? (adresse.route || '') + ' ' + adresse.street_number
                                         : (adresse.route || '')].join('').trim();
    return {
      strasse: strasse || adresse.sublocality || '',
      plz: adresse.postal_code || '',
      ort: adresse.locality || adresse.admin_area_level_2 || '',
      land: adresse.country || '',
      gesamt: adresse.value || adresse.formatted_address || ''
    };
  }

  /* Aus "Am Hafen 12, 40213 Düsseldorf" die Bestandteile gewinnen, falls
   * Pipedrive nur den Gesamttext liefert. */
  function adresseZerlegen(gesamt) {
    var text = String(gesamt || '').trim();
    if (!text) return null;
    var teile = text.split(',').map(function (t) { return t.trim(); }).filter(Boolean);
    var ergebnis = { strasse: '', plz: '', ort: '' };
    if (teile.length >= 2) {
      ergebnis.strasse = teile[0];
      var plzOrt = /^(\d{4,5})\s+(.+)$/.exec(teile[1]);
      if (plzOrt) { ergebnis.plz = plzOrt[1]; ergebnis.ort = plzOrt[2]; }
      else { ergebnis.ort = teile[1]; }
    } else {
      ergebnis.strasse = text;
    }
    return ergebnis;
  }

  function erstesFeld(wert, schluessel) {
    if (!wert) return '';
    if (typeof wert === 'string') return wert;
    if (Array.isArray(wert)) {
      if (!wert.length) return '';
      var erster = wert.filter(function (e) { return e && e.primary; })[0] || wert[0];
      return (typeof erster === 'string') ? erster : (erster[schluessel] || '');
    }
    return wert[schluessel] || '';
  }

  /* Eigene Felder tragen in Pipedrive lange Schlüssel; sie werden für eine
   * spätere Zuordnung unverändert mitgeführt. */
  function eigeneFelderLesen(objekt) {
    var aus = {};
    Object.keys(objekt || {}).forEach(function (k) {
      if (/^[0-9a-f]{40}$/i.test(k) && objekt[k] !== null && objekt[k] !== '') {
        aus[k] = objekt[k];
      }
    });
    return aus;
  }

  /* =========================================================================
   * Deal mit allen Stammdaten in einem Zug
   * ====================================================================== */
  function dealVollstaendig(einstellungen, deal) {
    return Promise.all([
      organisation(einstellungen, deal.orgId),
      person(einstellungen, deal.personId)
    ]).then(function (teile) {
      return { deal: deal, organisation: teile[0], person: teile[1] };
    });
  }

  /* =========================================================================
   * Übernahme in ein Projekt
   * ======================================================================
   * Bewusst als reine Abbildung ohne Seiteneffekte: Dieselbe Funktion kann
   * später ein Webhook-Dienst verwenden, der dieselben Daten liefert.
   */
  function aufProjektAbbilden(projekt, daten, einstellungen) {
    var deal = daten.deal || {};
    var org = daten.organisation;
    var pers = daten.person;
    var host = hostAus(einstellungen).replace(/^api\./, '');
    var uebernommen = [];

    function setzen(feld, wert, bezeichnung) {
      if (wert === undefined || wert === null || String(wert).trim() === '') return;
      if (String(projekt[feld] || '').trim() !== '') return;   /* Vorhandenes nicht überschreiben */
      projekt[feld] = String(wert).trim();
      uebernommen.push(bezeichnung);
    }

    if (org) {
      setzen('kunde', org.name, 'Kunde');
      var adresse = org.adresse || {};
      if (!adresse.strasse && adresse.gesamt) {
        var zerlegt = adresseZerlegen(adresse.gesamt);
        if (zerlegt) adresse = { strasse: zerlegt.strasse, plz: zerlegt.plz, ort: zerlegt.ort };
      }
      setzen('strasse', adresse.strasse, 'Straße');
      setzen('plz', adresse.plz, 'PLZ');
      setzen('ort', adresse.ort, 'Ort');
    }
    if (pers) {
      setzen('ansprechpartner', pers.name, 'Ansprechpartner');
      setzen('telefon', pers.telefon, 'Telefon');
      setzen('email', pers.email, 'E-Mail');
    }
    setzen('objekt', deal.titel, 'Objekt');
    if (!projekt.name || projekt.name === 'Neues Aufmaß') {
      projekt.name = deal.titel || projekt.name;
    }

    /* Verknüpfung festhalten - Grundlage für eine spätere Automatik */
    projekt.pipedrive = {
      dealId: deal.id || null,
      orgId: (org && org.id) || deal.orgId || null,
      personId: (pers && pers.id) || deal.personId || null,
      pipelineId: deal.pipelineId || null,
      dealTitel: deal.titel || '',
      host: host,
      dealLink: deal.id ? ('https://' + host + '/deal/' + deal.id) : '',
      uebernommen: new Date().toISOString()
    };
    return { projekt: projekt, uebernommen: uebernommen };
  }

  /* =========================================================================
   * Diagnose: Warum wird kein Deal angeboten?
   * ======================================================================
   * Diese Abfrage beantwortet genau eine Frage: Was liefert Pipedrive
   * tatsaechlich, und woran scheitert die Uebernahmeregel? Sie liest die
   * offenen Deals bewusst OHNE Pipeline- und Phasenfilter und prueft erst
   * danach jeden Deal gegen die eingestellte Regel. So wird sichtbar, ob
   * ueberhaupt Deals ankommen, ob sie in der erwarteten Pipeline stehen und
   * in welcher Phase sie tatsaechlich liegen.
   *
   * Der Bericht enthaelt niemals den Zugriffsschluessel.
   */
  function diagnose(einstellungen, vorhandeneProjekte) {
    var e = einstellungen || {};
    var bericht = {
      host: hostAus(e),
      pipelineId: String(e.pipedrivePipelineId || ''),
      pipelineName: e.pipedrivePipelineName || '',
      phaseId: String(e.pipedrivePhaseId || ''),
      phaseName: e.pipedrivePhaseName || '',
      schritte: [],
      deals: [],
      phasen: [],
      zahlen: { gelesen: 0, inPipeline: 0, inPhase: 0, uebernehmbar: 0,
                vorhanden: 0, nichtOffen: 0, gefiltert: null },
      grenze: 200,
      hinweise: []
    };

    function schritt(name, ok, text) {
      bericht.schritte.push({ name: name, ok: !!ok, text: text || '' });
    }
    function hinweis(text) {
      if (bericht.hinweise.indexOf(text) === -1) bericht.hinweise.push(text);
    }

    return verbindungPruefen(e).then(function (u) {
      schritt('Zugang', true, 'Angemeldet als ' + (u.name || '–') +
        (u.firma ? ('  ·  ' + u.firma) : ''));
      return pipelines(e);
    }).then(function (liste) {
      bericht.pipelines = liste;
      if (!bericht.pipelineId) {
        schritt('Pipeline', true, 'Keine Pipeline festgelegt – es werden alle gelesen.');
      } else {
        var treffer = liste.filter(function (pl) {
          return String(pl.id) === bericht.pipelineId; })[0];
        if (treffer) {
          bericht.pipelineName = treffer.name;
          schritt('Pipeline', true, '„' + treffer.name + '“  (Nr. ' + treffer.id + ')');
        } else {
          schritt('Pipeline', false, 'Die gespeicherte Pipeline Nr. ' + bericht.pipelineId +
            ' gibt es in diesem Konto nicht (mehr).');
          hinweis('Die eingestellte Pipeline passt zu keiner Pipeline in Pipedrive. ' +
                  'Bitte unter Einstellungen erneut auswählen.');
        }
      }
      return bericht.pipelineId ? phasen(e, bericht.pipelineId) : Promise.resolve([]);
    }).then(function (liste) {
      bericht.phasen = liste;
      if (!bericht.pipelineId) {
        schritt('Phase', true, 'Ohne Pipeline gibt es keine Phaseneingrenzung.');
      } else if (!bericht.phaseId) {
        schritt('Phase', true, 'Keine Phase festgelegt – alle Phasen der Pipeline zählen.');
      } else {
        var ph = liste.filter(function (x) { return String(x.id) === bericht.phaseId; })[0];
        if (ph) {
          bericht.phaseName = ph.name;
          schritt('Phase', true, '„' + ph.name + '“  (Nr. ' + ph.id + ')');
        } else {
          schritt('Phase', false, 'Die gespeicherte Phase Nr. ' + bericht.phaseId +
            ' gehört nicht zu dieser Pipeline.');
          hinweis('Die eingestellte Phase gehört nicht zur eingestellten Pipeline. ' +
                  'Das ist der häufigste Grund dafür, dass kein Deal angeboten wird: ' +
                  'Bitte unter Einstellungen Pipeline und danach Phase neu auswählen.');
        }
      }

          el('div', { class: 'knopfleiste', style: { justifyContent: 'center', marginTop: '10px' } },
            el('button', { class: 'haupt', text: 'Warum? – Verbindung prüfen',
              onclick: function (ev) { diagnoseLaufenLassen(ev.target, liste); } }))
        ]));
      } else {
        liste.appendChild(el('p', { class: 'zart', style: { marginBottom: '8px' },
          text: offen.length + (offen.length === 1 ? ' Deal wartet' : ' Deals warten') + ' auf ein Aufmaß' }));
        var box = el('div', { class: 'tuer-liste deal-offen', style: { border: '1px solid var(--rand)',
          borderRadius: 'var(--radius)' } });
        offen.forEach(function (g) {
          var deal = g.deal;
          box.appendChild(el('div', {
            class: 'tuer-zeile',
            onclick: function () { dealUebernehmen(deal, null, dlg, neuLaden); }
          }, [
            el('div', { class: 'statusbalken', style: { background: 'var(--gruen)' } }),
            el('div', { class: 'inhalt' }, [
              el('div', { class: 'haupt' }, [
                el('div', { class: 'bez', text: deal.titel || ('Deal ' + deal.id) }),
                el('div', { class: 'detail', text:
                  ['Deal-Nr. ' + deal.id,
                   deal.wert ? (Number(deal.wert).toLocaleString('de-DE') + ' ' + (deal.waehrung || '')) : '',
                   deal.geaendert ? ('geändert ' + datumKurz(deal.geaendert)) : ''
                  ].filter(Boolean).join('  ·  ') })
              ]),
              el('div', { class: 'marken' },
                el('span', { class: 'marke-pille gruen', text: 'Aufmaß anlegen' }))
            ])
          ]));
        });
        liste.appendChild(box);
      }

      /* Bereits übernommene Deals nur auf Wunsch zeigen */
      if (schonDa.length) {
        var aufklapp = el('details', { class: 'abschnitt', style: { marginTop: '14px' } }, [
          el('summary', {}, [
            el('span', { text: 'Bereits übernommen' }),
            el('span', { class: 'zusatz', text: schonDa.length + (schonDa.length === 1 ? ' Deal' : ' Deals') })
          ]),
          el('div', { class: 'koerper' }, (function () {
            var innen = el('div', { class: 'tuer-liste deal-vorhanden', style: { border: '1px solid var(--rand)',
              borderRadius: 'var(--radius)' } });
            schonDa.forEach(function (g) {
              var pr = g.pruefung.projekt || {};
              innen.appendChild(el('div', { class: 'tuer-zeile', style: { cursor: 'default' } }, [
                el('div', { class: 'statusbalken', style: { background: 'var(--text-zart)' } }),
                el('div', { class: 'inhalt' }, [
                  el('div', { class: 'haupt' }, [
                    el('div', { class: 'bez', text: g.deal.titel || ('Deal ' + g.deal.id) }),
                    el('div', { class: 'detail',
                      text: 'Aufmaß vorhanden: ' + (pr.kunde || pr.name || '–') })
                  ]),
                  el('div', { class: 'marken' }, [
                    el('button', { class: 'klein', text: 'Öffnen', onclick: function (ev) {
                      ev.stopPropagation();
                      if (dlg) dlg.schliessen();
                      projektOeffnen(pr.id, neuLaden);
                    } }),
                    el('button', { class: 'klein', text: 'Trotzdem neu anlegen', onclick: function (ev) {
                      ev.stopPropagation();
                      dealUebernehmen(g.deal, pr, dlg, neuLaden);
                    } })
                  ])
                ])
              ]));
            });
            return innen;
          })())
        ]);
        liste.appendChild(aufklapp);
      }
    })
    .catch(function (fehler) {
      A.leeren(liste);
      liste.appendChild(el('div', { class: 'meldung fehler' }, el('div', {}, [
        el('b', { text: fehler.message || 'Die Deals konnten nicht abgerufen werden.' }),
        fehler.zusatz ? el('div', { style: { marginTop: '6px', fontSize: '13px' }, text: fehler.zusatz }) : null
      ])));
    });
  }

  /* =========================================================================
   * Diagnose: Was liefert Pipedrive wirklich?
   * ======================================================================
   * Wird sichtbar, sobald kein Deal angeboten wird. Sie liest die offenen
   * Deals ohne Filter und zeigt zu jedem, in welcher Pipeline und Phase er
   * steht - damit die Lücke zwischen Erwartung und Datenlage sichtbar wird.
   */
  function diagnoseLaufenLassen(knopf, ziel) {
    var e = Zustand.einstellungen || {};
    var beschriftung = knopf ? knopf.textContent : '';
    /* Der Knopf wird in jedem Fall wieder benutzbar - auch wenn er noch
     * dasteht, weil der Bericht woanders erscheint. */
    function freigeben() {
      if (knopf && knopf.parentNode) { knopf.disabled = false; knopf.textContent = beschriftung; }
    }
    if (knopf) { knopf.disabled = true; knopf.textContent = 'Prüfe …'; }
    Store.alleProjekte().then(function (vorhandene) {
      return global.Pipedrive.diagnose(e, vorhandene);
    }).then(function (bericht) {
      A.leeren(ziel);
      ziel.appendChild(diagnoseAnzeigen(bericht));
      freigeben();
    }).catch(function (fehler) {
      freigeben();
      A.leeren(ziel);
      ziel.appendChild(el('div', { class: 'meldung fehler' }, el('div', {}, [
        el('b', { text: fehler.message || 'Die Prüfung ist fehlgeschlagen.' }),
        fehler.zusatz ? el('div', { style: { marginTop: '6px', fontSize: '13px' },
          text: fehler.zusatz }) : null
      ])));
    });
  }

  /* Den Bericht darstellen. Er enthält nie den Zugriffsschlüssel. */
  function diagnoseAnzeigen(b) {
    var z = b.zahlen || {};
    var kasten = el('div', { class: 'pd-diagnose' });

    kasten.appendChild(el('h3', { style: { margin: '0 0 8px' }, text: 'Prüfbericht' }));

    var schritte = el('div', { class: 'tuer-liste', style: { border: '1px solid var(--rand)',
      borderRadius: 'var(--radius)', marginBottom: '12px' } });
    (b.schritte || []).forEach(function (sch) {
      schritte.appendChild(el('div', { class: 'tuer-zeile', style: { cursor: 'default' } }, [
        el('div', { class: 'statusbalken',
          style: { background: sch.ok ? 'var(--gruen)' : 'var(--rot)' } }),
        el('div', { class: 'inhalt' }, el('div', { class: 'haupt' }, [
          el('div', { class: 'bez', text: (sch.ok ? '✓ ' : '✕ ') + sch.name }),
          el('div', { class: 'detail', text: sch.text })
        ]))
      ]));
    });
    kasten.appendChild(schritte);

    kasten.appendChild(el('p', { class: 'zart', style: { marginBottom: '10px' }, text:
      z.gelesen + ' offene Deals gelesen  ·  ' + z.inPipeline + ' in der Pipeline  ·  ' +
      z.inPhase + ' in der Phase  ·  ' + z.uebernehmbar + ' ohne Aufmaß' }));

    (b.hinweise || []).forEach(function (h) {
      kasten.appendChild(el('div', { class: 'meldung warn', style: { marginBottom: '10px' } },
        el('div', { text: h })));
    });

    /* Die gelesenen Deals im Klartext - hier wird der Unterschied sichtbar */
    if ((b.deals || []).length) {
      var innen = el('div', { class: 'tuer-liste deal-diagnose', style: {
        border: '1px solid var(--rand)', borderRadius: 'var(--radius)' } });
      b.deals.slice(0, 40).forEach(function (d) {
        innen.appendChild(el('div', { class: 'tuer-zeile', style: { cursor: 'default' } }, [
          el('div', { class: 'statusbalken',
            style: { background: d.uebernehmen ? 'var(--gruen)' : 'var(--text-zart)' } }),
          el('div', { class: 'inhalt' }, [
            el('div', { class: 'haupt' }, [
              el('div', { class: 'bez', text: d.titel || ('Deal ' + d.id) }),
              el('div', { class: 'detail', text:
                ['Nr. ' + d.id,
                 'Pipeline ' + (d.pipelineName || d.pipelineId || '–'),
                 'Phase ' + (d.phaseName || d.phaseId || '–'),
                 d.status || ''].filter(Boolean).join('  ·  ') })
            ]),
            el('div', { class: 'marken' }, el('span', {
              class: 'marke-pille ' + (d.uebernehmen ? 'gruen' : ''),
              text: d.uebernehmen ? 'würde angeboten' : d.grund }))
          ])
        ]));
      });
      kasten.appendChild(el('details', { class: 'abschnitt', open: true }, [
        el('summary', {}, [
          el('span', { text: 'Gelesene Deals' }),
          el('span', { class: 'zusatz', text: b.deals.length + '' })
        ]),
        el('div', { class: 'koerper' }, innen)
      ]));
    }

    kasten.appendChild(el('div', { class: 'knopfleiste', style: { marginTop: '12px' } },
      el('button', { class: 'klein', text: 'Bericht kopieren', onclick: function () {
        var text = diagnoseAlsText(b);
        var fertig = function () { A.toast('Bericht kopiert.', 'ok'); };
        if (global.navigator && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(fertig, function () { ersatzKopie(text); });
        } else { ersatzKopie(text); }
      } })));
    return kasten;
  }

  function ersatzKopie(text) {
    var feld = el('textarea', { value: text, style: { position: 'fixed', top: '-1000px' } });
    document.body.appendChild(feld);
    feld.select();
    try { document.execCommand('copy'); A.toast('Bericht kopiert.', 'ok'); }
    catch (x) { A.toast('Kopieren nicht möglich.', 'fehler'); }
    document.body.removeChild(feld);
  }

  /* Als Text zum Weitergeben - bewusst ohne Zugriffsschlüssel. */
  function diagnoseAlsText(b) {
    var z = b.zahlen || {};
    var zeilen = ['Pipedrive-Prüfbericht', 'Adresse: ' + b.host,
      'Pipeline: ' + (b.pipelineName || '–') + ' (Nr. ' + (b.pipelineId || '–') + ')',
      'Phase: ' + (b.phaseName || '–') + ' (Nr. ' + (b.phaseId || '–') + ')', ''];
    (b.schritte || []).forEach(function (sch) {
      zeilen.push((sch.ok ? '[ok] ' : '[!] ') + sch.name + ': ' + sch.text);
    });
    zeilen.push('');
    zeilen.push('Gelesen: ' + z.gelesen + ', in Pipeline: ' + z.inPipeline +
      ', in Phase: ' + z.inPhase + ', übernehmbar: ' + z.uebernehmbar +
      ', gefilterte Abfrage: ' + (z.gefiltert === null ? '–' : z.gefiltert));
    (b.hinweise || []).forEach(function (h) { zeilen.push('Hinweis: ' + h); });
    zeilen.push('');
    (b.deals || []).slice(0, 40).forEach(function (d) {
      zeilen.push('Deal ' + d.id + ' | Pipeline ' + (d.pipelineName || d.pipelineId) +
        ' | Phase ' + (d.phaseName || d.phaseId) + ' | ' + d.status +
        ' | ' + (d.uebernehmen ? 'würde angeboten' : d.grund));
    });
    return zeilen.join('\n');
  }

  function dealUebernehmen(deal, bekannt, dlg, neuLaden) {
    var e = Zustand.einstellungen || {};
    var PD = global.Pipedrive;

    if (bekannt) {
      A.bestaetigen('Deal bereits übernommen',
        'Zu diesem Deal gibt es schon das Aufmaß „' + (bekannt.kunde || bekannt.name) +
        '“. Soll trotzdem ein weiteres angelegt werden?', 'Weiteres anlegen')
        .then(function (ja) { if (ja) holenUndAnlegen(); });
      return;
    }
    holenUndAnlegen();

    function holenUndAnlegen() {
      A.toast('Stammdaten werden aus Pipedrive geholt …');
      PD.dealVollstaendig(e, deal).then(function (daten) {
        var projekt = M.neuesProjekt(deal.titel || 'Aufmaß aus Pipedrive');
        if (e.standardBearbeiter) projekt.bearbeiter = e.standardBearbeiter;
        var ergebnis = PD.aufProjektAbbilden(projekt, daten, e);

        return Store.projektSpeichern(projekt).then(function () {
          if (dlg) dlg.schliessen();
          A.projektOeffnenIntern(projekt, 'stammdaten');
          neuLaden();
          var n = ergebnis.uebernommen.length;
          A.toast(n ? (n + ' Angaben aus Pipedrive übernommen: ' + ergebnis.uebernommen.join(', '))
                    : 'Aufmaß angelegt. In Pipedrive waren keine Stammdaten hinterlegt.', 'ok');
        });
      }).catch(function (fehler) {
        A.toast(fehler.message || 'Die Übernahme ist fehlgeschlagen.', 'fehler');
      });
    }
  }

  function neuesProjektAnlegen(neuLaden) {
    A.textAbfragen('Neues Aufmaß', 'Kunde oder Objektbezeichnung', '', 'z. B. Müller GmbH – Verwaltung')
      .then(function (name) {
        if (name === null) return;
        var p = M.neuesProjekt(name || 'Neues Aufmaß');
        p.kunde = name || '';
        if (Zustand.einstellungen && Zustand.einstellungen.standardBearbeiter) {
          p.bearbeiter = Zustand.einstellungen.standardBearbeiter;
        }
        Store.projektSpeichern(p).then(function () {
          A.projektOeffnenIntern(p, 'stammdaten');
          neuLaden();
          A.toast('Aufmaß angelegt. Bitte Stammdaten ergänzen.', 'ok');
        });
      });
  }

  function projektOeffnen(id, neuLaden) {
    Store.projektLaden(id).then(function (p) {
      if (!p) { A.toast('Projekt nicht gefunden.', 'fehler'); return; }
      var geladen = M.migriere(p);
      geladen.id = p.id;
      A.projektOeffnenIntern(geladen, 'tueren');
      neuLaden();
    });
  }

  function importDialog(neuLaden) {
    var dateiEingabe = el('input', {
      type: 'file', accept: '.json,application/json', class: 'versteckt',
      onchange: function (e) {
        var datei = e.target.files && e.target.files[0];
        if (!datei) return;
        var leser = new FileReader();
        leser.onerror = function () { A.toast('Die Datei konnte nicht gelesen werden.', 'fehler'); };
        leser.onload = function () {
          var ergebnis;
          try { ergebnis = Store.importParsen(leser.result); }
          catch (fehler) { A.toast(fehler.message, 'fehler'); return; }
          Store.alleProjekte().then(function (vorhandene) {
            /* Eine Sicherung („Alle Projekte sichern“) bringt mehrere
               Projekte mit: alle einlesen, Vorhandenes nur auf Nachfrage
               überschreiben, sonst als Kopie daneben legen. */
            if (ergebnis.sicherung) {
              var ids = {};
              vorhandene.forEach(function (v) { ids[v.id] = v; });
              var doppelt = ergebnis.projekte.filter(function (x) { return ids[x.id]; }).length;
              var frage = doppelt
                ? Promise.resolve(null).then(function () {
                    return A.bestaetigen('Sicherung einlesen',
                      ergebnis.projekte.length + ' Projekte in der Sicherung, davon ' + doppelt +
                      ' bereits auf diesem Gerät. Sollen die vorhandenen überschrieben werden? ' +
                      'Andernfalls werden sie als Kopie angelegt.', 'Überschreiben');
                  })
                : Promise.resolve(false);
              frage.then(function (ueberschreiben) {
                var reihe = Promise.resolve();
                ergebnis.projekte.forEach(function (projekt) {
                  var zuSpeichern = (ids[projekt.id] && !ueberschreiben)
                    ? Store.projektKlonen(projekt, (projekt.name || 'Import') + ' (Sicherung)') : projekt;
                  reihe = reihe.then(function () { return Store.projektSpeichern(zuSpeichern); });
                });
                return reihe;
              }).then(function () {
                A.toast(ergebnis.projekte.length + ' Projekte aus der Sicherung eingelesen.', 'ok');
                dlg.schliessen(); neuLaden();
              }).catch(function (fehler) { A.toast(fehler.message || 'Einlesen fehlgeschlagen.', 'fehler'); });
              return;
            }
            var gleich = vorhandene.filter(function (v) { return v.id === ergebnis.projekt.id; })[0];
            var fortsetzen = function (projekt) {
              Store.projektSpeichern(projekt).then(function () {
                A.projektOeffnenIntern(projekt, 'tueren');
                A.toast('Projekt importiert: ' + projekt.tueren.length + ' Türen.', 'ok');
                dlg.schliessen(); neuLaden();
              });
            };
            if (gleich) {
              A.bestaetigen('Projekt bereits vorhanden',
                'Ein Projekt mit derselben Kennung existiert bereits („' + (gleich.kunde || gleich.name) +
                '“). Soll es überschrieben werden? Andernfalls wird eine Kopie angelegt.',
                'Überschreiben').then(function (ueberschreiben) {
                  fortsetzen(ueberschreiben ? ergebnis.projekt
                    : Store.projektKlonen(ergebnis.projekt, (ergebnis.projekt.name || 'Import') + ' (Import)'));
                });
            } else { fortsetzen(ergebnis.projekt); }
          });
        };
        leser.readAsText(datei);
      }
    });
    var dlg = A.dialogOeffnen({
      titel: 'Projekt importieren', klein: true,
      inhalt: el('div', {}, [
        el('p', { class: 'hinweis', text: 'Wählen Sie eine zuvor exportierte Aufmaß-Datei (.json) aus.' }),
        dateiEingabe
      ]),
      knoepfe: [{ fuellen: true }, { text: 'Abbrechen' }]
    });
  }

  /* =========================================================================
   * Stammdaten
   * ====================================================================== */
  function ansichtStammdaten(behaelter) {
    var p = Zustand.projekt;
    var seite = el('div', { class: 'seite' });
    behaelter.appendChild(seite);

    seite.appendChild(el('h1', { text: 'Projekt-Stammdaten' }));
    seite.appendChild(el('p', { class: 'hinweis', text: 'Diese Angaben erscheinen im Kopf jeder PDF-Ausgabe.' }));

    /* Verknüpfung zu Pipedrive, sofern das Aufmaß von dort stammt */
    if (p.pipedrive && p.pipedrive.dealId) {
      seite.appendChild(el('div', { class: 'meldung info' }, el('div', {}, [
        el('b', { text: 'Verknüpft mit Pipedrive' }),
        el('div', { style: { marginTop: '4px', fontSize: '13.5px' }, text:
          'Deal-Nr. ' + p.pipedrive.dealId +
          (p.pipedrive.dealTitel ? ('  ·  ' + p.pipedrive.dealTitel) : '') +
          (p.pipedrive.orgId ? ('  ·  Organisation ' + p.pipedrive.orgId) : '') }),
        p.pipedrive.dealLink ? el('div', { style: { marginTop: '8px' } },
          el('a', { class: 'knopf klein', href: p.pipedrive.dealLink, target: '_blank',
                    rel: 'noopener noreferrer', text: 'Deal in Pipedrive öffnen ↗' })) : null
      ])));
    }

    seite.appendChild(el('div', { class: 'karte' }, [
      el('h2', { text: 'Kunde und Objekt' }),
      el('div', { class: 'raster' }, [
        A.textFeld(p, 'kunde', 'Kunde / Firma'),
        A.textFeld(p, 'kundenNr', 'Kunden-Nr.'),
        A.textFeld(p, 'objekt', 'Objekt / Liegenschaft'),
        A.textFeld(p, 'strasse', 'Straße und Hausnummer'),
        A.textFeld(p, 'plz', 'PLZ', { inputmode: 'numeric' }),
        A.textFeld(p, 'ort', 'Ort'),
        A.textFeld(p, 'anlagenNr', 'Anlagen-Nr. / Schließanlagen-Nr.')
      ])
    ]));

    /* --- Schließanlage: gilt für das gesamte Projekt --------------------- */
    var anlageKarte = el('div', { class: 'karte' });
    seite.appendChild(anlageKarte);
    anlageZeichnen();

    function anlageZeichnen() {
      A.leeren(anlageKarte);
      var eigene = (Zustand.einstellungen && Zustand.einstellungen.eigeneSysteme) || [];
      function systemOptionen(typ) {
        return K.systemeNachTyp(typ, eigene).map(function (sy) {
          return { id: sy.id, label: K.systemLabel(sy.id, eigene) };
        });
      }

      anlageKarte.appendChild(el('h2', { text: 'Schließanlage' }));
      anlageKarte.appendChild(el('p', { class: 'hinweis',
        text: 'Diese Angaben gelten für das gesamte Projekt. An der einzelnen Tür muss das System nicht erneut gewählt werden.' }));

      var artFelder = el('div', { class: 'raster' }, [
        A.auswahlFeld(p, 'anlagenart', 'Art der Anlage', K.ANLAGENART, {
          leerText: '– bitte wählen –',
          beiAenderung: function () { anlageZeichnen(); }
        })
      ]);
      anlageKarte.appendChild(artFelder);

      var art = K.ANLAGENART.filter(function (a) { return a.id === p.anlagenart; })[0];
      if (art) {
        anlageKarte.appendChild(el('p', { class: 'hinweis', style: { marginTop: '8px' }, text: art.hinweis }));
      }

      if (!p.anlagenart) {
        anlageKarte.appendChild(el('div', { class: 'meldung info', style: { marginTop: '12px' } },
          el('div', { text: 'Bitte zuerst die Art der Anlage festlegen – davon hängt ab, welche Angaben an den Türen überhaupt nötig sind.' })));
        return;
      }

      var systemFelder = el('div', { class: 'raster', style: { marginTop: '14px' } });
      if (p.anlagenart === 'mechanik' || p.anlagenart === 'hybrid') {
        systemFelder.appendChild(A.auswahlFeld(p, 'systemMechanik',
          'Mechanisches System', systemOptionen('mechanisch'),
          { leerText: '– bitte wählen –', beiAenderung: function () { anlageZeichnen(); } }));
      }
      if (p.anlagenart === 'elektronik' || p.anlagenart === 'hybrid') {
        systemFelder.appendChild(A.auswahlFeld(p, 'systemElektronik',
          'Elektronisches System', systemOptionen('elektronisch'),
          { leerText: '– bitte wählen –', beiAenderung: function () { anlageZeichnen(); } }));
      }
      systemFelder.appendChild(A.textFeld(p, 'systemDetail', 'Detail / Variante zur Anlage',
        { platzhalter: 'z. B. Profil, Sonderfarbe, Schließfolge' }));
      anlageKarte.appendChild(systemFelder);

      /* Hinweise der gewählten Systeme anzeigen */
      [p.systemMechanik, p.systemElektronik].filter(Boolean).forEach(function (sid) {
        var sys = K.systemById(sid, eigene);
        if (sys && sys.hinweis) {
          anlageKarte.appendChild(el('p', { class: 'zart', style: { marginTop: '6px' },
            text: K.systemLabel(sid, eigene) + ': ' + sys.hinweis }));
        }
      });

      if (!M.anlageVollstaendig(p)) {
        anlageKarte.appendChild(el('div', { class: 'meldung warn', style: { marginTop: '12px' } },
          el('div', { text: 'Es fehlt noch ein System. Solange es nicht gewählt ist, bleiben die Türangaben unvollständig.' })));
      } else if (p.anlagenart === 'hybrid') {
        anlageKarte.appendChild(el('div', { class: 'meldung info', style: { marginTop: '12px' } },
          el('div', { text: 'Hybridanlage: An jeder Tür wird nur noch angegeben, ob sie mechanisch oder elektronisch ausgeführt wird.' })));
      }
    }

    /* --- Angaben, die nur die Bestellung braucht ------------------------

  var EBENEN = {

        var roh = String(e.target.value).replace(/[^0-9.,]/g, '');
        if (roh !== e.target.value) e.target.value = roh;

      ]),
      el('button', { class: 'haupt', text: '+ Neue Tür',
        onclick: function () { tuerBearbeiten(null, neuZeichnen, vorgabenAusFilter()); } })
    ]));

    /* Offene Pflichtangaben sind der häufigste Grund, ins Büro
     * zurückzukommen - deshalb direkt erreichbar. */
    if (offeneTueren.length) {
      seite.appendChild(el('div', { class: 'meldung warn', style: { marginBottom: '12px' } },
        el('div', { class: 'zeile-verteilt' }, [
          el('div', { class: 'fuellen' }, [
            el('b', { text: offeneTueren.length +
              (offeneTueren.length === 1 ? ' Tür ist unvollständig' : ' Türen sind unvollständig') }),
            el('div', { style: { marginTop: '4px', fontSize: '13px' },
              text: 'Es fehlen Pflichtangaben für die Bestellung.' })
          ]),
          el('button', { class: 'klein', text: Zustand.tuerFilter.unvollstaendig
              ? 'Alle Türen zeigen' : 'Nur diese zeigen',
            onclick: function () {
              Zustand.tuerFilter.unvollstaendig = !Zustand.tuerFilter.unvollstaendig;
              neuZeichnen();
            } })
        ])));
    }

    /* --- Filterleiste --- */
    var f = Zustand.tuerFilter;
    var suchfeld = el('input', {
      type: 'search', placeholder: 'Suche: Nr., Raum, System …', title: 'Sucht in Nummer, Bezeichnung, System und Bemerkung', value: f.suche,
      oninput: function (e) { f.suche = e.target.value; listeZeichnen(); }
    });
    var strukturWahl = el('select', {
      'aria-label': 'Bereich filtern',
      onchange: function (e) { f.struktur = e.target.value; listeZeichnen(); }
    });
    strukturWahl.appendChild(el('option', { value: '', text: 'Alle Bereiche' }));
    strukturOptionen().forEach(function (o) {
      strukturWahl.appendChild(el('option', { value: o.id, text: o.label }));
    });
    strukturWahl.appendChild(el('option', { value: '__ohne__', text: 'Ohne Zuordnung' }));
    strukturWahl.value = f.struktur;

    var statusWahl = el('select', {
      'aria-label': 'Status filtern',
      onchange: function (e) { f.status = e.target.value; listeZeichnen(); }
    });
    statusWahl.appendChild(el('option', { value: '', text: 'Alle Status' }));
    K.STATUS.forEach(function (st) { statusWahl.appendChild(el('option', { value: st.id, text: st.label })); });
    statusWahl.value = f.status;

    var systemWahl = el('select', {
      'aria-label': 'System filtern',
      onchange: function (e) { f.system = e.target.value; listeZeichnen(); }
    });
    systemWahl.appendChild(el('option', { value: '', text: 'Alle Systeme' }));
    var verwendete = {};
    p.tueren.forEach(function (t) {
      var sid = M.tuerSystemId(p, t);
      if (sid) verwendete[sid] = true;
    });
    Object.keys(verwendete).forEach(function (id) {
      systemWahl.appendChild(el('option', { value: id, text: K.systemLabel(id, eigeneListe('eigeneSysteme')) }));
    });
    systemWahl.value = f.system;

    seite.appendChild(el('div', { class: 'werkzeuge' }, [
      el('div', { class: 'suche' }, suchfeld),
      strukturWahl, statusWahl, systemWahl,
      el('button', { class: 'klein', text: 'Filter zurücksetzen', onclick: function () {
        Zustand.tuerFilter = { suche: '', struktur: '', status: '', system: '', unvollstaendig: false };
        neuZeichnen();
      } })
    ]));

    var listenBereich = el('div');
    seite.appendChild(listenBereich);
    listeZeichnen();

    function passt(t) {
      if (f.unvollstaendig && M.tuerVollstaendig(p, t)) return false;
      if (f.status && t.status !== f.status) return false;
      if (f.system && M.tuerSystemId(p, t) !== f.system) return false;
      if (f.struktur === '__ohne__' && t.strukturId) return false;
      if (f.struktur && f.struktur !== '__ohne__' && t.strukturId !== f.struktur) return false;
      if (f.suche) {
        var q = f.suche.toLowerCase();
        var heu = [t.nummer, t.bezeichnung, t.kategorie, t.notiz, t.nacharbeitText,
                   K.zylinderText(t), K.beschlagText(t), K.schlossText(t),
                   K.systemLabel(M.tuerSystemId(p, t), eigeneListe('eigeneSysteme')), t.systemNotiz,
                   K.beschlagOptionenText(t)].join(' ').toLowerCase();
        if (heu.indexOf(q) === -1) return false;
      }
      return true;
    }

    function listeZeichnen() {
      A.leeren(listenBereich);
      var gefiltert = p.tueren.filter(passt);

      if (!p.tueren.length) {
        listenBereich.appendChild(el('div', { class: 'leer' }, [
          el('h3', { text: 'Noch keine Tür erfasst' }),
          el('p', { text: 'Erfassen Sie die erste Tür. Tipp: Gliedern Sie zuerst unter „Struktur“ die Standorte und Etagen – dann lassen sich die Türen direkt zuordnen.' }),
          el('button', { class: 'haupt', text: '+ Erste Tür aufnehmen',
            onclick: function () { tuerBearbeiten(null, neuZeichnen, vorgabenAusFilter()); } })
        ]));
        return;
      }
      if (!gefiltert.length) {
        listenBereich.appendChild(el('div', { class: 'leer' }, [
          el('h3', { text: 'Keine Tür passt zum Filter' }),
          el('p', { text: 'Passen Sie Suche oder Filter an.' })
        ]));
        return;
      }

      /* Gruppierung wie in der PDF-Ausgabe */
      var teilProjekt = { standorte: p.standorte, tueren: gefiltert, schliessungen: p.schliessungen, matrix: p.matrix };
      M.tuerenGruppiert(teilProjekt).forEach(function (g) {
        var anzahl = g.tueren.reduce(function (sum, t) { return sum + (parseInt(t.anzahl, 10) || 1); }, 0);
        var liste = el('div', { class: 'tuer-liste' });
        g.tueren.forEach(function (t) { liste.appendChild(tuerZeile(t, neuZeichnen)); });
        listenBereich.appendChild(el('div', { class: 'tuer-gruppe' }, [
          el('div', { class: 'kopfzeile' }, [
            el('span', { text: g.titel }),
            el('span', { class: 'anzahl', text: g.tueren.length + ' Pos.  ·  ' + anzahl +
              (anzahl === 1 ? ' Tür' : ' Türen') })
          ]),
          liste
        ]));
      });
    }
  }

  function tuerZeile(t, neuZeichnen) {
    var p = Zustand.projekt;
    var status = K.statusById(t.status);
    var fehlendeAnzahl = M.pflichtfelder(p, t).length;
    var details = [];
    var sid = M.tuerSystemId(p, t);
    if (sid) details.push(K.systemLabel(sid, eigeneListe('eigeneSysteme')));
    var zyl = K.zylinderText(t);
    if (zyl) details.push(zyl);
    if (t.masseAussen || t.masseInnen) details.push((t.masseAussen || '–') + '/' + (t.masseInnen || '–') + ' mm');
    var bes = K.beschlagText(t);
    if (bes) details.push(bes);
    if (t.kategorie) details.push(t.kategorie);

    return el('div', {
      class: 'tuer-zeile',
      onclick: function () { tuerBearbeiten(t, neuZeichnen); }
    }, [
      /* Die Farbe der Nacharbeit steht im Katalog und nicht ein zweites Mal hier */
      el('div', { class: 'statusbalken', style: {
        background: t.nacharbeit ? K.statusById('nacharbeit').farbe : status.farbe } }),
      el('div', { class: 'inhalt' }, [
        el('div', { class: 'nummer', text: t.nummer || '—' }),
        el('div', { class: 'haupt' }, [
          el('div', { class: 'bez', text: t.bezeichnung || 'Ohne Bezeichnung' }),
          el('div', { class: 'detail', text: details.join('  ·  ') || 'Noch keine Angaben' })
        ]),
        el('div', { class: 'marken' }, [
          (parseInt(t.anzahl, 10) || 1) > 1 ? el('span', { class: 'marke-pille blau', text: t.anzahl + '×' }) : null,
          (t.fotos || []).length ? el('span', { class: 'marke-pille foto', text: String(t.fotos.length) }) : null,
          fehlendeAnzahl ? el('span', { class: 'marke-pille gelb',
            title: 'Fehlt: ' + M.pflichtfelder(p, t).map(function (x) { return x.label; }).join(', '),
            text: fehlendeAnzahl + '× Pflicht offen' }) : null,
          t.nacharbeit ? el('span', { class: 'marke-pille rot', text: 'Nacharbeit' }) : null,
          el('span', {
            class: 'marke-pille ' + (t.status === 'aufgemessen' ? 'gruen'
              : t.status === 'klaerung' ? 'gelb' : t.status === 'nacharbeit' ? 'rot'
              : t.status === 'freigegeben' ? 'blau' : ''),
            text: status.label
          })
        ])
      ])
    ]);
  }

  /* =========================================================================
   * Aufmaß-Formular
   * ======================================================================
   * Zwei Ansichten auf dieselben Felder:
   *
   *   "geführt"     - ein Schritt je Bildschirm, nur die Felder, die jetzt
   *                   dran sind, mit Fortschrittsbalken. Gedacht für das
   *                   Aufmaß vor Ort und für Ungeübte.
   *   "alle Felder" - alle Abschnitte untereinander zum Nachbearbeiten.
   *
   * Pflichtangaben sind in beiden Ansichten gekennzeichnet. Sie blockieren
   * nichts: Vor Ort ist ein Maß nicht immer zu bekommen. Eine unvollständige
   * Tür wird gespeichert, erhält aber den Status "Klärung nötig" und
   * erscheint in der Liste der offenen Punkte.
   *
   * vorgaben: { strukturId } - gesetzt, wenn die Tür aus einem Bereich
   * heraus angelegt wird; der Bereich steht dann schon fest.
   */
  function tuerBearbeiten(vorhandene, neuZeichnen, vorgaben) {
    var p = Zustand.projekt;
    var istNeu = !vorhandene;
    /* Auf einer Kopie arbeiten, damit „Abbrechen“ wirklich verwirft */
    var t = istNeu ? M.neueTuer(vorlageFuerNeueTuer(vorgaben))
                   : JSON.parse(JSON.stringify(vorhandene));
    /* Der Stand beim Öffnen: Damit lässt sich beim Speichern erkennen,
     * was dieser Dialog geändert hat - und was in der Zwischenzeit von
     * anderswo (Abgleich mit einem zweiten Gerät) an der Tür geändert
     * wurde und erhalten bleiben muss. */
    var beimOeffnen = istNeu ? null : JSON.stringify(t);

    /* Die gewählte Ansicht überlebt den Dialog - getrennt für neue und
     * vorhandene Türen, weil beide Fälle verschieden benutzt werden. */
    var modusSchluessel = istNeu ? 'tuerModusNeu' : 'tuerModusAlt';
    if (!Zustand[modusSchluessel]) Zustand[modusSchluessel] = istNeu ? 'gefuehrt' : 'alle';

    var inhalt = el('div', { class: 'tuer-formular' });
    var modusLeiste = el('div');
    var statusLeiste = el('div', { class: 'pflicht-leiste' });
    var chipsOffen = null;   /* null = Vorgabe je Ansicht, sonst die Wahl im Dialog */
    var fortschritt = el('div', { class: 'schritt-fortschritt' });
    var koerper = el('div');
    inhalt.appendChild(modusLeiste);
    inhalt.appendChild(statusLeiste);
    inhalt.appendChild(fortschritt);
    inhalt.appendChild(koerper);

    /* --- Die Dateiauswahl für Fotos wird nur einmal erzeugt ------------- */
    var fotoEingabe = el('input', {
      type: 'file', accept: 'image/*', multiple: true, class: 'versteckt',
      onchange: function (e) { fotosHinzufuegen(Array.prototype.slice.call(e.target.files)); e.target.value = ''; }
    });
    var kameraEingabe = el('input', {
      type: 'file', accept: 'image/*', capture: 'environment', class: 'versteckt',
      onchange: function (e) { fotosHinzufuegen(Array.prototype.slice.call(e.target.files)); e.target.value = ''; }
    });

    /* =======================================================================
     * Abschnitte
     * =====================================================================
     * Jeder Abschnitt ist im geführten Ablauf ein Schritt und in der
     * Vollansicht ein aufklappbarer Block - dieselbe Baufunktion für beides.
     */
    function elektronikRelevant() {
      return M.istTuerElektronisch(p, t) || t.brauchtWandleser || K.beschlagIstElektronisch(t);
    }

    var ABSCHNITTE = [
      { id: 'lage',       titel: 'Türkennung und Lage',    schritt: 'Wo ist die Tür?',       immer: true,  bauen: lageBauen },
      { id: 'bauteile',   titel: 'Anlage und Bauteile',    schritt: 'Was wird gebraucht?',   immer: true,  bauen: bauteileBauen },
      { id: 'zylinder',   titel: 'Zylinder',               schritt: 'Zylinder',              wenn: function () { return t.brauchtZylinder; }, bauen: zylinderBauen },
      { id: 'beschlag',   titel: 'Beschlag / Drücker',     schritt: 'Beschlag / Drücker',    wenn: function () { return t.brauchtBeschlag; }, bauen: beschlagBauen },
      { id: 'schloss',    titel: 'Schloss',                schritt: 'Schloss',               wenn: function () { return t.brauchtSchloss; }, bauen: schlossBauen },
      { id: 'elektronik', titel: 'Elektronik und Vernetzung', schritt: 'Elektronik',         wenn: elektronikRelevant, bauen: elektronikBauen },
      { id: 'tuerdaten',  titel: 'Türdaten',               schritt: 'Türdaten',              immer: true,  freiwillig: true, bauen: tuerdatenBauen },
      { id: 'bestand',    titel: 'Bestand / Altanlage',    schritt: 'Bestand',               immer: true,  freiwillig: true, bauen: bestandBauen },
      { id: 'abschluss',  titel: 'Bemerkung, Nacharbeit, Fotos', schritt: 'Bemerkung und Fotos', immer: true, bauen: abschlussBauen }
    ];

    function aktive() {
      return ABSCHNITTE.filter(function (a) { return a.immer || (a.wenn && a.wenn()); });
    }

    var schrittId = 'lage';

    /* --- 1. Lage ------------------------------------------------------- */
    function lageBauen(ziel) {
      var optionen = strukturOptionen();
      ziel.appendChild(el('div', { class: 'raster' }, [
        A.textFeld(t, 'nummer', 'Tür-Nr. <span class="einheit">(lfd., änderbar)</span>',
          { platzhalter: '001', inputmode: 'numeric' }),
        A.textFeld(t, 'bezeichnung', 'Bezeichnung / Raum', { platzhalter: 'z. B. Büro Empfang' }),
        A.auswahlFeld(t, 'kategorie', 'Türkategorie', K.TUERKATEGORIEN, { leerText: '– ohne Angabe –' }),
        optionen.length
          ? A.auswahlFeld(t, 'strukturId', 'Standort / Gebäude / Bereich', optionen,
              { leerText: '– bitte wählen –', beiAenderung: markieren })
          : A.textFeld(t, 'etage', 'Etage / Bereich <span class="einheit">(Freitext)</span>',
              { beiAenderung: markieren }),
        A.zahlFeld(t, 'anzahl', 'Anzahl baugleicher Türen', { min: 1, max: 999, vorgabe: 1 })
      ]));
      ziel.appendChild(statusFeldBauen());
    }

    /* Der Status wird aus der Vollständigkeit geführt, solange er nicht
     * selbst gewählt wurde. Das steht ausdrücklich dort, wo er sichtbar
     * ist - sonst wirkt eine Änderung von allein wie ein Fehler. */
    function statusFeldBauen() {
      var kasten = el('div', { style: { marginTop: '12px' } });
      var auswahl = A.auswahlFeld(t, 'status', 'Status', K.STATUS, {
        leerText: '– offen –',
        beiAenderung: function () { t.statusVonHand = true; statusFeldNeu(); }
      });
      kasten.appendChild(el('div', { class: 'raster' }, [auswahl]));
      if (t.statusVonHand) {
        kasten.appendChild(el('div', { class: 'knopfleiste', style: { marginTop: '6px' } },
          el('button', { class: 'klein', text: 'Status wieder automatisch führen',
            title: 'Vollständig = Aufgemessen, unvollständig = Klärung nötig',
            onclick: function () {
              A.schrittMerken('Status wieder automatisch');
              t.statusVonHand = false;
              M.statusAusPruefung(p, t);
              statusFeldNeu();
            } })));
      } else {
        kasten.appendChild(el('p', { class: 'zart', style: { marginTop: '4px' },
          text: 'Wird automatisch geführt: vollständig = Aufgemessen, unvollständig = Klärung nötig.' }));
      }
      return kasten;
    }
    function statusFeldNeu() { abschnittNeu('lage'); markieren(); }

    /* --- 2. Anlage und Bauteile ---------------------------------------- */
    function bauteileBauen(ziel) {
      var eigene = eigeneListe('eigeneSysteme');
      var sid = M.tuerSystemId(p, t);

      if (!p.anlagenart) {
        ziel.appendChild(el('div', { class: 'meldung warn', style: { marginTop: '0' } },
          el('div', {}, [
            el('b', { text: 'Für dieses Projekt ist noch keine Schließanlage festgelegt. ' }),
            'Bitte unter „Stammdaten“ die Art der Anlage und das System wählen.'
          ])));
      } else {
        var marken = el('div', { class: 'zeile-verteilt' }, [
          el('span', { class: 'marke-pille blau',
            text: (K.ANLAGENART.filter(function (a) { return a.id === p.anlagenart; })[0] || {}).label || p.anlagenart }),
          sid ? el('span', { class: 'marke-pille', text: K.systemLabel(sid, eigene) }) : null,
          p.systemDetail ? el('span', { class: 'zart', text: p.systemDetail }) : null
        ]);
        ziel.appendChild(marken);
      }

      /* Nur bei einer Hybridanlage ist an der Tür noch etwas zu entscheiden */
      if (p.anlagenart === 'hybrid') {
        ziel.appendChild(el('div', { class: 'raster', style: { marginTop: '12px' } }, [
          A.auswahlFeld(t, 'tuerTechnologie', 'Diese Tür wird ausgeführt als', [
            { id: 'mechanik',   label: 'Mechanisch' + (p.systemMechanik ? '  –  ' + K.systemLabel(p.systemMechanik, eigene) : '') },
            { id: 'elektronik', label: 'Elektronisch' + (p.systemElektronik ? '  –  ' + K.systemLabel(p.systemElektronik, eigene) : '') }
          ], { leerText: '– bitte wählen –', beiAenderung: function () { ansichtNeu(); } })
        ]));
      } else if (t.tuerTechnologie) {
        t.tuerTechnologie = '';   /* bei reiner Anlage gegenstandslos */
      }

      var sys = K.systemById(sid, eigene);
      if (sys && sys.hinweis) {
        ziel.appendChild(el('p', { class: 'hinweis', style: { marginTop: '8px' }, text: sys.hinweis }));
      }

      ziel.appendChild(el('hr', { class: 'trenner' }));
      ziel.appendChild(el('h3', { text: 'Welche Bauteile hat diese Tür?', style: { marginTop: '0' } }));
      var schalter = el('div', { class: 'raster eng', 'data-feld': 'bauteile' }, [
        A.schalterFeld(t, 'brauchtZylinder', 'Zylinder', function () { ansichtNeu(); }),
        A.schalterFeld(t, 'brauchtBeschlag', 'Beschlag / Drücker', function () { ansichtNeu(); }),
        A.schalterFeld(t, 'brauchtSchloss', 'Schloss', function () { ansichtNeu(); }),
        A.schalterFeld(t, 'brauchtWandleser', 'Wandleser', function () { ansichtNeu(); })
      ]);
      ziel.appendChild(schalter);

      ziel.appendChild(el('div', { class: 'raster', style: { marginTop: '12px' } }, [
        A.textFeld(t, 'systemNotiz', 'Besonderheit zu dieser Tür <span class="einheit">(nur bei Abweichung)</span>',
          { platzhalter: 'z. B. Fremdfabrikat im Bestand, Sonderausführung' })
      ]));
    }

    /* --- 3. Zylinder --------------------------------------------------- */
    var gesamtAnzeige = el('p', { class: 'zart', style: { marginTop: '4px' } });
    function gesamtlaengeZeigen() {
      var gl = gesamtlaenge(t);
      gesamtAnzeige.textContent = gl ? ('Gesamtlänge ' + gl + ' mm') : '';
    }
    function laengenGeaendert() {
      gesamtlaengeZeigen();
      widerspruecheZeigen();
      markieren();
    }

    function zylinderBauen(ziel) {
      var raster = el('div', { class: 'raster' }, [
        A.auswahlFeld(t, 'zylinderBauform', 'Art des Zylinders <span class="einheit">(Bauform)</span>',
          liste('ZYLINDER_BAUFORM', 'eigeneZylinderarten'),
          { leerText: '– bitte wählen –', beiAenderung: function () { abschnittNeu('zylinder'); markieren(); } }),
        massFeld(t, 'masseAussen', 'Länge außen <span class="einheit">mm</span>',
          K.ZYLINDER_LAENGE, 'z. B. 35', laengenGeaendert),
        massFeld(t, 'masseInnen', 'Länge innen <span class="einheit">mm</span>',
          K.ZYLINDER_LAENGE, 'z. B. 40', laengenGeaendert)
      ]);
      /* Knaufseite ist nur beim einfachen Knaufzylinder eine offene Frage */
      if (t.zylinderBauform === 'Knaufzylinder') {
        raster.appendChild(A.auswahlFeld(t, 'zylinderKnaufseite',
          'Knaufseite <span class="einheit">(vom mech. festen Knauf)</span>', K.KNAUFSEITE,
          { leerText: '– bitte wählen –', beiAenderung: markieren }));
      } else if (t.zylinderKnaufseite) {
        t.zylinderKnaufseite = '';
      }
      ziel.appendChild(raster);
      /* Gesamtlänge mitrechnen: danach wird bestellt. Sie wird an Ort und
       * Stelle fortgeschrieben - ein Neuaufbau des Abschnitts würde eine
       * laufende Eingabe zerreißen, und mit dem Stift wäre das fatal. */
      ziel.appendChild(gesamtAnzeige);
      gesamtlaengeZeigen();
      ziel.appendChild(A.chipFeld(t, 'zylinderAusfuehrung',
        'Ausführung <span class="einheit">(nur wenn zutreffend)</span>',
        liste('ZYLINDER_AUSFUEHRUNG'),
        /* „SKG“ verlangt eine Stufe: das Feld erscheint, sobald der Chip gesetzt ist */
        { beiAenderung: function (o) { if (o === 'SKG') abschnittNeu('zylinder'); } }));
      if ((t.zylinderAusfuehrung || []).indexOf('SKG') !== -1) {
        ziel.appendChild(el('div', { class: 'raster', style: { marginTop: '10px' } }, [
          A.auswahlFeld(t, 'zylinderSkgStufe', 'SKG-Stufe', K.SKG_STUFE,
            { leerText: '– bitte wählen –', beiAenderung: markieren })
        ]));
      } else if (t.zylinderSkgStufe) {
        t.zylinderSkgStufe = '';
      }
      ziel.appendChild(widerspruecheBauen());
    }

    /* --- 4. Beschlag --------------------------------------------------- */
    function beschlagBauen(ziel) {
      var raster = el('div', { class: 'raster' }, [
        A.auswahlFeld(t, 'beschlagBauform', 'Bauform', liste('BESCHLAG_BAUFORM', 'eigeneBeschlagarten'),
          { leerText: '– bitte wählen –', beiAenderung: function () { abschnittNeu('beschlag'); markieren(); } }),
        A.auswahlFeld(t, 'beschlagAusfuehrung', 'Ausführung', K.BESCHLAG_AUSFUEHRUNG,
          { leerText: '– bitte wählen –', beiAenderung: function () { ansichtNeu(); } }),
        A.auswahlFeld(t, 'beschlagBestueckung', 'Bestückung', K.BESCHLAG_BESTUECKUNG,
          { leerText: '– bitte wählen –', beiAenderung: markieren })
      ]);
      /* Sicherheitsklasse nur beim Schutzbeschlag */
      if (t.beschlagBauform === 'Schutzbeschlag') {
        raster.appendChild(A.auswahlFeld(t, 'beschlagSicherheit', 'Sicherheitsklasse', K.BESCHLAG_SICHERHEIT));
      } else if (t.beschlagSicherheit) {
        t.beschlagSicherheit = '';
      }
      ziel.appendChild(raster);
      ziel.appendChild(A.chipFeld(t, 'beschlagOptionen',
        'Optionen <span class="einheit">(nur wenn zutreffend)</span>', K.BESCHLAG_OPTIONEN,
        { beiAenderung: function (o) { if (o === 'SKG') abschnittNeu('beschlag'); } }));
      if ((t.beschlagOptionen || []).indexOf('SKG') !== -1) {
        ziel.appendChild(el('div', { class: 'raster', style: { marginTop: '10px' } }, [
          A.auswahlFeld(t, 'beschlagSkgStufe', 'SKG-Stufe', K.SKG_STUFE,
            { leerText: '– bitte wählen –', beiAenderung: markieren })
        ]));
      } else if (t.beschlagSkgStufe) {
        t.beschlagSkgStufe = '';
      }
      ziel.appendChild(el('h3', { text: 'Maße für den Beschlag' }));
      ziel.appendChild(masseRasterBauen());
      ziel.appendChild(widerspruecheBauen());
    }

    /* Dornmaß, Entfernung, Vierkant, Türblattstärke und DIN gelten für
     * Beschlag und Schloss gemeinsam. Sie werden deshalb an genau einer
     * Stelle erfasst und in beiden Abschnitten dasselbe Raster gezeigt. */
    function masseRasterBauen() {
      return el('div', { class: 'raster' }, [
        massFeld(t, 'dornmass', 'Dornmaß <span class="einheit">mm</span>', K.DORNMASS, 'z. B. 55', markieren),
        massFeld(t, 'entfernung', 'Entfernung <span class="einheit">mm</span>', K.ENTFERNUNG, 'z. B. 72', markieren),
        massFeld(t, 'vierkant', 'Vierkant / Nuss <span class="einheit">mm</span>', K.VIERKANT, 'z. B. 8', markieren),
        massFeld(t, 'tuerblattstaerke', 'Türblattstärke <span class="einheit">mm</span>',
          K.TUERBLATTSTAERKE, 'z. B. 68', markieren),
        A.auswahlFeld(t, 'dinRichtung', 'DIN-Richtung', K.DIN_RICHTUNG,
          { leerText: '– bitte wählen –', beiAenderung: markieren })
      ]);
    }

    /* --- 5. Schloss ---------------------------------------------------- */
    function schlossBauen(ziel) {
      ziel.appendChild(el('div', { class: 'raster' }, [
        A.auswahlFeld(t, 'schlossBauform', 'Bauform', liste('SCHLOSS_BAUFORM', 'eigeneSchlossarten'),
          { leerText: '– bitte wählen –', beiAenderung: function () { abschnittNeu('schloss'); markieren(); } }),
        A.auswahlFeld(t, 'schlossFunktion', 'Funktion', K.SCHLOSS_FUNKTION,
          { leerText: '– bitte wählen –', beiAenderung: function () { abschnittNeu('schloss'); markieren(); } })
      ]));
      /* Dieselben Maße wie beim Beschlag - nur einmal erfasst */
      if (!t.brauchtBeschlag) {
        ziel.appendChild(el('h3', { text: 'Maße für das Schloss' }));
        ziel.appendChild(masseRasterBauen());
      } else {
        ziel.appendChild(el('p', { class: 'hinweis', style: { marginTop: '10px' },
          text: 'Dornmaß, Entfernung, Vierkant, Türblattstärke und DIN-Richtung stehen beim Beschlag – sie gelten für beide Bauteile und werden nur einmal erfasst.' }));
      }

      /* Einsteckschloss im Detail: freiwillig, aber bestellentscheidend */
      ziel.appendChild(el('details', { class: 'abschnitt', style: { marginTop: '14px' } }, [
        el('summary', {}, [
          el('span', { text: 'Einsteckschloss im Detail' }),
          el('span', { class: 'zusatz', text: K.schlossDetailText(t) ? 'ausgefüllt' : 'freiwillig' })
        ]),
        el('div', { class: 'koerper' }, [
          el('div', { class: 'raster' }, [
            A.auswahlFeld(t, 'schlossStulpform', 'Stulpform', K.STULPFORM, { leerText: '– ohne Angabe –' }),
            massFeld(t, 'schlossStulpbreite', 'Stulpbreite <span class="einheit">mm</span>', K.STULPBREITE, 'z. B. 24'),
            massFeld(t, 'schlossStulplaenge', 'Stulplänge <span class="einheit">mm</span>',
              K.STULPLAENGE, 'z. B. 235'),
            A.auswahlFeld(t, 'schlossFallenart', 'Fallenart', K.FALLENART, { leerText: '– ohne Angabe –' }),
            massFeld(t, 'schlossRiegelausschluss', 'Riegelausschluss <span class="einheit">mm</span>',
              K.RIEGELAUSSCHLUSS, 'z. B. 20'),
            A.auswahlFeld(t, 'schlossVerriegelungspunkte', 'Verriegelungspunkte',
              K.VERRIEGELUNGSPUNKTE, { leerText: '– ohne Angabe –' }),
            A.auswahlFeld(t, 'schlossNorm', 'Norm / Zulassung', K.SCHLOSS_NORM, { leerText: '– ohne Angabe –' }),
            A.textFeld(t, 'stulpmass', 'Stulp: Sonstiges <span class="einheit">(Freitext)</span>')
          ])
        ])
      ]));
      ziel.appendChild(widerspruecheBauen());
    }

    /* --- 7. Elektronik ------------------------------------------------- */
    function elektronikBauen(ziel) {

        A.auswahlFeld(t, 'elStromversorgung', 'Stromversorgung',

          { leerText: '– ohne Angabe –' })
      ]));
      ziel.appendChild(el('div', { style: { marginTop: '10px' } }, [
        A.schalterFeld(t, 'elTuerueberwachung', 'Türüberwachung / Türzustandsmeldung gewünscht'),
        A.schalterFeld(t, 'elTueroeffnerBestand', 'Elektrischer Türöffner ist schon vorhanden')
      ]));
      ziel.appendChild(el('div', { class: 'raster', style: { marginTop: '10px' } }, [
        A.textFeld(t, 'elLeitungsweg', 'Leitungsweg <span class="einheit">(woher kommt das Kabel?)</span>',
          { platzhalter: 'z. B. aus Technikraum UG über Steigschacht' }),

    /* --- 8. Türdaten (freiwillig) -------------------------------------- */
    function tuerdatenBauen(ziel) {
      ziel.appendChild(el('p', { class: 'hinweis', style: { marginTop: '0' },
        text: 'Freiwillig. Türblattstärke und DIN-Richtung stehen beim Bauteil und werden hier nicht erneut gefragt.' }));
      ziel.appendChild(el('div', { class: 'raster' }, [

        massFeld(t, 'tuerhoehe', 'Türhöhe <span class="einheit">mm</span>',

        A.auswahlFeld(t, 'tuerAnschlag', 'Türanschlag', K.TUER_ANSCHLAG, { leerText: '– ohne Angabe –' }),
        A.auswahlFeld(t, 'tuermaterial', 'Türblattmaterial', K.TUERMATERIAL, { leerText: '– ohne Angabe –' }),

      ]));
      ziel.appendChild(el('div', { class: 'raster', style: { marginTop: '10px' } }, [
