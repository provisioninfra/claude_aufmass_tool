<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aufmaß">
<meta name="theme-color" content="#1a4b8c">
<meta name="description" content="Aufmaß-Werkzeug für Schließanlagen und Zutrittslösungen mit PDF-Türliste und Kreuzschließplan.">
<title>Aufmaß-Tool Schließanlagen</title>
<style>
/* =============================================================================
   Schließanlagen Aufmaß-Tool — Oberfläche
   Ausgelegt auf Touch-Bedienung (iPad vor Ort) und Maus/Tastatur (Büro).
   ========================================================================== */

:root {
  --akzent:        #1a4b8c;
  --akzent-hell:   #2a6ac0;
  --akzent-bg:     #eaf1fa;
  --text:          #1a1f26;
  --text-schwach:  #5c6670;
  --text-zart:     #8d969e;
  --flaeche:       #ffffff;
  --flaeche-2:     #f5f7f9;
  --flaeche-3:     #eef1f4;
  --rand:          #d6dce2;
  --rand-zart:     #e6eaee;
  --gruen:         #1f7a3d;
  --gelb:          #b3721e;
  --rot:           #b3261e;
  --schatten:      0 1px 3px rgba(20,30,45,.10), 0 6px 18px rgba(20,30,45,.06);
  --radius:        10px;
  --radius-klein:  7px;
  --tap:           44px;          /* Mindestgröße für Touch-Ziele */
}

@media (prefers-color-scheme: dark) {
  :root {
    --akzent:        #6fa8ee;
    --akzent-hell:   #8cbcf5;
    --akzent-bg:     #1b2836;
    --text:          #e7ecf1;
    --text-schwach:  #a4aeb8;
    --text-zart:     #79838d;
    --flaeche:       #151b22;
    --flaeche-2:     #1b222b;
    --flaeche-3:     #232c36;
    --rand:          #333d48;
    --rand-zart:     #28313b;
    --gruen:         #4ec27a;
    --gelb:          #e0a445;
    --rot:           #ef6b62;
    --schatten:      0 1px 3px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--flaeche-2); color: var(--text);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}

/* --- Grundlayout --------------------------------------------------------- */
#app { display: flex; flex-direction: column; height: 100%; }

header.kopf {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--flaeche);
  border-bottom: 1px solid var(--rand);
  position: sticky; top: 0; z-index: 30;
  padding-top: max(10px, env(safe-area-inset-top));
}
.kopf .marke { font-weight: 700; font-size: 15px; color: var(--akzent); white-space: nowrap; }
.kopf .marke small { display: block; font-weight: 400; font-size: 11px; color: var(--text-zart); }
.kopf .projekt-titel {
  flex: 1; min-width: 0; font-weight: 600; font-size: 14px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.kopf .projekt-titel span { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-zart); }
.speicher-status {
  font-size: 11.5px; color: var(--text-zart); white-space: nowrap;
  display: flex; align-items: center; gap: 5px;
}
.speicher-status.aktiv { color: var(--gruen); }
.speicher-status .punkt { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

nav.reiter {
  display: flex; gap: 2px; padding: 0 10px; background: var(--flaeche);
  border-bottom: 1px solid var(--rand); overflow-x: auto; z-index: 25;
  position: sticky; top: 0; -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
nav.reiter::-webkit-scrollbar { display: none; }
nav.reiter button {
  appearance: none; border: 0; background: transparent; color: var(--text-schwach);
  padding: 11px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  border-bottom: 3px solid transparent; white-space: nowrap; min-height: var(--tap);
  font-family: inherit;
}
nav.reiter button[aria-selected="true"] { color: var(--akzent); border-bottom-color: var(--akzent); }
nav.reiter button:disabled { opacity: .35; cursor: not-allowed; }
nav.reiter button .zahl {
  display: inline-block; margin-left: 6px; padding: 1px 6px; font-size: 11px;
  border-radius: 9px; background: var(--flaeche-3); color: var(--text-schwach);
}

main.inhalt {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 16px; padding-bottom: max(28px, env(safe-area-inset-bottom));
}
.seite { max-width: 1400px; margin: 0 auto; }
.seite.breit { max-width: none; }

/* --- Typografie ---------------------------------------------------------- */
h1 { font-size: 21px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 22px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--rand-zart); }
h2:first-child { margin-top: 0; }
h3 { font-size: 14px; margin: 16px 0 8px; color: var(--text-schwach); }
p.hinweis { color: var(--text-schwach); font-size: 13.5px; margin: 4px 0 14px; }

/* --- Karten -------------------------------------------------------------- */
.karte {
  background: var(--flaeche); border: 1px solid var(--rand);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  box-shadow: var(--schatten);
}
.karte.schmal { padding: 12px; }

/* --- Formulare ----------------------------------------------------------- */
.raster { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 14px; }
.raster.eng { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.raster.zwei { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.feld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.feld.voll { grid-column: 1 / -1; }
.feld label { font-size: 12px; font-weight: 600; color: var(--text-schwach); }
.feld .einheit { font-weight: 400; color: var(--text-zart); }

input[type="text"], input[type="number"], input[type="date"], input[type="tel"],
input[type="email"], input[type="search"], select, textarea {
  font: inherit; font-size: 15px; color: var(--text);
  background: var(--flaeche); border: 1px solid var(--rand);
  border-radius: var(--radius-klein); padding: 9px 11px; width: 100%;
  min-height: var(--tap); appearance: none; -webkit-appearance: none;
}
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--text-schwach) 50%),
                    linear-gradient(135deg, var(--text-schwach) 50%, transparent 50%);
  background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  padding-right: 30px;
}
textarea { min-height: 74px; resize: vertical; line-height: 1.45; }
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--akzent); outline-offset: -1px; border-color: var(--akzent);
}
input::placeholder, textarea::placeholder { color: var(--text-zart); }

/* Umschalter (Checkbox als Schalter) */
.schalter { display: flex; align-items: center; gap: 9px; min-height: var(--tap); cursor: pointer; }
.schalter input { position: absolute; opacity: 0; width: 0; height: 0; }
.schalter .bahn {
  width: 46px; height: 27px; border-radius: 14px; background: var(--flaeche-3);
  border: 1px solid var(--rand); position: relative; transition: background .15s, border-color .15s;
  flex-shrink: 0;
}
.schalter .bahn::after {
  content: ''; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px;
  border-radius: 50%; background: var(--flaeche); box-shadow: 0 1px 3px rgba(0,0,0,.3);
  transition: transform .15s;
}
.schalter input:checked + .bahn { background: var(--akzent); border-color: var(--akzent); }
.schalter input:checked + .bahn::after { transform: translateX(19px); }
.schalter input:focus-visible + .bahn { outline: 2px solid var(--akzent); outline-offset: 2px; }
.schalter .beschriftung { font-size: 14px; font-weight: 500; }

/* Mehrfachauswahl als Chips */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px;
  border: 1px solid var(--rand); border-radius: 18px; background: var(--flaeche);
  font-size: 13.5px; cursor: pointer; user-select: none; min-height: 38px;
  color: var(--text);
}
.chip:hover { border-color: var(--akzent); }
.chip[aria-pressed="true"] {
  background: var(--akzent); border-color: var(--akzent); color: #fff; font-weight: 600;
}
@media (prefers-color-scheme: dark) { .chip[aria-pressed="true"] { color: #0d1219; } }

/* --- Schaltflächen ------------------------------------------------------- */
button, .knopf {
  font: inherit; font-size: 14px; font-weight: 600; font-family: inherit;
  border: 1px solid var(--rand); background: var(--flaeche); color: var(--text);
  border-radius: var(--radius-klein); padding: 10px 15px; cursor: pointer;
  min-height: var(--tap); display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; text-decoration: none; white-space: nowrap;
}
button:hover, .knopf:hover { border-color: var(--akzent); color: var(--akzent); }
button:active, .knopf:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
button.haupt, .knopf.haupt {
  background: var(--akzent); border-color: var(--akzent); color: #fff;
}
button.haupt:hover { background: var(--akzent-hell); border-color: var(--akzent-hell); color: #fff; }
@media (prefers-color-scheme: dark) {
  button.haupt, .knopf.haupt { color: #0d1219; }
  button.haupt:hover { color: #0d1219; }
}
button.gefahr { color: var(--rot); border-color: var(--rand); }
button.gefahr:hover { background: var(--rot); border-color: var(--rot); color: #fff; }
button.klein { padding: 6px 10px; font-size: 13px; min-height: 34px; }
button.nur-symbol { padding: 8px 10px; min-width: 38px; }
.knopfleiste { display: flex; flex-wrap: wrap; gap: 9px; align-items: center; }
.knopfleiste.rechts { justify-content: flex-end; }

/* --- Werkzeugleiste über Listen ------------------------------------------ */
.werkzeuge {
  display: flex; gap: 9px; align-items: center; flex-wrap: wrap;
  margin-bottom: 14px; padding: 11px; background: var(--flaeche);
  border: 1px solid var(--rand); border-radius: var(--radius);
}
.werkzeuge .suche { flex: 1; min-width: 170px; }
.werkzeuge select { width: auto; min-width: 130px; }

/* --- Tabellen ------------------------------------------------------------ */
.tabelle-rahmen {
  overflow: auto; border: 1px solid var(--rand); border-radius: var(--radius);
  background: var(--flaeche); -webkit-overflow-scrolling: touch;
}
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13.5px; }
th, td { padding: 9px 11px; text-align: left; border-bottom: 1px solid var(--rand-zart); }
th {
  background: var(--flaeche-3); font-size: 12px; font-weight: 700; color: var(--text-schwach);
  position: sticky; top: 0; z-index: 2; white-space: nowrap;
}
tbody tr:last-child td { border-bottom: 0; }
tbody tr.anklickbar { cursor: pointer; }
tbody tr.anklickbar:hover td { background: var(--akzent-bg); }
td.zahl, th.zahl { text-align: right; font-variant-numeric: tabular-nums; }

/* --- Türliste als Karten (Touch) ----------------------------------------- */
.tuer-gruppe { margin-bottom: 20px; }
.tuer-gruppe > .kopfzeile {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  background: var(--akzent-bg); border: 1px solid var(--rand);
  border-radius: var(--radius) var(--radius) 0 0; font-weight: 700; font-size: 14px;
  color: var(--akzent);
}
.tuer-gruppe > .kopfzeile .anzahl { margin-left: auto; font-weight: 500; font-size: 12.5px; color: var(--text-schwach); }
.tuer-liste {
  border: 1px solid var(--rand); border-top: 0;
  border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; background: var(--flaeche);
}
.tuer-zeile {
  display: flex; align-items: stretch; gap: 0; border-bottom: 1px solid var(--rand-zart);
  cursor: pointer; background: var(--flaeche);
}
.tuer-zeile:last-child { border-bottom: 0; }
.tuer-zeile:hover { background: var(--akzent-bg); }
.tuer-zeile .statusbalken { width: 5px; flex-shrink: 0; background: var(--text-zart); }
.tuer-zeile .inhalt { flex: 1; min-width: 0; padding: 11px 13px; display: flex; gap: 12px; align-items: center; }
.tuer-zeile .nummer {
  font-weight: 700; font-size: 13.5px; min-width: 72px; flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.tuer-zeile .haupt { flex: 1; min-width: 0; }
.tuer-zeile .haupt .bez { font-weight: 600; font-size: 14.5px; }
.tuer-zeile .haupt .detail {
  font-size: 12.5px; color: var(--text-schwach); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tuer-zeile .marken { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

.marke-pille {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 11px;
  background: var(--flaeche-3); color: var(--text-schwach); white-space: nowrap;
}
.marke-pille.gruen { background: rgba(31,122,61,.14); color: var(--gruen); }
.marke-pille.gelb  { background: rgba(179,114,30,.16); color: var(--gelb); }
.marke-pille.rot   { background: rgba(179,38,30,.14); color: var(--rot); }
.marke-pille.blau  { background: var(--akzent-bg); color: var(--akzent); }
.marke-pille.foto::before { content: '▣ '; }

/* --- Strukturbaum -------------------------------------------------------- */
.baum { list-style: none; margin: 0; padding: 0; }
.baum ul { list-style: none; margin: 0; padding-left: 22px; border-left: 1px dashed var(--rand); }
.baum li { margin: 5px 0; }
.knoten {
  display: flex; align-items: center; gap: 9px; padding: 8px 11px;
  background: var(--flaeche); border: 1px solid var(--rand);
  border-radius: var(--radius-klein); min-height: 42px;
}
.knoten .name { flex: 1; font-weight: 600; font-size: 14px; min-width: 0; }
.knoten .ebene-marke {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
  color: var(--text-zart); padding: 2px 7px; background: var(--flaeche-3); border-radius: 4px;
}
.knoten .tuerzahl { font-size: 12px; color: var(--text-schwach); }
.knoten .aktionen { display: flex; gap: 4px; }

/* --- Matrix / Kreuzschließplan ------------------------------------------- */
.matrix-rahmen {
  overflow: auto; border: 1px solid var(--rand); border-radius: var(--radius);
  background: var(--flaeche); max-height: 72vh; -webkit-overflow-scrolling: touch;
  position: relative;
  display: inline-block; max-width: 100%; vertical-align: top;  /* nur so breit wie die Matrix */
}
table.matrix {
  border-collapse: separate; border-spacing: 0; font-size: 13px;
  width: auto;                 /* nur so breit wie nötig, nicht auf volle Breite gedehnt */
  --kopfhoehe: 150px;          /* wird beim Aufbau an den längsten Spaltentitel angepasst */
}
table.matrix th, table.matrix td { border-bottom: 1px solid var(--rand-zart); padding: 0; }
table.matrix th.ecke {
  position: sticky; left: 0; top: 0; z-index: 6; background: var(--flaeche-3);
  min-width: 240px; max-width: 240px; padding: 8px 10px; text-align: left;
  border-right: 2px solid var(--rand);
}
table.matrix th.spaltenkopf {
  position: sticky; top: 0; z-index: 4; background: var(--flaeche-3);
  height: var(--kopfhoehe); width: 40px; min-width: 40px; max-width: 40px;
  padding: 0; vertical-align: bottom; border-right: 1px solid var(--rand-zart);
}
table.matrix th.spaltenkopf .dreh {
  writing-mode: vertical-rl; transform: rotate(180deg);
  white-space: nowrap; padding: 8px 0; font-size: 12px; font-weight: 700;
  max-height: calc(var(--kopfhoehe) - 22px); overflow: hidden; text-overflow: ellipsis;
  display: block; margin: 0 auto; color: var(--text);
}
table.matrix th.spaltenkopf .medien {
  display: block; font-size: 10px; font-weight: 500; color: var(--text-zart);
  padding-bottom: 4px; text-align: center;
}
table.matrix td.tuername {
  position: sticky; left: 0; z-index: 3; background: var(--flaeche);
  min-width: 240px; max-width: 240px; padding: 7px 10px;
  border-right: 2px solid var(--rand); font-size: 13px;
}
table.matrix td.tuername .nr { font-weight: 700; margin-right: 6px; }
table.matrix td.tuername .bez { color: var(--text-schwach); }
table.matrix tr.gruppenzeile td {
  position: sticky; left: 0; z-index: 3;
  background: var(--akzent-bg); color: var(--akzent); font-weight: 700;
  font-size: 12.5px; padding: 7px 10px;
}
table.matrix tr:hover td.tuername { background: var(--akzent-bg); }
table.matrix td.zelle {
  text-align: center; cursor: pointer; user-select: none;
  border-right: 1px solid var(--rand-zart); font-weight: 700; font-size: 15px;
  min-width: 40px; height: 38px; color: var(--akzent);
}
table.matrix td.zelle:hover { background: var(--akzent-bg); }
table.matrix td.zelle.gesetzt-ja    { background: rgba(26,75,140,.10); }
table.matrix td.zelle.gesetzt-zeit  { background: rgba(179,114,30,.14); color: var(--gelb); }
table.matrix td.zelle.gesetzt-temp  { background: rgba(179,114,30,.10); color: var(--gelb); }
table.matrix td.zelle.gesetzt-sperr { background: rgba(179,38,30,.12); color: var(--rot); }
table.matrix tfoot td {
  position: sticky; bottom: 0; background: var(--flaeche-3); font-weight: 700;
  font-size: 12px; text-align: center; z-index: 3; padding: 6px 2px;
}
table.matrix tfoot td.tuername { z-index: 5; text-align: left; }

.matrix-legende {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px;
  font-size: 12.5px; color: var(--text-schwach);
}
.matrix-legende b { color: var(--akzent); margin-right: 3px; }

/* --- Dialog -------------------------------------------------------------- */
.dialog-hinter {
  position: fixed; inset: 0; background: rgba(12,18,26,.55); z-index: 50;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 20px; overflow-y: auto; -webkit-overflow-scrolling: touch;
  backdrop-filter: blur(2px);
}
.dialog {
  background: var(--flaeche); border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.35);
  width: 100%; max-width: 940px; margin: auto 0; border: 1px solid var(--rand);
}
.dialog.klein { max-width: 480px; }
.dialog > .kopf {
  display: flex; align-items: center; gap: 12px; padding: 14px 18px;
  border-bottom: 1px solid var(--rand); position: sticky; top: 0;
  background: var(--flaeche); border-radius: 14px 14px 0 0; z-index: 2;
}
.dialog > .kopf h2 { margin: 0; border: 0; padding: 0; font-size: 17px; flex: 1; }
.dialog > .koerper { padding: 18px; }
.dialog > .fuss {
  display: flex; gap: 9px; padding: 14px 18px; border-top: 1px solid var(--rand);
  position: sticky; bottom: 0; background: var(--flaeche); border-radius: 0 0 14px 14px;
  padding-bottom: max(14px, env(safe-area-inset-bottom));
}
.dialog > .fuss .fuellen { flex: 1; }

/* --- Abschnitte im Türformular ------------------------------------------- */
.abschnitt {
  border: 1px solid var(--rand); border-radius: var(--radius);
  margin-bottom: 12px; overflow: hidden; background: var(--flaeche);
}
.abschnitt > summary {
  padding: 12px 15px; font-weight: 700; font-size: 14.5px; cursor: pointer;
  background: var(--flaeche-3); list-style: none; display: flex;
  align-items: center; gap: 9px; min-height: var(--tap);
}
.abschnitt > summary::-webkit-details-marker { display: none; }
.abschnitt > summary::before {
  content: '▸'; color: var(--text-zart); font-size: 13px; transition: transform .15s;
}
.abschnitt[open] > summary::before { transform: rotate(90deg); }
.abschnitt > summary .zusatz {
  margin-left: auto; font-weight: 500; font-size: 12px; color: var(--text-zart);
}
.abschnitt > .koerper { padding: 15px; }

/* --- Fotos --------------------------------------------------------------- */
.foto-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 11px; }
.foto-karte {
  border: 1px solid var(--rand); border-radius: var(--radius-klein);
  overflow: hidden; background: var(--flaeche-2);
}
.foto-karte img { width: 100%; height: 100px; object-fit: cover; display: block; background: var(--flaeche-3); }
.foto-karte .unten { padding: 6px; display: flex; flex-direction: column; gap: 5px; }
.foto-karte input { font-size: 12.5px; padding: 5px 7px; min-height: 32px; }
.foto-karte button { padding: 4px 8px; font-size: 12px; min-height: 30px; }

/* --- Meldungen ----------------------------------------------------------- */
.meldung {
  padding: 11px 14px; border-radius: var(--radius-klein); font-size: 13.5px;
  margin-bottom: 12px; border: 1px solid; display: flex; gap: 9px; align-items: flex-start;
}
.meldung.info  { background: var(--akzent-bg); border-color: var(--akzent); color: var(--akzent); }
.meldung.warn  { background: rgba(179,114,30,.12); border-color: var(--gelb); color: var(--gelb); }
.meldung.fehler{ background: rgba(179,38,30,.10); border-color: var(--rot); color: var(--rot); }
.meldung.ok    { background: rgba(31,122,61,.10); border-color: var(--gruen); color: var(--gruen); }

#toast-bereich {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: max(22px, env(safe-area-inset-bottom)); z-index: 90;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none; width: calc(100% - 32px); max-width: 480px;
}
.toast {
  background: #1a1f26; color: #fff; padding: 11px 18px; border-radius: 22px;
  font-size: 14px; font-weight: 500; box-shadow: 0 6px 22px rgba(0,0,0,.35);
  animation: einblenden .18s ease-out; text-align: center;
}
.toast.fehler { background: var(--rot); }
.toast.ok { background: var(--gruen); }
@keyframes einblenden { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* --- Kennzahlen ---------------------------------------------------------- */
.kennzahlen { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 11px; }
.kennzahl {
  background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius);
  padding: 13px; text-align: center;
}
.kennzahl .wert { font-size: 25px; font-weight: 700; color: var(--akzent); line-height: 1.15; }
.kennzahl .bez { font-size: 11.5px; color: var(--text-schwach); margin-top: 3px; }

/* --- Leerzustand --------------------------------------------------------- */
.leer {
  text-align: center; padding: 44px 20px; color: var(--text-schwach);
  border: 2px dashed var(--rand); border-radius: var(--radius); background: var(--flaeche);
}
.leer h3 { color: var(--text); margin: 0 0 7px; font-size: 16px; }
.leer p { margin: 0 0 16px; font-size: 14px; }

/* --- Projektkarten ------------------------------------------------------- */
.projekt-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 13px; }
.projekt-karte {
  background: var(--flaeche); border: 1px solid var(--rand); border-radius: var(--radius);
  padding: 15px; cursor: pointer; display: flex; flex-direction: column; gap: 7px;
  box-shadow: var(--schatten);
}
.projekt-karte:hover { border-color: var(--akzent); }
.projekt-karte .titel { font-weight: 700; font-size: 15.5px; }
.projekt-karte .zeile { font-size: 13px; color: var(--text-schwach); }
.projekt-karte .zahlen { display: flex; gap: 14px; margin-top: 5px; font-size: 12px; color: var(--text-zart); }
.projekt-karte .zahlen b { color: var(--text); font-size: 14px; }
.projekt-karte .aktionen { display: flex; gap: 7px; margin-top: 9px; }

/* --- Hilfsklassen -------------------------------------------------------- */
.zeile-verteilt { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.zeile-verteilt .fuellen { flex: 1; }
.trenner { height: 1px; background: var(--rand-zart); margin: 16px 0; border: 0; }
.zart { color: var(--text-zart); font-size: 12.5px; }
.mono { font-variant-numeric: tabular-nums; }
.versteckt { display: none !important; }
.nur-lesen { opacity: .6; pointer-events: none; }

/* --- Anpassung an kleine Geräte ------------------------------------------ */
@media (max-width: 700px) {
  main.inhalt { padding: 12px; }
  .kopf .marke small { display: none; }
  .tuer-zeile .inhalt { flex-wrap: wrap; gap: 7px; }
  .tuer-zeile .nummer { min-width: 0; }
  .tuer-zeile .marken { width: 100%; justify-content: flex-start; }
  table.matrix th.ecke, table.matrix td.tuername { min-width: 160px; max-width: 160px; }
  .dialog-hinter { padding: 0; }
  .dialog { border-radius: 0; min-height: 100%; max-width: none; }
  .dialog > .kopf, .dialog > .fuss { border-radius: 0; }
}

/* --- Druck: der PDF-Export ist der vorgesehene Weg ----------------------- */
@media print {
  nav.reiter, header.kopf, .werkzeuge, .knopfleiste, #toast-bereich { display: none !important; }
  main.inhalt { overflow: visible; padding: 0; }
  .karte, .tuer-liste { box-shadow: none; break-inside: avoid; }
}

      if (t.nummer) {

        }

      }
      if (!t.strukturId) {

      }
      if (!t.systemId) {
        probleme.push({ schwere: 'warn', tuerId: t.id, text: bez + ': kein Schließsystem ausgewählt' });
      }
      if (t.brauchtZylinder && !t.zylinderBauform) {
        probleme.push({ schwere: 'warn', tuerId: t.id, text: bez + ': Zylinder benötigt, aber keine Bauform gewählt' });
      }
      if (t.brauchtZylinder && t.zylinderBauform && !t.masseAussen && !t.masseInnen) {
        probleme.push({ schwere: 'warn', tuerId: t.id, text: bez + ': keine Zylinderlänge erfasst' });
      }
      if (t.brauchtBeschlag && !t.beschlagBauform) {
        probleme.push({ schwere: 'info', tuerId: t.id, text: bez + ': Beschlag benötigt, aber keine Bauform gewählt' });
      }

        probleme.push({ schwere: 'info', tuerId: t.id, text: bez + ': Schloss benötigt, aber keine Bauform gewählt' });
      }
      if (t.brauchtZylinder && !t.zutrittsseite) {
        probleme.push({ schwere: 'info', tuerId: t.id, text: bez + ': Zutrittsseite nicht angegeben' });
      }
      if (t.nacharbeit && !t.nacharbeitText) {
        probleme.push({ schwere: 'info', tuerId: t.id, text: bez + ': Nacharbeit markiert, aber nicht beschrieben' });
      }
      var istFlucht = (t.tueranforderungen || []).indexOf('Flucht- und Rettungsweg') !== -1;
      if (istFlucht && t.brauchtSchloss && t.schlossFunktion && !/Panik/.test(t.schlossFunktion)) {
        probleme.push({ schwere: 'warn', tuerId: t.id,
          text: bez + ': Flucht- und Rettungsweg gewählt, das Schloss hat aber keine Panikfunktion' });
      }
      if (istFlucht && !t.brauchtSchloss) {
        probleme.push({ schwere: 'warn', tuerId: t.id,
          text: bez + ': Flucht- und Rettungsweg gewählt, aber kein Schloss erfasst' });
      }
      if ((t.zylinderAusfuehrung || []).indexOf('Anti-Panik') !== -1 && !istFlucht) {

          var b = K.beschlagText(t);
          if (!b) return '–';
          return b + (t.vierkant ? ('\nVK ' + t.vierkant) : ''); } },
      { titel: 'Schloss',        breite: 0.105, render: function (t) {
          var sch = K.schlossText(t);
          if (!sch) return '–';
          var d = [];
          if (t.dornmass) d.push('DM ' + t.dornmass);
          if (t.entfernung) d.push('E ' + t.entfernung);
          return sch + (d.length ? ('\n' + d.join(' / ')) : ''); } },
      { titel: 'Zutritt / Anforderungen', breite: 0.125, render: zutrittKurz },
      { titel: 'DIN',            breite: 0.045, align: 'center', render: function (t) {
          return txt(t.dinRichtung).replace('DIN ', ''); } },
      { titel: 'Bemerkung',      breite: 0.086, render: function (t) {
          var n = [];
          if (t.notiz) n.push(t.notiz);
          if (t.nacharbeit) n.push('! ' + (t.nacharbeitText || 'Nacharbeit'));
          return n.join('\n'); } }
    ];
    var spalten = anteile.map(function (s) {
      var c = {}; for (var k in s) c[k] = s[k];
      c.breite = s.breite * b;
      return c;
    });

    var zeilen = [];
    gruppen.forEach(function (g) {
      var anz = g.tueren.reduce(function (s, t) { return s + (parseInt(t.anzahl, 10) || 1); }, 0);
      zeilen.push({ __gruppe: g.titel,
        __gruppeRechts: plural(g.tueren.length, 'Position', 'Positionen') + '  ·  ' + plural(anz, 'Tür', 'Türen') });
      g.tueren.forEach(function (t) {
        var kopie = Object.create(t);
        kopie.__markierung = t.nacharbeit ? FARBE.fehler : (K.statusById(t.status).farbe);
        zeilen.push(kopie);
      });
    });
    tabelle(doc, spalten, zeilen, { size: 7.2 });
  }

  function tuerlisteDetail(doc, projekt, gruppen, einstellungen, mitFotos) {
    var b = doc.inhaltsBreite();
    var x = doc.rand.links;

    gruppen.forEach(function (g) {
      doc.platzPruefen(16);
      doc.rechteck(x, doc.y, b, 7, { fill: '#dce6f2', stroke: FARBE.linie, width: 0.25 });
      doc.text(g.titel, x + 2, doc.y + 1.6, { size: 9.5, bold: true, color: FARBE.akzent });
      doc.text(plural(g.tueren.length, 'Tür', 'Türen'), x + b - 2, doc.y + 1.9,
               { size: 7.5, align: 'right', color: FARBE.grau });
      doc.y += 10;

      g.tueren.forEach(function (t) {
        tuerDatenblatt(doc, projekt, t, einstellungen, mitFotos);
      });
    });
  }

  function tuerDatenblatt(doc, projekt, t, einstellungen, mitFotos) {
    var x = doc.rand.links, b = doc.inhaltsBreite();
    var fotos = mitFotos ? (t.fotos || []) : [];

    var felder = [
      ['System', t.systemId ? K.systemLabel(t.systemId, einstellungen && einstellungen.eigeneSysteme) : '–'],
      ['Technologie', (K.TECHNOLOGIE.filter(function (x2) {
          return x2.id === K.systemTechnologie(t.systemId, einstellungen && einstellungen.eigeneSysteme);
        })[0] || {}).label || '–'],
      ['Kategorie', t.kategorie],
      ['Anzahl', String(t.anzahl || 1)],
      ['Zylinder', K.zylinderText(t) || (t.brauchtZylinder ? '' : 'kein Zylinder')],
      ['Zylinderlänge außen/innen', zylinderMass(t) ? zylinderMass(t) + ' mm' : ''],
      ['Beschlag / Drücker', K.beschlagText(t) || (t.brauchtBeschlag ? '' : 'kein Beschlag')],
      ['Schloss', K.schlossText(t)],
      ['Wandleser', t.brauchtWandleser ? 'ja' : ''],
      ['Zutrittsseite', t.zutrittsseite],
      ['Bauliche Anforderungen', (t.tueranforderungen || []).join(', '), true],
      ['Systemkomponenten', (t.komponenten || []).join(', '), true],
      ['DIN-Richtung', t.dinRichtung],
      ['Öffnungsrichtung', t.oeffnungsrichtung],
      ['Türblattstärke', t.tuerblattstaerke ? t.tuerblattstaerke + ' mm' : ''],
      ['Dornmaß', t.dornmass ? t.dornmass + ' mm' : ''],
      ['Entfernung', t.entfernung ? t.entfernung + ' mm' : ''],
      ['Vierkant', t.vierkant ? t.vierkant + ' mm' : ''],
      ['Profilbreite', t.profilbreite],
      ['Stulpmaß', t.stulpmass],
      ['Bohrbild', t.bohrbild],
      ['Türmaterial', t.tuermaterial],
      ['Systemdetail', t.systemDetail, true],
      ['Maß-Bemerkung', t.masseBemerkung, true],
      ['Bestand Fabrikat', t.bestandFabrikat],
      ['Bestand Zylinderart', t.bestandZylinderart],
      ['Bestand Länge', t.bestandLaenge],
      ['Bestand Schlüsselanzahl', t.bestandAnzahlSchluessel],
      ['Bestand Bemerkung', t.bestandBemerkung, true],
      ['Funkabdeckung', t.elFunkabdeckung],
      ['Stromversorgung', t.elStromversorgung],
      ['Vernetzung', t.elVernetzung],
      ['Türüberwachung', t.elTuerueberwachung ? 'ja' : ''],
      ['Elektronik-Bemerkung', t.elBemerkung, true]
    ].filter(function (f) { return txt(f[1]) && txt(f[1]) !== '–' || f[0] === 'System'; });

    var spaltenAnzahl = 3;
    var spaltenBreite = b / spaltenAnzahl;
    var kopfHoehe = 8;
    var status = K.statusById(t.status);

    /* Rasterzeilen bilden und ihre Höhe am längsten Wert ausrichten, damit
       lange Werte (z. B. mehrere Zutrittsarten) vollständig lesbar bleiben. */
    var rasterZeilen = [];
    var puffer = [];
    function pufferAbschliessen() {
      if (!puffer.length) return;
      var maxH = 0;
      puffer.forEach(function (f) {
        var h = doc.blockHoehe(txt(f[1]), spaltenBreite - 4, { size: 8, maxLines: 2 });
        if (h > maxH) maxH = h;
      });
      rasterZeilen.push({ felder: puffer.slice(), voll: false, hoehe: Math.max(3.4, maxH) + 4.6 });
      puffer = [];
    }
    felder.forEach(function (f) {
      /* Lange Werte (mehrere Zutrittsarten, Komponentenlisten, Bemerkungen)
         bekommen eine eigene Zeile über die volle Breite, statt zu kürzen. */
      var braucht = doc.blockHoehe(txt(f[1]), spaltenBreite - 4, { size: 8 });
      var passtInSpalte = braucht <= doc.blockHoehe('X', spaltenBreite - 4, { size: 8 }) * 2 + 0.01;
      if (f[2] && !passtInSpalte) {
        pufferAbschliessen();
        rasterZeilen.push({
          felder: [f], voll: true,
          hoehe: doc.blockHoehe(txt(f[1]), b - 4, { size: 8, maxLines: 3 }) + 4.6
        });
        return;
      }
      puffer.push(f);
      if (puffer.length === spaltenAnzahl) pufferAbschliessen();
    });
    pufferAbschliessen();

    var feldHoeheGesamt = rasterZeilen.reduce(function (a, r) { return a + r.hoehe; }, 0);
    var notizHoehe = 0;
    if (t.notiz) notizHoehe += doc.blockHoehe(t.notiz, b - 26, { size: 8 }) + 2;
    if (t.nacharbeit) notizHoehe += doc.blockHoehe(t.nacharbeitText || 'Nacharbeit erforderlich', b - 26, { size: 8 }) + 2;
    var fotoHoehe = fotos.length ? 34 : 0;
    var gesamt = kopfHoehe + feldHoeheGesamt + notizHoehe + fotoHoehe + 8;

    /* Passt das Datenblatt komplett auf eine Seite, wird es nicht zerrissen.
       Andernfalls beginnt es auf einer frischen Seite und wird sauber
       umbrochen - kein Feld darf verloren gehen. */
    if (gesamt <= doc.inhaltsHoehe()) doc.platzPruefen(gesamt);
    else doc.platzPruefen(kopfHoehe + rasterZeilen.slice(0, 3)
      .reduce(function (a, r) { return a + r.hoehe; }, 0));

    function kopfZeichnen(fortsetzung) {
      var startY = doc.y;
      doc.rechteck(x, startY, b, kopfHoehe, { fill: '#eef2f7', stroke: FARBE.linie, width: 0.3 });
      doc.rechteck(x, startY, 1.6, kopfHoehe, { fill: t.nacharbeit ? FARBE.fehler : status.farbe });
      var titel = (t.nummer ? t.nummer + '  ·  ' : '') + (t.bezeichnung || 'ohne Bezeichnung');
      if (fortsetzung) titel += '   (Fortsetzung)';
      doc.text(doc.kuerzen(titel, b - 70, 10.5, true), x + 4, startY + 2, { size: 10.5, bold: true });
      doc.text(status.label + (t.nacharbeit ? '  ·  NACHARBEIT' : ''), x + b - 3, startY + 2.4,
               { size: 7.5, align: 'right', bold: true, color: t.nacharbeit ? FARBE.fehler : status.farbe });
      doc.y = startY + kopfHoehe + 1.5;
    }

    kopfZeichnen(false);

    /* Felder in drei Spalten, mit Seitenumbruch statt Abschneiden */
    rasterZeilen.forEach(function (rz) {
      if (doc.y + rz.hoehe > doc.hoehe - doc.rand.unten) {
        doc.neueSeite();
        kopfZeichnen(true);
      }
      var fy = doc.y;
      if (rz.voll) {
        var fv = rz.felder[0];
        doc.text(fv[0], x + 2, fy, { size: 6.6, color: FARBE.hellgrau });
        doc.textBlock(txt(fv[1]), x + 2, fy + 3.1, b - 4, { size: 8, maxLines: 3 });
      } else {
        rz.felder.forEach(function (f, sp) {
          var fx = x + sp * spaltenBreite + 2;
          doc.text(f[0], fx, fy, { size: 6.6, color: FARBE.hellgrau });
          doc.textBlock(txt(f[1]), fx, fy + 3.1, spaltenBreite - 4, { size: 8, maxLines: 2 });
          if (sp > 0) {
            doc.linie(x + sp * spaltenBreite, fy - 0.5, x + sp * spaltenBreite, fy + rz.hoehe - 1.2,
                      { color: FARBE.linieHell, width: 0.15 });
          }
        });
      }
      doc.y = fy + rz.hoehe;
    });
    doc.y += 1;

    /* Notiz / Nacharbeit */
    if (t.notiz) {
      doc.platzPruefen(8);
      doc.text('Bemerkung', x + 2, doc.y, { size: 6.6, color: FARBE.hellgrau });
      doc.y += doc.textBlock(t.notiz, x + 24, doc.y, b - 26, { size: 8 }) + 1.5;
    }
    if (t.nacharbeit) {
      doc.platzPruefen(8);
      doc.text('Nacharbeit', x + 2, doc.y, { size: 6.6, bold: true, color: FARBE.fehler });
      doc.y += doc.textBlock(t.nacharbeitText || 'Nacharbeit erforderlich', x + 24, doc.y, b - 26,
                             { size: 8, color: FARBE.fehler }) + 1.5;
    }

    /* Fotos */
    if (fotos.length) {
      doc.platzPruefen(34);
      var fx2 = x + 2, maxH = 30;
      fotos.slice(0, 4).forEach(function (foto) {
        var id = doc.bildRegistrieren(foto.dataUrl);
        if (!id) return;
        var gez = doc.bild(id, fx2, doc.y, 42, maxH);
        if (gez) {
          doc.rechteck(fx2, doc.y, gez.breite, gez.hoehe, { stroke: FARBE.linie, width: 0.2 });
          if (foto.beschriftung) {
            doc.text(doc.kuerzen(foto.beschriftung, gez.breite, 6.4, false), fx2, doc.y + gez.hoehe + 0.6,
                     { size: 6.4, color: FARBE.hellgrau });
          }
          fx2 += gez.breite + 3;
        }
      });
      doc.y += maxH + 4;
    }

    doc.linie(x, doc.y, x + b, doc.y, { color: FARBE.linie, width: 0.3 });
    doc.y += 4;
  }

  function zusammenfassung(doc, projekt, einstellungen) {
    var s = M.statistik(projekt);
    var x = doc.rand.links, b = doc.inhaltsBreite();
    doc.platzPruefen(26);
    doc.y += 3;
    doc.text('Zusammenfassung', x, doc.y, { size: 10, bold: true, color: FARBE.akzent });
    doc.y += 6;
    var werte = [
      ['Positionen', String(s.tueren)],
      ['Türen gesamt', String(s.tuerenGesamtAnzahl)],
      ['Fotos', String(s.fotos)],
      ['Nacharbeit', String(s.nacharbeit)],
      ['Schließungen', String(s.schliessungen)],
      ['Berechtigungen', String(s.berechtigungen)]
    ];
    var kw = b / werte.length;
    werte.forEach(function (w, i) {
      var kx = x + i * kw;
      doc.rechteck(kx, doc.y, kw - 2, 12, { fill: FARBE.zebraBg, stroke: FARBE.linieHell });
      doc.text(w[1], kx + kw / 2 - 1, doc.y + 1.5, { size: 12, bold: true, align: 'center', color: FARBE.akzent });
      doc.text(w[0], kx + kw / 2 - 1, doc.y + 7.8, { size: 6.8, align: 'center', color: FARBE.grau });
    });
    doc.y += 16;

    if (projekt.bemerkung) {
      doc.platzPruefen(12);
      doc.text('Projektbemerkung', x, doc.y, { size: 8, bold: true });
      doc.y += 4;
      doc.y += doc.textBlock(projekt.bemerkung, x, doc.y, b, { size: 8, color: FARBE.grau });
    }

    doc.platzPruefen(24);
    doc.y += 8;
    var sb = (b - 10) / 2;
    [['Aufgenommen durch (Datum, Unterschrift)', x],
     ['Kunde / Bestätigung (Datum, Unterschrift)', x + sb + 10]].forEach(function (u) {
      doc.linie(u[1], doc.y + 10, u[1] + sb, doc.y + 10, { color: FARBE.grau, width: 0.3 });
      doc.text(u[0], u[1], doc.y + 11, { size: 7, color: FARBE.hellgrau });
    });
    doc.y += 18;
  }

  /* =========================================================================
   * 2) KREUZSCHLIESSPLAN / ZUTRITTSMATRIX
   * Türen = Zeilen, Schließungen = Spalten. Bei vielen Spalten wird auf
   * mehrere Seitenblöcke umbrochen, die Türspalte wiederholt sich dabei.
   * ====================================================================== */
  function schliessplan(projekt, einstellungen, optionen) {
    optionen = optionen || {};
    var doc = new PDF.Doc({
      format: optionen.format || 'a4', orientation: 'landscape',
      titel: 'Kreuzschließplan ' + (projekt.kunde || projekt.name),
      autor: einstellungen && einstellungen.firma || '',
      betreff: 'Kreuzschließplan / Zutrittsmatrix',
      margin: { oben: 12, unten: 14, links: 10, rechts: 10 }
    });
    kopfUndFussSetzen(doc, projekt, einstellungen, 'Kreuzschließplan / Zutrittsmatrix');
    doc.neueSeite();
    projektKopfBlock(doc, projekt);

    var schliessungen = projekt.schliessungen.slice().sort(function (a, b2) {
      return (a.sort - b2.sort) || String(a.kuerzel).localeCompare(String(b2.kuerzel), 'de', { numeric: true });
    });
    var gruppen = M.tuerenGruppiert(projekt);

    if (!schliessungen.length || !projekt.tueren.length) {
      doc.text('Für den Kreuzschließplan werden mindestens eine Tür und eine Schließung benötigt.',
               doc.rand.links, doc.y, { size: 10, color: FARBE.grau });
      return doc;
    }

    var b = doc.inhaltsBreite();
    var tuerSpalte = Math.min(78, Math.max(52, b * 0.26));
    var spaltenBreite = optionen.spaltenBreite || 7.2;
    var verfuegbar = b - tuerSpalte;
    var proSeite = Math.max(1, Math.floor(verfuegbar / spaltenBreite));

    var bloecke = [];
    for (var i = 0; i < schliessungen.length; i += proSeite) {
      bloecke.push(schliessungen.slice(i, i + proSeite));
    }

    bloecke.forEach(function (block, blockIndex) {
      if (blockIndex > 0) { doc.neueSeite(); doc.y += 2; }
      if (bloecke.length > 1) {
        doc.text('Spaltenblock ' + (blockIndex + 1) + ' von ' + bloecke.length +
                 '  (Schließungen ' + (blockIndex * proSeite + 1) + '–' +
                 (blockIndex * proSeite + block.length) + ' von ' + schliessungen.length + ')',
                 doc.rand.links, doc.y, { size: 7.5, color: FARBE.grau });
        doc.y += 5;
      }
      matrixBlock(doc, projekt, gruppen, block, tuerSpalte, spaltenBreite, einstellungen);
    });

    legende(doc, schliessungen);
    return doc;
  }

  function matrixBlock(doc, projekt, gruppen, block, tuerSpalte, spaltenBreite, einstellungen) {
    var x0 = doc.rand.links;
    var gesamtBreite = tuerSpalte + block.length * spaltenBreite;
    var zeilenHoehe = 5.4;

    /* Kopfhöhe aus dem längsten Spaltentitel ableiten */
    var kopfTexte = block.map(function (s) {
      return (s.kuerzel ? s.kuerzel + ' ' : '') + (s.bezeichnung || '');
    });
    var maxTextBreite = 0;
    kopfTexte.forEach(function (t) {
      var w = doc.textBreite(t, 7, true);
      if (w > maxTextBreite) maxTextBreite = w;
    });
    var medienZeile = 3.4;   /* eigene Zone am Kopfende für die Stückzahl */
    var kopfHoehe = Math.min(60, Math.max(24, maxTextBreite + 6 + medienZeile));

    function kopfZeichnen() {
      doc.platzPruefen(kopfHoehe + 3 * zeilenHoehe);
      var y = doc.y;
      doc.rechteck(x0, y, gesamtBreite, kopfHoehe, { fill: FARBE.kopfBg, stroke: FARBE.linie, width: 0.3 });
      doc.text('Tür / Schließung', x0 + 2, y + kopfHoehe - 5, { size: 7.5, bold: true });
      block.forEach(function (s, i) {
        var cx = x0 + tuerSpalte + i * spaltenBreite;
        doc.linie(cx, y, cx, y + kopfHoehe, { color: FARBE.linie, width: 0.25 });
        var text = doc.kuerzen(kopfTexte[i] || '–', kopfHoehe - medienZeile - 4, 7, true);
        doc.textRotiert(text, cx + spaltenBreite / 2 + 2.4, y + kopfHoehe - medienZeile - 2,
                        { size: 7, bold: true });
        var anz = parseInt(s.anzahlMedien, 10);
        if (anz > 0) {
          doc.text(String(anz), cx + spaltenBreite / 2, y + kopfHoehe - medienZeile + 0.1,
                   { size: 5.6, align: 'center', color: FARBE.grau });
        }
      });
      doc.linie(x0 + tuerSpalte, y, x0 + tuerSpalte, y + kopfHoehe, { color: FARBE.linie, width: 0.4 });
      doc.linie(x0 + tuerSpalte, y + kopfHoehe - medienZeile, x0 + gesamtBreite,
                y + kopfHoehe - medienZeile, { color: FARBE.linie, width: 0.2 });
      doc.text('Stk', x0 + tuerSpalte - 2, y + kopfHoehe - medienZeile + 0.1,
               { size: 5.6, align: 'right', color: FARBE.hellgrau });
      doc.y = y + kopfHoehe;
    }

    kopfZeichnen();
    var zebra = 0;

    gruppen.forEach(function (g) {
      /* Gruppenzeile */
      if (doc.platzPruefen(zeilenHoehe * 3)) { kopfZeichnen(); zebra = 0; }
      var gy = doc.y;
      doc.rechteck(x0, gy, gesamtBreite, 5, { fill: '#dce6f2', stroke: FARBE.linie, width: 0.25 });
      doc.text(doc.kuerzen(g.titel, gesamtBreite - 6, 7.6, true), x0 + 2, gy + 0.9,
               { size: 7.6, bold: true, color: FARBE.akzent });
      doc.y = gy + 5;
      zebra = 0;

      g.tueren.forEach(function (t) {
        if (doc.platzPruefen(zeilenHoehe)) { kopfZeichnen(); zebra = 0; }
        var y = doc.y;
        if (zebra % 2 === 1) doc.rechteck(x0, y, gesamtBreite, zeilenHoehe, { fill: FARBE.zebraBg });

        var label = (t.nummer ? t.nummer + ' ' : '') + (t.bezeichnung || '');
        if (t.anzahl > 1) label += ' (' + t.anzahl + 'x)';
        doc.text(doc.kuerzen(label || '–', tuerSpalte - 4, 7, false), x0 + 2, y + 1.1, { size: 7 });

        var raster = [];
        block.forEach(function (s, i) {
          var cx = x0 + tuerSpalte + i * spaltenBreite;
          var wert = M.getBerechtigung(projekt, t.id, s.id);
          var zeichen = K.berechtigungZeichen(wert);
          raster.push([cx, y, cx, y + zeilenHoehe]);
          if (zeichen) {
            var farbe = wert === 'sperr' ? FARBE.fehler : (wert === 'ja' ? FARBE.akzent : FARBE.warn);
            doc.text(zeichen, cx + spaltenBreite / 2, y + 0.9,
                     { size: 8, bold: true, align: 'center', color: farbe });
          }
        });
        raster.push([x0, y + zeilenHoehe, x0 + gesamtBreite, y + zeilenHoehe]);
        doc.linienGruppe(raster, { color: FARBE.linieHell, width: 0.15 });
        doc.linie(x0 + tuerSpalte, y, x0 + tuerSpalte, y + zeilenHoehe, { color: FARBE.linie, width: 0.4 });
        doc.y = y + zeilenHoehe;
        zebra++;
      });
    });

    /* Summenzeile: Anzahl berechtigter Türen je Schließung */
    if (doc.platzPruefen(zeilenHoehe + 2)) kopfZeichnen();
    var sy = doc.y;
    doc.rechteck(x0, sy, gesamtBreite, zeilenHoehe, { fill: FARBE.kopfBg, stroke: FARBE.linie, width: 0.3 });
    doc.text('Summe berechtigter Türen', x0 + 2, sy + 1.1, { size: 7, bold: true });
    block.forEach(function (s, i) {
      var cx = x0 + tuerSpalte + i * spaltenBreite;
      var summe = 0;
      projekt.tueren.forEach(function (t) {
        var w = M.getBerechtigung(projekt, t.id, s.id);
        if (w !== 'nein' && w !== 'sperr') summe += (parseInt(t.anzahl, 10) || 1);
      });
      doc.linie(cx, sy, cx, sy + zeilenHoehe, { color: FARBE.linie, width: 0.25 });
      doc.text(String(summe), cx + spaltenBreite / 2, sy + 1.1,
               { size: 6.8, align: 'center', bold: true, color: FARBE.akzent });
    });
    doc.y = sy + zeilenHoehe + 4;
  }

  function legende(doc, schliessungen) {
    var x = doc.rand.links, b = doc.inhaltsBreite();
    doc.platzPruefen(30);
    doc.y += 3;

  /* =========================================================================

  function materialliste(projekt, einstellungen) {

  /* =========================================================================

/* ==== js/store.js ==== */
/* =============================================================================
 * store.js — Persistenz (IndexedDB mit localStorage-Rückfallebene),
 *            Export/Import und Bildverarbeitung.
 * Alles läuft ausschließlich auf dem Gerät; es werden keine Daten übertragen.
 * ========================================================================== */
(function (global) {
  'use strict';

  var DB_NAME = 'aufmass-tool';
  var DB_VERSION = 1;
  var STORE_PROJEKTE = 'projekte';
  var STORE_META = 'meta';
  var LS_PRAEFIX = 'aufmass.';

  var db = null;
  var nutztFallback = false;

  /* --- IndexedDB öffnen ---------------------------------------------------- */
  function oeffnen() {
    return new Promise(function (resolve) {
      if (db) return resolve(db);
      if (!global.indexedDB) { nutztFallback = true; return resolve(null); }
      var anfrage;
      try { anfrage = global.indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { nutztFallback = true; return resolve(null); }

      anfrage.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_PROJEKTE)) {
          d.createObjectStore(STORE_PROJEKTE, { keyPath: 'id' });
        }
        if (!d.objectStoreNames.contains(STORE_META)) {
          d.createObjectStore(STORE_META, { keyPath: 'schluessel' });
        }
      };
      anfrage.onsuccess = function (e) { db = e.target.result; resolve(db); };
      anfrage.onerror = function () {
        /* Bei privatem Modus in Safari kann IndexedDB blockiert sein. */
        nutztFallback = true; resolve(null);
      };
      /* Safari im privaten Modus blockiert gelegentlich ohne Event */
      setTimeout(function () { if (!db && !nutztFallback) { nutztFallback = true; resolve(null); } }, 3000);
    });
  }

  function tx(store, modus) {
    return db.transaction(store, modus).objectStore(store);
  }
  function alsPromise(anfrage) {
    return new Promise(function (resolve, reject) {
      anfrage.onsuccess = function () { resolve(anfrage.result); };
      anfrage.onerror = function () { reject(anfrage.error); };
    });
  }

  /* --- localStorage-Rückfallebene ----------------------------------------- */
  function lsSchluesselListe() {
    var out = [];
    for (var i = 0; i < global.localStorage.length; i++) {
      var k = global.localStorage.key(i);
      if (k && k.indexOf(LS_PRAEFIX + 'projekt.') === 0) out.push(k);
    }
    return out;
  }

  /* --- Projekte ------------------------------------------------------------ */
  function alleProjekte() {
    return oeffnen().then(function (d) {
      if (!d) {
        return lsSchluesselListe().map(function (k) {
          try { return JSON.parse(global.localStorage.getItem(k)); } catch (e) { return null; }
        }).filter(Boolean);
      }
      return alsPromise(tx(STORE_PROJEKTE, 'readonly').getAll());
    }).then(function (liste) {
      return (liste || []).sort(function (a, b) {
        return String(b.geaendert || '').localeCompare(String(a.geaendert || ''));
      });
    });
  }

  function projektLaden(id) {
    return oeffnen().then(function (d) {
      if (!d) {
        var roh = global.localStorage.getItem(LS_PRAEFIX + 'projekt.' + id);
        return roh ? JSON.parse(roh) : null;
      }
      return alsPromise(tx(STORE_PROJEKTE, 'readonly').get(id));
    });
  }

  function projektSpeichern(projekt) {
    projekt.geaendert = new Date().toISOString();
    return oeffnen().then(function (d) {
      if (!d) {
        try {
          global.localStorage.setItem(LS_PRAEFIX + 'projekt.' + projekt.id, JSON.stringify(projekt));
        } catch (e) {
          return Promise.reject(new Error('Speicher voll. Bitte Fotos reduzieren oder Projekte exportieren und löschen.'));
        }
        return projekt;
      }
      return alsPromise(tx(STORE_PROJEKTE, 'readwrite').put(projekt)).then(function () { return projekt; });
    });
  }

  function projektLoeschen(id) {
    return oeffnen().then(function (d) {
      if (!d) { global.localStorage.removeItem(LS_PRAEFIX + 'projekt.' + id); return true; }
      return alsPromise(tx(STORE_PROJEKTE, 'readwrite').delete(id)).then(function () { return true; });
    });
  }

  /* --- Einstellungen (Firmenkopf, Logo, eigene Systeme) -------------------- */
  var EINSTELLUNGEN_STANDARD = {
    firma: '',
    firmaZusatz: '',
    firmaTelefon: '',
    firmaEmail: '',
    logoDataUrl: '',
    standardBearbeiter: '',
    eigeneSysteme: [],
    eigeneZylinderarten: [],
    eigeneZutrittsarten: [],
    eigeneBeschlagarten: [],
    eigeneSchlossarten: [],
    fotoQualitaet: 0.72,
    fotoMaxKante: 1280,
    letztesProjekt: ''
  };

  function einstellungenLaden() {
    return oeffnen().then(function (d) {
      if (!d) {
        var roh = global.localStorage.getItem(LS_PRAEFIX + 'einstellungen');
        return roh ? JSON.parse(roh) : {};
      }
      return alsPromise(tx(STORE_META, 'readonly').get('einstellungen')).then(function (e) {
        return e ? e.wert : {};
      });
    }).then(function (gespeichert) {
      var out = {};
      Object.keys(EINSTELLUNGEN_STANDARD).forEach(function (k) {
        out[k] = (gespeichert && gespeichert[k] !== undefined) ? gespeichert[k] : EINSTELLUNGEN_STANDARD[k];
      });
      return out;
    }).catch(function () { return Object.assign({}, EINSTELLUNGEN_STANDARD); });
  }

  function einstellungenSpeichern(werte) {
    return oeffnen().then(function (d) {
      if (!d) {
        global.localStorage.setItem(LS_PRAEFIX + 'einstellungen', JSON.stringify(werte));
        return werte;
      }
      return alsPromise(tx(STORE_META, 'readwrite').put({ schluessel: 'einstellungen', wert: werte }))
        .then(function () { return werte; });
    });
  }

  /* --- Export / Import ----------------------------------------------------- */
  function exportDaten(projekt, einstellungen, mitFotos) {
    var kopie = JSON.parse(JSON.stringify(projekt));
    if (mitFotos === false) {
      kopie.tueren.forEach(function (t) { t.fotos = []; });
    }
    return {
      typ: 'schliessanlagen-aufmass',
      version: 1,
      exportiert: new Date().toISOString(),
      einstellungen: einstellungen ? {
        firma: einstellungen.firma, firmaZusatz: einstellungen.firmaZusatz,
        firmaTelefon: einstellungen.firmaTelefon, firmaEmail: einstellungen.firmaEmail
      } : null,
      projekt: kopie
    };
  }

  function exportDateiname(projekt) {
    var basis = (projekt.kunde || projekt.name || 'Aufmass')
      .replace(/[^\wäöüÄÖÜß \-]/g, '').trim().replace(/\s+/g, '-');
    return basis + '_Aufmass_' + (global.Model ? global.Model.heute() : '') + '.json';
  }

  /* Liest eine exportierte Datei und gibt ein migriertes Projekt zurück. */
  function importParsen(text) {
    var daten;
    try { daten = JSON.parse(text); }
    catch (e) { throw new Error('Die Datei ist keine gültige JSON-Datei.'); }

    var projekt = null;
    if (daten && daten.typ === 'schliessanlagen-aufmass' && daten.projekt) projekt = daten.projekt;
    else if (daten && Array.isArray(daten.tueren)) projekt = daten;          /* blankes Projekt */
    else throw new Error('Die Datei enthält kein Aufmaß-Projekt.');

    var migriert = global.Model.migriere(projekt);
    return { projekt: migriert, einstellungen: daten.einstellungen || null };
  }

  /* Vergibt neue IDs, damit ein Import ein bestehendes Projekt nicht überschreibt. */
  function projektKlonen(projekt, neuerName) {
    var kopie = JSON.parse(JSON.stringify(projekt));
    var M = global.Model;
    var idMap = {};
    kopie.id = M.uid('prj');
    kopie.name = neuerName || (kopie.name + ' (Kopie)');
    kopie.erstellt = new Date().toISOString();
    kopie.geaendert = kopie.erstellt;

    kopie.standorte.forEach(function (k) { idMap[k.id] = M.uid('str'); });
    kopie.standorte.forEach(function (k) {
      k.id = idMap[k.id];
      if (k.parentId) k.parentId = idMap[k.parentId] || null;
    });
    var tuerMap = {}, schlMap = {};
    kopie.tueren.forEach(function (t) {
      tuerMap[t.id] = M.uid('tur'); t.id = tuerMap[t.id];
      if (t.strukturId) t.strukturId = idMap[t.strukturId] || null;
    });
    kopie.schliessungen.forEach(function (s) { schlMap[s.id] = M.uid('sch'); s.id = schlMap[s.id]; });

    var neueMatrix = {};
    Object.keys(kopie.matrix).forEach(function (key) {
      var teile = key.split('|');
      var nt = tuerMap[teile[0]], ns = schlMap[teile[1]];
      if (nt && ns) neueMatrix[nt + '|' + ns] = kopie.matrix[key];
    });
    kopie.matrix = neueMatrix;
    return kopie;
  }

  /* --- Dateiausgabe -------------------------------------------------------
   * Zwei Wege, je nachdem wie die Anwendung ausgeliefert wird:
   *  - lokal geöffnet oder von einem Webserver: klassischer Download-Link
   *  - in einer eingebetteten Umgebung, die eigene Downloads unterbindet:
   *    die dort bereitgestellte Speicherfunktion
   * ---------------------------------------------------------------------- */
  var speicherFunktion;          // undefined = noch nicht geprüft, null = nicht vorhanden

  function ausgabeVorbereiten() {
    if (speicherFunktion !== undefined) return Promise.resolve(speicherFunktion);
    if (!global.claude || typeof global.claude.use !== 'function') {
      speicherFunktion = null;
      return Promise.resolve(null);
    }
    return global.claude.use('downloads').then(function (d) {
      speicherFunktion = (d && typeof d.save === 'function') ? d : null;
      return speicherFunktion;
    }).catch(function () { speicherFunktion = null; return null; });
  }

  /* Gibt ein Promise auf 'gespeichert' | 'abgelehnt' zurück bzw. wird
   * mit einer verständlichen Meldung abgelehnt. */
  function dateiHerunterladen(inhalt, dateiname, mimeTyp) {
    var blob = (inhalt instanceof Blob) ? inhalt
      : new Blob([inhalt], { type: mimeTyp || 'application/json' });

    return ausgabeVorbereiten().then(function (speichern) {
      if (speichern) {
        return speichern.save({ filename: dateiname, data: blob })
          .then(function () { return 'gespeichert'; })
          .catch(function (fehler) {
            var code = fehler && fehler.code;
            if (code === 'declined') return 'abgelehnt';
            if (code === 'rate_limited') {
              throw new Error('Es ist bereits eine Abfrage offen. Bitte kurz warten und erneut versuchen.');
            }
            if (code === 'too_large') {
              throw new Error('Die Datei ist zu groß. Bitte den Export ohne Fotos wählen.');
            }
            throw new Error('Speichern nicht möglich (' + (code || 'unbekannt') + ').');
          });
      }
      /* Klassischer Weg */
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = dateiname; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 4000);
      return 'gespeichert';
    });
  }

  /* --- Fotos: verkleinern und als JPEG ablegen ----------------------------
   * Der PDF-Writer bettet JPEG direkt ein, deshalb wird hier immer nach
   * JPEG konvertiert - unabhängig davon, was die Kamera liefert (auch HEIC,
   * sofern der Browser es dekodieren kann).
   * ---------------------------------------------------------------------- */
  function fotoVerarbeiten(datei, maxKante, qualitaet) {
    maxKante = maxKante || 1280;
    qualitaet = qualitaet || 0.72;
    return new Promise(function (resolve, reject) {
      if (!datei) return reject(new Error('Keine Datei übergeben.'));
      if (datei.size > 40 * 1024 * 1024) return reject(new Error('Die Bilddatei ist zu groß (über 40 MB).'));
      var leser = new FileReader();
      leser.onerror = function () { reject(new Error('Die Datei konnte nicht gelesen werden.')); };
      leser.onload = function () {
        var bild = new Image();
        bild.onerror = function () {
          reject(new Error('Das Bildformat wird von diesem Browser nicht unterstützt. Bitte als JPEG aufnehmen.'));
        };
        bild.onload = function () {
          var b = bild.naturalWidth, h = bild.naturalHeight;
          if (!b || !h) return reject(new Error('Das Bild hat keine lesbaren Abmessungen.'));
          var faktor = Math.min(1, maxKante / Math.max(b, h));
          var zb = Math.max(1, Math.round(b * faktor)), zh = Math.max(1, Math.round(h * faktor));
          var c = document.createElement('canvas');
          c.width = zb; c.height = zh;
          var g = c.getContext('2d');
          g.fillStyle = '#ffffff'; g.fillRect(0, 0, zb, zh);   /* Transparenz -> weiß */
          g.drawImage(bild, 0, 0, zb, zh);
          var dataUrl;
          try { dataUrl = c.toDataURL('image/jpeg', qualitaet); }
          catch (e) { return reject(new Error('Das Bild konnte nicht umgewandelt werden.')); }
          resolve({
            id: global.Model.uid('foto'),
            dataUrl: dataUrl,
            breite: zb, hoehe: zh,
            groesse: Math.round(dataUrl.length * 0.75),
            beschriftung: '',
            erstellt: new Date().toISOString()
          });
        };
        bild.src = leser.result;
      };
      leser.readAsDataURL(datei);
    });
  }

  /* --- Speicherbedarf abschätzen ------------------------------------------- */
  function speicherInfo() {
    if (navigator.storage && navigator.storage.estimate) {
      return navigator.storage.estimate().then(function (e) {
        return { benutzt: e.usage || 0, verfuegbar: e.quota || 0, unterstuetzt: true };
      }).catch(function () { return { unterstuetzt: false }; });
    }
    return Promise.resolve({ unterstuetzt: false });
  }

  function projektGroesse(projekt) {
    try { return JSON.stringify(projekt).length; } catch (e) { return 0; }
  }

  global.Store = {
    oeffnen: oeffnen,
    alleProjekte: alleProjekte,
    projektLaden: projektLaden,
    projektSpeichern: projektSpeichern,
    projektLoeschen: projektLoeschen,
    einstellungenLaden: einstellungenLaden,
    einstellungenSpeichern: einstellungenSpeichern,
    EINSTELLUNGEN_STANDARD: EINSTELLUNGEN_STANDARD,
    exportDaten: exportDaten,
    exportDateiname: exportDateiname,
    importParsen: importParsen,
    projektKlonen: projektKlonen,
    dateiHerunterladen: dateiHerunterladen,
    ausgabeVorbereiten: ausgabeVorbereiten,
    fotoVerarbeiten: fotoVerarbeiten,
    speicherInfo: speicherInfo,
    projektGroesse: projektGroesse,
