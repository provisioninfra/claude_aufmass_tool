      ['Aufmaßdatum', datumDe(projekt.aufmassDatum)],
      ['Bearbeiter', projekt.bearbeiter],
      ['Art der Anlage', (K.ANLAGENART.filter(function (a) { return a.id === projekt.anlagenart; })[0] || {}).label || ''],
      ['Mechanisches System', projekt.systemMechanik ? K.systemLabel(projekt.systemMechanik, einstellungen && einstellungen.eigeneSysteme) : ''],
      ['Elektronisches System', projekt.systemElektronik ? K.systemLabel(projekt.systemElektronik, einstellungen && einstellungen.eigeneSysteme) : ''],
      ['Detail zur Anlage', projekt.systemDetail]
    ].filter(function (f) { return txt(f[1]); });

    if (!felder.length) return;
    /* Zeilenhöhen aus dem längsten Wert der jeweiligen Rasterzeile ableiten,
       damit lange Kundennamen zweizeilig stehen statt abgeschnitten zu werden. */
    var zeilenAnzahl = Math.ceil(felder.length / 3);
    var zeilenHoehen = [];
    for (var z = 0; z < zeilenAnzahl; z++) {
      var maxH = 0;
      for (var sp2 = 0; sp2 < 3; sp2++) {
        var f2 = felder[z * 3 + sp2];
        if (!f2) continue;
        var h = doc.blockHoehe(txt(f2[1]), spalte - 6, { size: 8.5, bold: true, maxLines: 2 });
        if (h > maxH) maxH = h;
      }
      zeilenHoehen.push(Math.max(4.2, maxH) + 4.2);
    }
    var hoehe = zeilenHoehen.reduce(function (a, c) { return a + c; }, 0) + 3;
    doc.platzPruefen(hoehe + 4);
    var startY = doc.y;
    doc.rechteck(x, startY, b, hoehe, { fill: FARBE.zebraBg, stroke: FARBE.linieHell });
    var yOffsets = [], lauf = 2;
    zeilenHoehen.forEach(function (h2) { yOffsets.push(lauf); lauf += h2; });
    felder.forEach(function (f, i) {
      var sp = i % 3, ze = Math.floor(i / 3);
      var fx = x + sp * spalte + 3, fy = startY + yOffsets[ze];
      doc.text(f[0], fx, fy, { size: 6.8, color: FARBE.hellgrau });
      doc.textBlock(txt(f[1]), fx, fy + 3.4, spalte - 6, { size: 8.5, bold: true, maxLines: 2 });
    });
    doc.y = startY + hoehe + 5;
  }

  /* =========================================================================
   * Tabellenmaschine mit Seitenumbruch und wiederholtem Tabellenkopf
   * spalten: [{titel, key|render, breite, align, size, bold, maxLines}]
   * ====================================================================== */
  function tabelle(doc, spalten, zeilen, opt) {
    opt = opt || {};
    var x0 = doc.rand.links;
    var gesamtBreite = spalten.reduce(function (s, c) { return s + c.breite; }, 0);
    var schrift = opt.size || 7.6;
    var padX = 1.6, padY = 1.4;

    function kopfZeichnen() {
      var kopfHoehe = opt.headerHeight || 6.5;
      doc.platzPruefen(kopfHoehe + 8);
      var y = doc.y;
      doc.rechteck(x0, y, gesamtBreite, kopfHoehe, { fill: FARBE.kopfBg, stroke: FARBE.linie, width: 0.25 });
      var cx = x0;
      spalten.forEach(function (c) {
        var tx = cx + padX;
        if (c.align === 'center') tx = cx + c.breite / 2;
        else if (c.align === 'right') tx = cx + c.breite - padX;
        doc.text(doc.kuerzen(c.titel, c.breite - 2 * padX, 7, true), tx, y + padY + 0.4,
                 { size: 7, bold: true, align: c.align, color: FARBE.text });
        cx += c.breite;
        if (c !== spalten[spalten.length - 1]) {
          doc.linie(cx, y, cx, y + kopfHoehe, { color: FARBE.linie, width: 0.25 });
        }
      });
      doc.y = y + kopfHoehe;
    }

    kopfZeichnen();
    var zebra = 0;

    zeilen.forEach(function (zeile) {
      /* Gruppentrenner */
      if (zeile.__gruppe) {
        doc.platzPruefen(9 + 8);
        if (doc.y === doc.rand.oben + 20 || doc.aktuelleSeite.ops.length < 12) { /* frische Seite */ }
        var gy = doc.y + 1.5;
        doc.rechteck(x0, gy, gesamtBreite, 6.4, { fill: '#dce6f2', stroke: FARBE.linie, width: 0.25 });
        doc.text(doc.kuerzen(zeile.__gruppe, gesamtBreite - 40, 8.2, true), x0 + padX, gy + 1.3,
                 { size: 8.2, bold: true, color: FARBE.akzent });
        if (zeile.__gruppeRechts) {
          doc.text(zeile.__gruppeRechts, x0 + gesamtBreite - padX, gy + 1.5,
                   { size: 7.2, align: 'right', color: FARBE.grau });
        }
        doc.y = gy + 6.4;
        zebra = 0;
        return;
      }

      /* Zeilenhöhe aus dem höchsten Zellinhalt bestimmen */
      var zellen = spalten.map(function (c) {
        var wert = c.render ? c.render(zeile) : txt(zeile[c.key]);
        return { spalte: c, wert: txt(wert) };
      });
      var hoehe = 0;
      zellen.forEach(function (z) {
        var h = doc.blockHoehe(z.wert, z.spalte.breite - 2 * padX, {
          size: z.spalte.size || schrift, bold: z.spalte.bold, maxLines: z.spalte.maxLines || 3
        });
        if (h > hoehe) hoehe = h;
      });
      hoehe += 2 * padY;
      if (hoehe < 5.2) hoehe = 5.2;

      var umbrochen = doc.platzPruefen(hoehe);
      if (umbrochen) { kopfZeichnen(); zebra = 0; }

      var y = doc.y;
      if (zebra % 2 === 1) {
        doc.rechteck(x0, y, gesamtBreite, hoehe, { fill: FARBE.zebraBg });
      }
      if (zeile.__markierung) {
        doc.rechteck(x0, y, 1.2, hoehe, { fill: zeile.__markierung });
      }

      var cx = x0;
      var trenner = [];
      zellen.forEach(function (z, i) {
        var c = z.spalte;
        var tx = cx + padX, ausrichtung = c.align;
        var maxB = c.breite - 2 * padX;
        doc.textBlock(z.wert, tx, y + padY, maxB, {
          size: c.size || schrift, bold: c.bold, align: ausrichtung,
          color: c.color || FARBE.text, maxLines: c.maxLines || 3
        });
        cx += c.breite;
        if (i < spalten.length - 1) trenner.push([cx, y, cx, y + hoehe]);
      });
      trenner.push([x0, y + hoehe, x0 + gesamtBreite, y + hoehe]);
      doc.linienGruppe(trenner, { color: FARBE.linieHell, width: 0.2 });
      doc.y = y + hoehe;
      zebra++;
    });

    /* Rahmen links/rechts der letzten Seite */
    doc.linie(x0, doc.y, x0 + gesamtBreite, doc.y, { color: FARBE.linie, width: 0.3 });
    return doc.y;
  }

  /* =========================================================================
   * 1) TÜRLISTE
   * modus: 'kompakt' = Tabelle | 'detail' = Datenblatt je Tür
   * ====================================================================== */
  function tuerliste(projekt, einstellungen, optionen) {
    optionen = optionen || {};
    var modus = optionen.modus || 'kompakt';
    var mitFotos = optionen.mitFotos !== false;
    var quer = optionen.orientation || (modus === 'kompakt' ? 'landscape' : 'portrait');

    var doc = new PDF.Doc({
      format: 'a4', orientation: quer,
      titel: 'Türliste ' + (projekt.kunde || projekt.name),
      autor: einstellungen && einstellungen.firma || '',
      betreff: 'Aufmaß-Türliste',
      margin: { oben: 12, unten: 14, links: 10, rechts: 10 }
    });
    kopfUndFussSetzen(doc, projekt, einstellungen, 'Türliste / Aufmaßprotokoll');
    doc.neueSeite();
    projektKopfBlock(doc, projekt, einstellungen);

    var gruppen = M.tuerenGruppiert(projekt);
    if (!projekt.tueren.length) {
      doc.text('Für dieses Projekt wurden noch keine Türen erfasst.', doc.rand.links, doc.y,
               { size: 10, color: FARBE.grau });
      return doc;
    }

    if (modus === 'kompakt') {
      tuerlisteKompakt(doc, projekt, gruppen, einstellungen);
    } else {
      tuerlisteDetail(doc, projekt, gruppen, einstellungen, mitFotos);
    }

    zusammenfassung(doc, projekt, einstellungen);
    return doc;
  }

  function zutrittKurz(t) {
    var teile = [];
    if (t.zutrittsseite) teile.push(t.zutrittsseite);
    (t.tueranforderungen || []).forEach(function (a) {
      teile.push(String(a).replace('Flucht- und Rettungsweg', 'Flucht/Panik')
                          .replace('einbruchhemmend (RC)', 'RC')
                          .replace('VdS-Anforderung', 'VdS'));
    });
    return teile.join(', ');
  }

  function zylinderMass(t) {
    if (!t.masseAussen && !t.masseInnen) return '';
    return (t.masseAussen || '–') + ' / ' + (t.masseInnen || '–');
  }

  function tuerlisteKompakt(doc, projekt, gruppen, einstellungen) {
    var b = doc.inhaltsBreite();
    /* Spaltenbreiten als Anteile der verfügbaren Breite (A4 quer: 277 mm) */
    var anteile = [
      { titel: 'Nr.',            breite: 0.052, render: function (t) { return txt(t.nummer); }, bold: true },
      { titel: 'Bezeichnung / Raum', breite: 0.145, render: function (t) {
          var zusatz = kategorieZusatz(t);
          return txt(t.bezeichnung) + (zusatz ? ('\n' + zusatz) : ''); } },
      { titel: 'Anz.',           breite: 0.032, align: 'center', render: function (t) { return String(t.anzahl || 1); } },
      { titel: 'Ausführung',     breite: 0.115, render: function (t) {
          var sid = M.tuerSystemId(projekt, t);
          var s = sid ? K.systemLabel(sid, einstellungen && einstellungen.eigeneSysteme) : '–';
          return s + (t.systemNotiz ? ('\n' + t.systemNotiz) : ''); } },
      { titel: 'Zylinder',       breite: 0.125, render: function (t) {
          return K.zylinderText(t) || '–'; } },
      { titel: 'Maß a/i',        breite: 0.055, align: 'center', render: zylinderMass },
      { titel: 'Beschlag / Drücker', breite: 0.115, render: function (t) {
          var b = K.beschlagText(t);
          if (!b) return '–';
          return b + (t.vierkant ? ('\nVK ' + t.vierkant) : ''); } },
      { titel: 'Schloss',        breite: 0.105, render: function (t) {
          var sch = K.schlossText(t);
          if (!sch) return '–';
          var d = [];
          if (t.dornmass) d.push('DM ' + t.dornmass);
          if (t.entfernung) d.push('E ' + t.entfernung);
          return sch + (d.length ? ('\n' + d.join(' / ')) : ''); } },
      { titel: 'Zutritt / Anforderungen', breite: 0.125, render: zutrittKurz },
      { titel: 'DIN',            breite: 0.045, align: 'center', render: function (t) {
          return txt(t.dinRichtung).replace('DIN ', ''); } },
      { titel: 'Bemerkung',      breite: 0.086, render: function (t) {
          var n = [];
          if (t.notiz) n.push(t.notiz);
          if (t.nacharbeit) n.push('! ' + (t.nacharbeitText || 'Nacharbeit'));
          return n.join('\n'); } }
    ];
    var spalten = anteile.map(function (s) {
      var c = {}; for (var k in s) c[k] = s[k];
      c.breite = s.breite * b;
      return c;
    });

    var zeilen = [];
    gruppen.forEach(function (g) {
      var anz = g.tueren.reduce(function (s, t) { return s + (parseInt(t.anzahl, 10) || 1); }, 0);
      zeilen.push({ __gruppe: g.titel,
        __gruppeRechts: plural(g.tueren.length, 'Position', 'Positionen') + '  ·  ' + plural(anz, 'Tür', 'Türen') });
      g.tueren.forEach(function (t) {
        var kopie = Object.create(t);
        kopie.__markierung = t.nacharbeit ? FARBE.fehler : (K.statusById(t.status).farbe);
        zeilen.push(kopie);
      });
    });
    tabelle(doc, spalten, zeilen, { size: 7.2 });
  }

  function tuerlisteDetail(doc, projekt, gruppen, einstellungen, mitFotos) {
    var b = doc.inhaltsBreite();
    var x = doc.rand.links;

    gruppen.forEach(function (g) {
      doc.platzPruefen(16);
      doc.rechteck(x, doc.y, b, 7, { fill: '#dce6f2', stroke: FARBE.linie, width: 0.25 });
      doc.text(g.titel, x + 2, doc.y + 1.6, { size: 9.5, bold: true, color: FARBE.akzent });
      doc.text(plural(g.tueren.length, 'Tür', 'Türen'), x + b - 2, doc.y + 1.9,
               { size: 7.5, align: 'right', color: FARBE.grau });
      doc.y += 10;

      g.tueren.forEach(function (t) {
        tuerDatenblatt(doc, projekt, t, einstellungen, mitFotos);
      });
    });
  }

  function tuerDatenblatt(doc, projekt, t, einstellungen, mitFotos) {
    var x = doc.rand.links, b = doc.inhaltsBreite();
    var fotos = mitFotos ? (t.fotos || []) : [];

    var felder = [
      ['System', (function () {
          var sid = M.tuerSystemId(projekt, t);
          return sid ? K.systemLabel(sid, einstellungen && einstellungen.eigeneSysteme) : '–';
        })()],
      ['Ausführung', (function () {
          var tech = M.tuerTechnologie(projekt, t);
          return tech === 'elektronik' ? 'Elektronisch'
               : tech === 'mechanik' ? 'Mechanisch'
               : tech === 'hybrid' ? 'Hybrid' : '–';
        })()],
      ['Kategorie', t.kategorie],
      ['Anzahl', String(t.anzahl || 1)],
      ['Zylinder', K.zylinderText(t) || (t.brauchtZylinder ? '' : 'kein Zylinder')],
      ['Zylinderlänge außen/innen', zylinderMass(t) ? zylinderMass(t) + ' mm' : ''],
      ['Beschlag / Drücker', K.beschlagText(t) || (t.brauchtBeschlag ? '' : 'kein Beschlag')],
      ['Schloss', K.schlossText(t)],
      ['Wandleser', t.brauchtWandleser ? 'ja' : ''],
      ['Zutrittsseite', t.zutrittsseite],
      ['Bauliche Anforderungen', (t.tueranforderungen || []).join(', '), true],
      ['Systemkomponenten', (t.komponenten || []).join(', '), true],
      ['DIN-Richtung', t.dinRichtung],
      ['Öffnungsrichtung', t.oeffnungsrichtung],
      ['Türblattstärke', t.tuerblattstaerke ? t.tuerblattstaerke + ' mm' : ''],
      ['Dornmaß', t.dornmass ? t.dornmass + ' mm' : ''],
      ['Entfernung', t.entfernung ? t.entfernung + ' mm' : ''],
      ['Vierkant', t.vierkant ? t.vierkant + ' mm' : ''],
      ['Profilbreite', t.profilbreite],
      ['Türbreite', t.tuerbreite ? t.tuerbreite + ' mm' : ''],
      ['Türhöhe', t.tuerhoehe ? t.tuerhoehe + ' mm' : ''],
      ['Türanschlag', t.tuerAnschlag],
      ['Stulpmaß', t.stulpmass],
      ['Stulpform', t.schlossStulpform],
      ['Stulpbreite', t.schlossStulpbreite ? t.schlossStulpbreite + ' mm' : ''],
      ['Stulplänge', t.schlossStulplaenge ? t.schlossStulplaenge + ' mm' : ''],
      ['Fallenart', t.schlossFallenart],
      ['Riegelausschluss', t.schlossRiegelausschluss ? t.schlossRiegelausschluss + ' mm' : ''],
      ['Verriegelungspunkte', t.schlossVerriegelungspunkte],
      ['Norm / Zulassung Schloss', t.schlossNorm],
      ['Bohrbild', t.bohrbild],
      ['Türmaterial', t.tuermaterial],
      ['Besonderheit zur Tür', t.systemNotiz, true],
      ['Maß-Bemerkung', t.masseBemerkung, true],
      ['Bestand Fabrikat', t.bestandFabrikat],
      ['Bestand Zylinderart', t.bestandZylinderart],
      ['Bestand Länge', [t.bestandLaengeAussen, t.bestandLaengeInnen].filter(Boolean).join('/') ||
                        t.bestandLaenge],
      ['Bestand Schlüsselanzahl', t.bestandAnzahlSchluessel],
      ['Bestand Bemerkung', t.bestandBemerkung, true],
      ['Funkabdeckung', t.elFunkabdeckung],
      ['Stromversorgung', t.elStromversorgung],
      ['Vernetzung', t.elVernetzung],
      ['Türüberwachung', t.elTuerueberwachung ? 'ja' : ''],
      ['Kabel / Leerrohr', t.elKabeluebergang],
      ['Türöffner im Bestand', t.elTueroeffnerBestand ? 'ja' : ''],
      ['Leitungsweg', t.elLeitungsweg, true],
      ['Elektronik-Bemerkung', t.elBemerkung, true],
      /* Fehlende Pflichtangaben stehen im Datenblatt, damit beim Nach-
       * arbeiten im Büro nicht erst gesucht werden muss. */
      ['Pflichtangaben offen', (function () {
          var f2 = M.pflichtfelder ? M.pflichtfelder(projekt, t) : [];
          return f2.length ? f2.map(function (x2) { return x2.label; }).join(', ') : '';
        })(), true]
    ].filter(function (f) { return txt(f[1]) && txt(f[1]) !== '–' || f[0] === 'System'; });

    var spaltenAnzahl = 3;
    var spaltenBreite = b / spaltenAnzahl;
    var kopfHoehe = 8;
    var status = K.statusById(t.status);

    /* Rasterzeilen bilden und ihre Höhe am längsten Wert ausrichten, damit
       lange Werte (z. B. mehrere Zutrittsarten) vollständig lesbar bleiben. */
    var rasterZeilen = [];
    var puffer = [];
    function pufferAbschliessen() {
      if (!puffer.length) return;
      var maxH = 0;
      puffer.forEach(function (f) {
        var h = doc.blockHoehe(txt(f[1]), spaltenBreite - 4, { size: 8, maxLines: 2 });
        if (h > maxH) maxH = h;
      });
      rasterZeilen.push({ felder: puffer.slice(), voll: false, hoehe: Math.max(3.4, maxH) + 4.6 });
      puffer = [];
    }
    felder.forEach(function (f) {
      /* Lange Werte (mehrere Zutrittsarten, Komponentenlisten, Bemerkungen)
         bekommen eine eigene Zeile über die volle Breite, statt zu kürzen. */
      var braucht = doc.blockHoehe(txt(f[1]), spaltenBreite - 4, { size: 8 });
      var passtInSpalte = braucht <= doc.blockHoehe('X', spaltenBreite - 4, { size: 8 }) * 2 + 0.01;
      if (f[2] && !passtInSpalte) {
        pufferAbschliessen();
        rasterZeilen.push({
          felder: [f], voll: true,
          hoehe: doc.blockHoehe(txt(f[1]), b - 4, { size: 8, maxLines: 3 }) + 4.6
        });
        return;
      }
      puffer.push(f);
      if (puffer.length === spaltenAnzahl) pufferAbschliessen();
    });
    pufferAbschliessen();

    var feldHoeheGesamt = rasterZeilen.reduce(function (a, r) { return a + r.hoehe; }, 0);
    var notizHoehe = 0;
    if (t.notiz) notizHoehe += doc.blockHoehe(t.notiz, b - 26, { size: 8 }) + 2;
    if (t.nacharbeit) notizHoehe += doc.blockHoehe(t.nacharbeitText || 'Nacharbeit erforderlich', b - 26, { size: 8 }) + 2;
    var fotoHoehe = fotos.length ? 34 : 0;
    var gesamt = kopfHoehe + feldHoeheGesamt + notizHoehe + fotoHoehe + 8;

    /* Passt das Datenblatt komplett auf eine Seite, wird es nicht zerrissen.
       Andernfalls beginnt es auf einer frischen Seite und wird sauber
       umbrochen - kein Feld darf verloren gehen. */
    if (gesamt <= doc.inhaltsHoehe()) doc.platzPruefen(gesamt);
    else doc.platzPruefen(kopfHoehe + rasterZeilen.slice(0, 3)
      .reduce(function (a, r) { return a + r.hoehe; }, 0));

    function kopfZeichnen(fortsetzung) {
      var startY = doc.y;
      doc.rechteck(x, startY, b, kopfHoehe, { fill: '#eef2f7', stroke: FARBE.linie, width: 0.3 });
      doc.rechteck(x, startY, 1.6, kopfHoehe, { fill: t.nacharbeit ? FARBE.fehler : status.farbe });
      var titel = (t.nummer ? t.nummer + '  ·  ' : '') + (t.bezeichnung || 'ohne Bezeichnung');
      if (fortsetzung) titel += '   (Fortsetzung)';
      doc.text(doc.kuerzen(titel, b - 70, 10.5, true), x + 4, startY + 2, { size: 10.5, bold: true });
      doc.text(status.label + (t.nacharbeit ? '  ·  NACHARBEIT' : ''), x + b - 3, startY + 2.4,
               { size: 7.5, align: 'right', bold: true, color: t.nacharbeit ? FARBE.fehler : status.farbe });
      doc.y = startY + kopfHoehe + 1.5;
    }

    kopfZeichnen(false);

    /* Felder in drei Spalten, mit Seitenumbruch statt Abschneiden */
    rasterZeilen.forEach(function (rz) {
      if (doc.y + rz.hoehe > doc.hoehe - doc.rand.unten) {
        doc.neueSeite();
        kopfZeichnen(true);
      }
      var fy = doc.y;
      if (rz.voll) {
        var fv = rz.felder[0];
        doc.text(fv[0], x + 2, fy, { size: 6.6, color: FARBE.hellgrau });
        doc.textBlock(txt(fv[1]), x + 2, fy + 3.1, b - 4, { size: 8, maxLines: 3 });
      } else {
        rz.felder.forEach(function (f, sp) {
          var fx = x + sp * spaltenBreite + 2;
          doc.text(f[0], fx, fy, { size: 6.6, color: FARBE.hellgrau });
          doc.textBlock(txt(f[1]), fx, fy + 3.1, spaltenBreite - 4, { size: 8, maxLines: 2 });
          if (sp > 0) {
            doc.linie(x + sp * spaltenBreite, fy - 0.5, x + sp * spaltenBreite, fy + rz.hoehe - 1.2,
                      { color: FARBE.linieHell, width: 0.15 });
          }
        });
      }
      doc.y = fy + rz.hoehe;
    });
    doc.y += 1;

    /* Notiz / Nacharbeit */
    if (t.notiz) {
      doc.platzPruefen(8);
      doc.text('Bemerkung', x + 2, doc.y, { size: 6.6, color: FARBE.hellgrau });
      doc.y += doc.textBlock(t.notiz, x + 24, doc.y, b - 26, { size: 8 }) + 1.5;
    }
    if (t.nacharbeit) {
      doc.platzPruefen(8);
      doc.text('Nacharbeit', x + 2, doc.y, { size: 6.6, bold: true, color: FARBE.fehler });
      doc.y += doc.textBlock(t.nacharbeitText || 'Nacharbeit erforderlich', x + 24, doc.y, b - 26,
                             { size: 8, color: FARBE.fehler }) + 1.5;
    }

    /* Fotos */
    if (fotos.length) {
      doc.platzPruefen(34);
      var fx2 = x + 2, maxH = 30;
      fotos.slice(0, 4).forEach(function (foto) {
        var id = doc.bildRegistrieren(foto.dataUrl);
        if (!id) return;
        var gez = doc.bild(id, fx2, doc.y, 42, maxH);
        if (gez) {
          doc.rechteck(fx2, doc.y, gez.breite, gez.hoehe, { stroke: FARBE.linie, width: 0.2 });
          if (foto.beschriftung) {
            doc.text(doc.kuerzen(foto.beschriftung, gez.breite, 6.4, false), fx2, doc.y + gez.hoehe + 0.6,
                     { size: 6.4, color: FARBE.hellgrau });
          }
          fx2 += gez.breite + 3;
        }
      });
      doc.y += maxH + 4;
    }

    doc.linie(x, doc.y, x + b, doc.y, { color: FARBE.linie, width: 0.3 });
    doc.y += 4;
  }

  function zusammenfassung(doc, projekt, einstellungen) {
    var s = M.statistik(projekt);
    var x = doc.rand.links, b = doc.inhaltsBreite();
    doc.platzPruefen(26);
    doc.y += 3;
    doc.text('Zusammenfassung', x, doc.y, { size: 10, bold: true, color: FARBE.akzent });
    doc.y += 6;
    var werte = [
      ['Positionen', String(s.tueren)],
      ['Türen gesamt', String(s.tuerenGesamtAnzahl)],
      ['Fotos', String(s.fotos)],
      ['Nacharbeit', String(s.nacharbeit)],
      ['Schließungen', String(s.schliessungen)],
      ['Berechtigungen', String(s.berechtigungen)]
    ];
    var kw = b / werte.length;
    werte.forEach(function (w, i) {
      var kx = x + i * kw;
      doc.rechteck(kx, doc.y, kw - 2, 12, { fill: FARBE.zebraBg, stroke: FARBE.linieHell });
      doc.text(w[1], kx + kw / 2 - 1, doc.y + 1.5, { size: 12, bold: true, align: 'center', color: FARBE.akzent });
      doc.text(w[0], kx + kw / 2 - 1, doc.y + 7.8, { size: 6.8, align: 'center', color: FARBE.grau });
    });
    doc.y += 16;

    if (projekt.bemerkung) {
      doc.platzPruefen(12);
      doc.text('Projektbemerkung', x, doc.y, { size: 8, bold: true });
      doc.y += 4;
      doc.y += doc.textBlock(projekt.bemerkung, x, doc.y, b, { size: 8, color: FARBE.grau });
    }

    doc.platzPruefen(24);
    doc.y += 8;
    var sb = (b - 10) / 2;
    [['Aufgenommen durch (Datum, Unterschrift)', x],
     ['Kunde / Bestätigung (Datum, Unterschrift)', x + sb + 10]].forEach(function (u) {
      doc.linie(u[1], doc.y + 10, u[1] + sb, doc.y + 10, { color: FARBE.grau, width: 0.3 });
      doc.text(u[0], u[1], doc.y + 11, { size: 7, color: FARBE.hellgrau });
    });
    doc.y += 18;
  }

  /* =========================================================================
   * 2) KREUZSCHLIESSPLAN / ZUTRITTSMATRIX
   * Türen = Zeilen, Schließungen = Spalten. Bei vielen Spalten wird auf
   * mehrere Seitenblöcke umbrochen, die Türspalte wiederholt sich dabei.
   * ====================================================================== */
  function schliessplan(projekt, einstellungen, optionen) {
    optionen = optionen || {};
    var doc = new PDF.Doc({
      format: optionen.format || 'a4', orientation: 'landscape',
      titel: 'Kreuzschließplan ' + (projekt.kunde || projekt.name),
      autor: einstellungen && einstellungen.firma || '',
      betreff: 'Kreuzschließplan / Zutrittsmatrix',
      margin: { oben: 12, unten: 14, links: 10, rechts: 10 }
    });
    kopfUndFussSetzen(doc, projekt, einstellungen, 'Kreuzschließplan / Zutrittsmatrix');
    doc.neueSeite();
    projektKopfBlock(doc, projekt, einstellungen);

    var schliessungen = projekt.schliessungen.slice().sort(function (a, b2) {
      return (a.sort - b2.sort) || String(a.kuerzel).localeCompare(String(b2.kuerzel), 'de', { numeric: true });
    });
    var gruppen = M.tuerenGruppiert(projekt);

    if (!schliessungen.length || !projekt.tueren.length) {
      doc.text('Für den Kreuzschließplan werden mindestens eine Tür und eine Schließung benötigt.',
               doc.rand.links, doc.y, { size: 10, color: FARBE.grau });
      return doc;
    }

    var b = doc.inhaltsBreite();
    var tuerSpalte = Math.min(78, Math.max(52, b * 0.26));
    var spaltenBreite = optionen.spaltenBreite || 7.2;
    var verfuegbar = b - tuerSpalte;
    var proSeite = Math.max(1, Math.floor(verfuegbar / spaltenBreite));

    var bloecke = [];
    for (var i = 0; i < schliessungen.length; i += proSeite) {
      bloecke.push(schliessungen.slice(i, i + proSeite));
    }

    bloecke.forEach(function (block, blockIndex) {
      if (blockIndex > 0) { doc.neueSeite(); doc.y += 2; }
      if (bloecke.length > 1) {
        doc.text('Spaltenblock ' + (blockIndex + 1) + ' von ' + bloecke.length +
                 '  (Schließungen ' + (blockIndex * proSeite + 1) + '–' +
                 (blockIndex * proSeite + block.length) + ' von ' + schliessungen.length + ')',
                 doc.rand.links, doc.y, { size: 7.5, color: FARBE.grau });
        doc.y += 5;
      }
      matrixBlock(doc, projekt, gruppen, block, tuerSpalte, spaltenBreite, einstellungen);
    });

    legende(doc, schliessungen);
    return doc;
  }

  function matrixBlock(doc, projekt, gruppen, block, tuerSpalte, spaltenBreite, einstellungen) {
    var x0 = doc.rand.links;
    var gesamtBreite = tuerSpalte + block.length * spaltenBreite;
    var zeilenHoehe = 5.4;

    /* Kopfhöhe aus dem längsten Spaltentitel ableiten */
    var kopfTexte = block.map(function (s) {
      return (s.kuerzel ? s.kuerzel + ' ' : '') + (s.bezeichnung || '');
    });
    var maxTextBreite = 0;
    kopfTexte.forEach(function (t) {
      var w = doc.textBreite(t, 7, true);
      if (w > maxTextBreite) maxTextBreite = w;
    });
    var medienZeile = 3.4;   /* eigene Zone am Kopfende für die Stückzahl */
    var kopfHoehe = Math.min(60, Math.max(24, maxTextBreite + 6 + medienZeile));

    function kopfZeichnen() {
      doc.platzPruefen(kopfHoehe + 3 * zeilenHoehe);
      var y = doc.y;
      doc.rechteck(x0, y, gesamtBreite, kopfHoehe, { fill: FARBE.kopfBg, stroke: FARBE.linie, width: 0.3 });
      doc.text('Tür / Schließung', x0 + 2, y + kopfHoehe - 5, { size: 7.5, bold: true });
      block.forEach(function (s, i) {
        var cx = x0 + tuerSpalte + i * spaltenBreite;
        doc.linie(cx, y, cx, y + kopfHoehe, { color: FARBE.linie, width: 0.25 });
        var text = doc.kuerzen(kopfTexte[i] || '–', kopfHoehe - medienZeile - 4, 7, true);
        doc.textRotiert(text, cx + spaltenBreite / 2 + 2.4, y + kopfHoehe - medienZeile - 2,
                        { size: 7, bold: true });
        var anz = M.medienAnzahl ? M.medienAnzahl(s) : parseInt(s.anzahlMedien, 10);
        if (anz > 0) {
          doc.text(String(anz), cx + spaltenBreite / 2, y + kopfHoehe - medienZeile + 0.1,
                   { size: 5.6, align: 'center', color: FARBE.grau });
        }
      });
      doc.linie(x0 + tuerSpalte, y, x0 + tuerSpalte, y + kopfHoehe, { color: FARBE.linie, width: 0.4 });
      doc.linie(x0 + tuerSpalte, y + kopfHoehe - medienZeile, x0 + gesamtBreite,
                y + kopfHoehe - medienZeile, { color: FARBE.linie, width: 0.2 });
      doc.text('Stk', x0 + tuerSpalte - 2, y + kopfHoehe - medienZeile + 0.1,
               { size: 5.6, align: 'right', color: FARBE.hellgrau });
      doc.y = y + kopfHoehe;
    }

    kopfZeichnen();
    var zebra = 0;

    gruppen.forEach(function (g) {
      /* Gruppenzeile */
      if (doc.platzPruefen(zeilenHoehe * 3)) { kopfZeichnen(); zebra = 0; }
      var gy = doc.y;
      doc.rechteck(x0, gy, gesamtBreite, 5, { fill: '#dce6f2', stroke: FARBE.linie, width: 0.25 });
      doc.text(doc.kuerzen(g.titel, gesamtBreite - 6, 7.6, true), x0 + 2, gy + 0.9,
               { size: 7.6, bold: true, color: FARBE.akzent });
      doc.y = gy + 5;
      zebra = 0;

      g.tueren.forEach(function (t) {
        if (doc.platzPruefen(zeilenHoehe)) { kopfZeichnen(); zebra = 0; }
        var y = doc.y;
        if (zebra % 2 === 1) doc.rechteck(x0, y, gesamtBreite, zeilenHoehe, { fill: FARBE.zebraBg });

        var label = (t.nummer ? t.nummer + ' ' : '') + (t.bezeichnung || '');
        if (t.anzahl > 1) label += ' (' + t.anzahl + 'x)';
        doc.text(doc.kuerzen(label || '–', tuerSpalte - 4, 7, false), x0 + 2, y + 1.1, { size: 7 });

        var raster = [];
        block.forEach(function (s, i) {
          var cx = x0 + tuerSpalte + i * spaltenBreite;
          var wert = M.getBerechtigung(projekt, t.id, s.id);
          var zeichen = K.berechtigungZeichen(wert);
          raster.push([cx, y, cx, y + zeilenHoehe]);
          if (zeichen) {
            var farbe = wert === 'sperr' ? FARBE.fehler : (wert === 'ja' ? FARBE.akzent : FARBE.warn);
            doc.text(zeichen, cx + spaltenBreite / 2, y + 0.9,
                     { size: 8, bold: true, align: 'center', color: farbe });
          }
        });
        raster.push([x0, y + zeilenHoehe, x0 + gesamtBreite, y + zeilenHoehe]);
        doc.linienGruppe(raster, { color: FARBE.linieHell, width: 0.15 });
        doc.linie(x0 + tuerSpalte, y, x0 + tuerSpalte, y + zeilenHoehe, { color: FARBE.linie, width: 0.4 });
        doc.y = y + zeilenHoehe;
        zebra++;
      });
    });

    /* Summenzeile: Anzahl berechtigter Türen je Schließung */
    if (doc.platzPruefen(zeilenHoehe + 2)) kopfZeichnen();
    var sy = doc.y;
    doc.rechteck(x0, sy, gesamtBreite, zeilenHoehe, { fill: FARBE.kopfBg, stroke: FARBE.linie, width: 0.3 });
    doc.text('Summe berechtigter Türen', x0 + 2, sy + 1.1, { size: 7, bold: true });
    block.forEach(function (s, i) {
      var cx = x0 + tuerSpalte + i * spaltenBreite;
      var summe = 0;
      projekt.tueren.forEach(function (t) {
        var w = M.getBerechtigung(projekt, t.id, s.id);
        if (w !== 'nein' && w !== 'sperr') summe += (parseInt(t.anzahl, 10) || 1);
      });
      doc.linie(cx, sy, cx, sy + zeilenHoehe, { color: FARBE.linie, width: 0.25 });
      doc.text(String(summe), cx + spaltenBreite / 2, sy + 1.1,
               { size: 6.8, align: 'center', bold: true, color: FARBE.akzent });
    });
    doc.y = sy + zeilenHoehe + 4;
  }

  function legende(doc, schliessungen) {
    var x = doc.rand.links, b = doc.inhaltsBreite();
    doc.platzPruefen(30);
    doc.y += 3;
    doc.text('Legende Berechtigungen', x, doc.y, { size: 9, bold: true, color: FARBE.akzent });
    doc.y += 5;
    var lx = x;
    K.BERECHTIGUNG.forEach(function (bt) {
      if (!bt.zeichen) return;
      doc.text(bt.zeichen, lx, doc.y, { size: 8, bold: true, color: FARBE.akzent });
      doc.text('= ' + bt.label, lx + 4, doc.y, { size: 7.5, color: FARBE.grau });
      lx += 5 + doc.textBreite('= ' + bt.label, 7.5, false) + 8;
    });
    doc.y += 7;

    doc.text('Schließungen im Detail', x, doc.y, { size: 9, bold: true, color: FARBE.akzent });
    doc.y += 5;
    /* Die Personen stehen namentlich mit ihrer Anzahl: Daraus ergibt sich
     * die Medienzahl, und bei der Ausgabe der Schlüssel ist ablesbar, wer
     * welches Medium erhält. */
    var spalten = [
      { titel: 'Kürzel', breite: b * 0.08, key: 'kuerzel', bold: true },
      { titel: 'Bezeichnung', breite: b * 0.20, key: 'bezeichnung' },
      { titel: 'Rang im Plan', breite: b * 0.15, render: function (s) {
          var t = K.SCHLIESSUNG_TYPEN.filter(function (x2) { return x2.id === s.typ; })[0];
          return t ? t.label : txt(s.typ); } },
      { titel: 'Träger', breite: b * 0.09, render: function (s) {
          var a = K.TRAEGER_ART.filter(function (x2) { return x2.id === s.traegerArt; })[0];
          return a ? a.label : ''; } },
      { titel: 'Person(en) / Gruppe', breite: b * 0.33, maxLines: 6, render: function (s) {
          var personen = (s.personen || []).filter(function (x2) { return x2 && x2.name; });
          var liste2 = personen.map(function (x2) {
            var n = parseInt(x2.anzahlMedien, 10); if (!n || n < 1) n = 1;
            return x2.name + (x2.funktion ? (' (' + x2.funktion + ')') : '') + (n > 1 ? (' ' + n + '×') : '');
          }).join(', ');
          if (s.traegerArt === 'gruppe') {
            return 'Gruppe ' + (s.gruppenName || '–') +
              (liste2 ? (': ' + liste2) : ' – keine Mitglieder hinterlegt');
          }
          return liste2 || txt(s.person || s.abteilung);
        } },
      { titel: 'Medien', breite: b * 0.06, align: 'center', render: function (s) {
          return String(M.medienAnzahl ? M.medienAnzahl(s) : (s.anzahlMedien || 0)); } },
      { titel: 'Art', breite: b * 0.09, size: 7, key: 'medienTyp' }
    ];
    tabelle(doc, spalten, schliessungen.slice(), { size: 7.4 });
  }

  /* =========================================================================
   * 3) MATERIALLISTE / STÜCKLISTE
   * ====================================================================== */
  function materialliste(projekt, einstellungen, optionen) {
    optionen = optionen || {};
    /* Die Türzuordnung ist standardmäßig aus: Die Bestellliste bleibt damit
     * schmal und die Maßspalten gut lesbar. Im Export zuschaltbar. */
    var mitTueren = optionen.mitTueren === true;
    var doc = new PDF.Doc({
      format: 'a4', orientation: 'landscape',
      titel: 'Materialliste ' + (projekt.kunde || projekt.name),
      autor: einstellungen && einstellungen.firma || '',
      betreff: 'Materialliste / Bestellgrundlage',
      margin: { oben: 12, unten: 14, links: 12, rechts: 12 }
    });
    kopfUndFussSetzen(doc, projekt, einstellungen, 'Materialliste / Bestellgrundlage');
    doc.neueSeite();
    projektKopfBlock(doc, projekt, einstellungen);

    var liste = M.materialliste(projekt, einstellungen && einstellungen.eigeneSysteme);
    var b = doc.inhaltsBreite();

    if (!liste.systeme.length || !liste.gesamtStueck) {
      doc.text('Keine Positionen vorhanden.', doc.rand.links, doc.y, { size: 10, color: FARBE.grau });
      return doc;
    }

    /* =======================================================================
     * Spaltensatz je Bauteilart
     * =====================================================================
     * Ein Zylinder wird über seine Längen bestellt, ein Beschlag über
     * Türstärke, Dornmaß, Entfernung und Nuss, ein Einsteckschloss über
     * Dornmaß, Entfernung, Stulp und Falle. Eine gemeinsame Spalte "Maß"
     * müsste alles in einen Text pressen - deshalb bekommt jede Art ihren
     * eigenen Spaltensatz. Artikelnummer und Preis bleiben leer: Sie werden
     * beim Lieferanten eingetragen, das Werkzeug erfindet sie nicht.
     * ------------------------------------------------------------------- */
    var pos = 0;
    function f(x, name) { return txt((x.felder || {})[name]); }

    /* Breiten als Gewichte: der Satz stimmt unabhängig davon, welche
     * zusätzlichen Spalten gerade mitlaufen. */
    function spaltenBauen(spec) {
      var summe = spec.reduce(function (sum, c) { return sum + c.w; }, 0);
      return spec.map(function (c) {
        var k = {};
        Object.keys(c).forEach(function (n) { if (n !== 'w') k[n] = c[n]; });
        k.breite = b * c.w / summe;
        return k;
      });
    }
    var spaltePos = { titel: 'Pos.', w: 4, align: 'center',
      render: function () { pos++; return String(pos); } };
    var spalteMenge = { titel: 'Menge', w: 7, align: 'right', bold: true,
      render: function (x) { return String(x.menge) + ' Stk'; } };
    /* Bewusst leer: handschriftlich oder beim Lieferanten auszufüllen */
    var spalteArtNr = { titel: 'Art.-Nr.', w: 12, render: function () { return ''; } };
    var spaltePreis = { titel: 'Preis', w: 8, align: 'right', render: function () { return ''; } };
    var spalteTueren = { titel: 'Türen', w: 15, size: 6.8, color: FARBE.grau, maxLines: 3,
      render: function (x) { return (x.tueren || []).join(', '); } };

    function satzFuer(art) {
      var mitte;
      if (art === 'Zylinder') {
        mitte = [
          { titel: 'Bezeichnung', w: 22, key: 'bezeichnung', bold: true },
          { titel: 'Ausführung', w: 18, key: 'ausfuehrung' },
          { titel: 'außen', w: 6, align: 'right', render: function (x) { return f(x, 'laengeAussen'); } },
          { titel: 'innen', w: 6, align: 'right', render: function (x) { return f(x, 'laengeInnen'); } },
          { titel: 'gesamt', w: 6.5, align: 'right', render: function (x) { return f(x, 'gesamtlaenge'); } },
          { titel: 'Knaufseite', w: 10, size: 7, render: function (x) { return f(x, 'knaufseite'); } }
        ];
      } else if (art === 'Beschlag') {
        mitte = [
          { titel: 'Bezeichnung', w: 18, key: 'bezeichnung', bold: true },
          { titel: 'Ausführung', w: 14, key: 'ausfuehrung' },
          { titel: 'Bestückung', w: 12, size: 7, render: function (x) { return f(x, 'bestueckung'); } },
          { titel: 'TS', w: 4.5, align: 'right', render: function (x) { return f(x, 'tuerblattstaerke'); } },
          { titel: 'DM', w: 4.5, align: 'right', render: function (x) { return f(x, 'dornmass'); } },
          { titel: 'E', w: 4.5, align: 'right', render: function (x) { return f(x, 'entfernung'); } },
          { titel: 'Nuss', w: 5, align: 'right', render: function (x) { return f(x, 'vierkant'); } },
          { titel: 'DIN', w: 8, size: 7, render: function (x) { return f(x, 'din'); } }
        ];
      } else if (art === 'Schloss') {
        mitte = [
          { titel: 'Bezeichnung', w: 16, key: 'bezeichnung', bold: true },
          { titel: 'Funktion', w: 16, key: 'ausfuehrung' },
          { titel: 'DM', w: 4.5, align: 'right', render: function (x) { return f(x, 'dornmass'); } },
          { titel: 'E', w: 4.5, align: 'right', render: function (x) { return f(x, 'entfernung'); } },
          { titel: 'DIN', w: 7.5, size: 7, render: function (x) { return f(x, 'din'); } },
          { titel: 'Stulp', w: 11, size: 7, render: function (x) { return f(x, 'stulp'); } },
          { titel: 'Falle', w: 8.5, size: 7, render: function (x) { return f(x, 'fallenart'); } },
          { titel: 'Detail', w: 10, size: 6.8, render: function (x) {
              return [f(x, 'riegelausschluss') ? ('Riegel ' + f(x, 'riegelausschluss') + ' mm') : '',
                      f(x, 'verriegelungspunkte') ? (f(x, 'verriegelungspunkte') + ' Pkt.') : '',
                      f(x, 'norm')].filter(Boolean).join(' · '); } }
        ];
      } else {
        mitte = [
          { titel: 'Bezeichnung', w: 30, key: 'bezeichnung', bold: true },
          { titel: 'Ausführung', w: 22, key: 'ausfuehrung' },
          { titel: 'Hinweis', w: 16, size: 7, color: FARBE.grau, key: 'hinweis' }
        ];
      }
      var spec = [spaltePos].concat(mitte, [spalteMenge, spalteArtNr, spaltePreis]);
      if (mitTueren) spec = spec.concat([spalteTueren]);
      return spaltenBauen(spec);
    }

    /* Einheitenzeile unter dem Tabellenkopf, damit "DM 65" eindeutig ist */
    var EINHEIT_HINWEIS = {
      Zylinder: 'Längen in mm, ab Mitte Schraubloch (außen/innen).',
      Beschlag: 'TS = Türblattstärke, DM = Dornmaß, E = Entfernung, Nuss = Vierkant – alle Maße in mm.',
      Schloss: 'DM = Dornmaß, E = Entfernung, Stulp = Stulpform/-breite/-länge – alle Maße in mm.'
    };

    liste.gliederung.forEach(function (abschnitt, index) {
      if (index > 0) doc.y += 4;
      doc.platzPruefen(30);

      /* Abschnittsüberschrift */
      doc.rechteck(doc.rand.links, doc.y, b, 9, { fill: FARBE.akzent });
      doc.text(abschnitt.titel, doc.rand.links + 3, doc.y + 2, { size: 10, bold: true, color: '#ffffff' });
      doc.text(abschnitt.summe + ' Stück', doc.rand.links + b - 3, doc.y + 2.4,
               { size: 9, bold: true, align: 'right', color: '#ffffff' });
      doc.y += 9;
      doc.text(abschnitt.hinweis, doc.rand.links + 1, doc.y + 1, { size: 7, color: FARBE.hellgrau });
      doc.y += 5.5;

      abschnitt.gruppen.forEach(function (g, gi) {
        if (gi > 0) doc.y += 3;
        doc.platzPruefen(22);
        /* System bzw. Hersteller: danach wird bestellt */
        doc.rechteck(doc.rand.links, doc.y, b, 6.6, { fill: '#dce6f2', stroke: FARBE.linie, width: 0.25 });

/* =============================================================================
 * store.js — Persistenz (IndexedDB mit localStorage-Rückfallebene),
 *            Export/Import und Bildverarbeitung.
 * Alles läuft ausschließlich auf dem Gerät; es werden keine Daten übertragen.

(function (global) {
  'use strict';

  var DB_NAME = 'aufmass-tool';
  var DB_VERSION = 1;
  var STORE_PROJEKTE = 'projekte';
  var STORE_META = 'meta';
  var LS_PRAEFIX = 'aufmass.';

  var db = null;
  var nutztFallback = false;

  /* --- IndexedDB öffnen ---------------------------------------------------- */
  function oeffnen() {
    return new Promise(function (resolve) {
      if (db) return resolve(db);
      if (!global.indexedDB) { nutztFallback = true; return resolve(null); }
      var anfrage;
      try { anfrage = global.indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { nutztFallback = true; return resolve(null); }

      anfrage.onupgradeneeded = function (e) {
        var d = e.target.result;
        if (!d.objectStoreNames.contains(STORE_PROJEKTE)) {
          d.createObjectStore(STORE_PROJEKTE, { keyPath: 'id' });
        }
        if (!d.objectStoreNames.contains(STORE_META)) {
          d.createObjectStore(STORE_META, { keyPath: 'schluessel' });
        }
      };
      anfrage.onsuccess = function (e) { db = e.target.result; resolve(db); };
      anfrage.onerror = function () {
        /* Bei privatem Modus in Safari kann IndexedDB blockiert sein. */
        nutztFallback = true; resolve(null);
      };
      /* Safari im privaten Modus blockiert gelegentlich ohne Event */
      setTimeout(function () { if (!db && !nutztFallback) { nutztFallback = true; resolve(null); } }, 3000);
    });
  }

  function tx(store, modus) {
    return db.transaction(store, modus).objectStore(store);
  }
  function alsPromise(anfrage) {
    return new Promise(function (resolve, reject) {
      anfrage.onsuccess = function () { resolve(anfrage.result); };
      anfrage.onerror = function () { reject(anfrage.error); };
    });
  }

  /* --- localStorage-Rückfallebene ----------------------------------------- */
  function lsSchluesselListe() {
    var out = [];
    for (var i = 0; i < global.localStorage.length; i++) {
      var k = global.localStorage.key(i);
      if (k && k.indexOf(LS_PRAEFIX + 'projekt.') === 0) out.push(k);
    }
    return out;
  }

  /* --- Projekte ------------------------------------------------------------ */
  function alleProjekte() {
    return oeffnen().then(function (d) {
      if (!d) {
        return lsSchluesselListe().map(function (k) {
          try { return JSON.parse(global.localStorage.getItem(k)); } catch (e) { return null; }
        }).filter(Boolean);
      }
      return alsPromise(tx(STORE_PROJEKTE, 'readonly').getAll());
    }).then(function (liste) {
      return (liste || []).sort(function (a, b) {
        return String(b.geaendert || '').localeCompare(String(a.geaendert || ''));
      });
    });
  }

  function projektLaden(id) {
    return oeffnen().then(function (d) {
      if (!d) {
        var roh = global.localStorage.getItem(LS_PRAEFIX + 'projekt.' + id);
        return roh ? JSON.parse(roh) : null;
      }
      return alsPromise(tx(STORE_PROJEKTE, 'readonly').get(id));
    });
  }

  function projektSpeichern(projekt) {
    projekt.geaendert = new Date().toISOString();
    return oeffnen().then(function (d) {
      if (!d) {
        try {
          global.localStorage.setItem(LS_PRAEFIX + 'projekt.' + projekt.id, JSON.stringify(projekt));
        } catch (e) {
          return Promise.reject(new Error('Speicher voll. Bitte Fotos reduzieren oder Projekte exportieren und löschen.'));
        }
        return projekt;
      }
      return alsPromise(tx(STORE_PROJEKTE, 'readwrite').put(projekt)).then(function () { return projekt; });
    });
  }

  function projektLoeschen(id) {
    return oeffnen().then(function (d) {
      if (!d) { global.localStorage.removeItem(LS_PRAEFIX + 'projekt.' + id); return true; }
      return alsPromise(tx(STORE_PROJEKTE, 'readwrite').delete(id)).then(function () { return true; });

    erscheinungsbild: 'dunkel',

        var roh = global.localStorage.getItem(LS_PRAEFIX + 'einstellungen');
        return roh ? JSON.parse(roh) : {};

      return alsPromise(tx(STORE_META, 'readonly').get('einstellungen')).then(function (e) {
        return e ? e.wert : {};
      });
    }).then(function (gespeichert) {
      var out = {};
      Object.keys(EINSTELLUNGEN_STANDARD).forEach(function (k) {
        out[k] = (gespeichert && gespeichert[k] !== undefined) ? gespeichert[k] : EINSTELLUNGEN_STANDARD[k];

      if (!d) {
        global.localStorage.setItem(LS_PRAEFIX + 'einstellungen', JSON.stringify(werte));

  function exportDaten(projekt, einstellungen, mitFotos) {

      typ: 'schliessanlagen-aufmass',

      /* Ausdrücklich nur diese vier Angaben: Zugangsdaten und Schlüssel

      einstellungen: einstellungen ? {

        firmaTelefon: einstellungen.firmaTelefon, firmaEmail: einstellungen.firmaEmail
      } : null,
      projekt: kopie

  function exportDateiname(projekt) {
    var basis = (projekt.kunde || projekt.name || 'Aufmass')
      .replace(/[^\wäöüÄÖÜß \-]/g, '').trim().replace(/\s+/g, '-');

  /* Liest eine exportierte Datei und gibt ein migriertes Projekt zurück. */
  function importParsen(text) {

    try { daten = JSON.parse(text); }
    catch (e) { throw new Error('Die Datei ist keine gültige JSON-Datei.'); }

    var projekt = null;
    if (daten && daten.typ === 'schliessanlagen-aufmass' && daten.projekt) projekt = daten.projekt;
    else if (daten && Array.isArray(daten.tueren)) projekt = daten;          /* blankes Projekt */
    else throw new Error('Die Datei enthält kein Aufmaß-Projekt.');

  /* Vergibt neue IDs, damit ein Import ein bestehendes Projekt nicht überschreibt. */
  function projektKlonen(projekt, neuerName) {
    var kopie = JSON.parse(JSON.stringify(projekt));
    var M = global.Model;
    var idMap = {};
    kopie.id = M.uid('prj');
    kopie.name = neuerName || (kopie.name + ' (Kopie)');
    kopie.erstellt = new Date().toISOString();
    kopie.geaendert = kopie.erstellt;

    kopie.standorte.forEach(function (k) { idMap[k.id] = M.uid('str'); });
    kopie.standorte.forEach(function (k) {
      k.id = idMap[k.id];
      if (k.parentId) k.parentId = idMap[k.parentId] || null;
    });
    var tuerMap = {}, schlMap = {};
    kopie.tueren.forEach(function (t) {
      tuerMap[t.id] = M.uid('tur'); t.id = tuerMap[t.id];
      if (t.strukturId) t.strukturId = idMap[t.strukturId] || null;
    });
    kopie.schliessungen.forEach(function (s) { schlMap[s.id] = M.uid('sch'); s.id = schlMap[s.id]; });

    var neueMatrix = {};
    Object.keys(kopie.matrix).forEach(function (key) {
      var teile = key.split('|');
      var nt = tuerMap[teile[0]], ns = schlMap[teile[1]];
      if (nt && ns) neueMatrix[nt + '|' + ns] = kopie.matrix[key];
    });
    kopie.matrix = neueMatrix;

  /* --- Dateiausgabe -------------------------------------------------------
   * Zwei Wege, je nachdem wie die Anwendung ausgeliefert wird:
   *  - lokal geöffnet oder von einem Webserver: klassischer Download-Link

   *    die dort bereitgestellte Speicherfunktion
   * ---------------------------------------------------------------------- */
  var speicherFunktion;          // undefined = noch nicht geprüft, null = nicht vorhanden

  function ausgabeVorbereiten() {
    if (speicherFunktion !== undefined) return Promise.resolve(speicherFunktion);
    if (!global.claude || typeof global.claude.use !== 'function') {
      speicherFunktion = null;
      return Promise.resolve(null);
    }
    return global.claude.use('downloads').then(function (d) {
      speicherFunktion = (d && typeof d.save === 'function') ? d : null;
      return speicherFunktion;
    }).catch(function () { speicherFunktion = null; return null; });
  }

  /* Gibt ein Promise auf 'gespeichert' | 'abgelehnt' zurück bzw. wird
   * mit einer verständlichen Meldung abgelehnt. */
  function dateiHerunterladen(inhalt, dateiname, mimeTyp) {
    var blob = (inhalt instanceof Blob) ? inhalt
      : new Blob([inhalt], { type: mimeTyp || 'application/json' });

    return ausgabeVorbereiten().then(function (speichern) {
      if (speichern) {
        return speichern.save({ filename: dateiname, data: blob })
          .then(function () { return 'gespeichert'; })
          .catch(function (fehler) {
            var code = fehler && fehler.code;
            if (code === 'declined') return 'abgelehnt';
            if (code === 'rate_limited') {
              throw new Error('Es ist bereits eine Abfrage offen. Bitte kurz warten und erneut versuchen.');
            }
            if (code === 'too_large') {
              throw new Error('Die Datei ist zu groß. Bitte den Export ohne Fotos wählen.');
            }
            throw new Error('Speichern nicht möglich (' + (code || 'unbekannt') + ').');
          });
      }
      /* Klassischer Weg */
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = dateiname; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () {
        if (a.parentNode) a.parentNode.removeChild(a);
        URL.revokeObjectURL(url);
      }, 4000);
      return 'gespeichert';
    });

        }, [
          el('div', { class: 'titel', text: p.kunde || p.name || 'Ohne Namen' }),
          el('div', { class: 'zeile', text: p.objekt || '—' }),
          el('div', { class: 'zeile zart', text:
            [p.anlagenNr ? 'Anlage ' + p.anlagenNr : '', 'geändert ' + datumKurz(p.geaendert)]
            .filter(Boolean).join('  ·  ') }),
          el('div', { class: 'zahlen' }, [
            el('span', {}, [el('b', { text: String(s.tuerenGesamtAnzahl) }), ' Türen']),
            el('span', {}, [el('b', { text: String(s.schliessungen) }), ' Schließungen']),
            s.fotos ? el('span', {}, [el('b', { text: String(s.fotos) }), ' Fotos']) : null,
            s.nacharbeit ? el('span', { class: 'marke-pille rot', text: s.nacharbeit + '× Nacharbeit' }) : null
          ]),
          el('div', { class: 'aktionen' }, [
            el('button', { class: 'haupt klein', text: 'Öffnen',
              onclick: function () { projektOeffnen(p.id, neuLaden); } }),
            el('button', { class: 'klein', text: 'Kopieren',
              onclick: function () {
                var klon = Store.projektKlonen(p);
                Store.projektSpeichern(klon).then(function () {
                  A.toast('Projekt kopiert.', 'ok'); neuLaden();
                });
              } }),
            el('button', { class: 'klein gefahr', text: 'Löschen',
              onclick: function () {
                A.bestaetigen('Projekt löschen?',
                  'Das Aufmaß „' + (p.kunde || p.name) + '“ mit ' + s.tueren +
                  ' Türen wird endgültig gelöscht. Dieser Schritt kann nicht rückgängig gemacht werden.')
                  .then(function (ja) {
                    if (!ja) return;
                    Store.projektLoeschen(p.id).then(function () {
                      if (Zustand.projekt && Zustand.projekt.id === p.id) {
                        Zustand.projekt = null; Zustand.ansicht = 'projekte';
                        if (global.Verlauf) global.Verlauf.beenden();
                      }
                      A.toast('Projekt gelöscht.'); neuLaden();
                    });
                  });
              } })
          ])
        ]));
      });
      listenBereich.appendChild(raster);

      Store.speicherInfo().then(function (info) {
        if (!info.unterstuetzt) return;
        listenBereich.appendChild(el('p', {
          class: 'zart', style: { marginTop: '16px' },
          text: 'Belegter Gerätespeicher: ' + kb(info.benutzt) +
                (info.verfuegbar ? ' von rund ' + kb(info.verfuegbar) : '') +
                (Store.nutztFallback() ? '  ·  Hinweis: Es wird der einfache Browserspeicher genutzt (begrenzte Kapazität).' : '')
        }));
      });
    });
  }

  /* =========================================================================
   * Aufmaß aus einem Pipedrive-Deal anlegen
   * ======================================================================
   * Das Werkzeug holt die Deals ab; es wird nichts nach Pipedrive geschrieben.
   */
  function pipedriveDialog(neuLaden) {
    var e = Zustand.einstellungen || {};
    var PD = global.Pipedrive;

    if (!e.pipedriveToken) {
      A.dialogOeffnen({
        titel: 'Pipedrive ist noch nicht verbunden', klein: true,
        inhalt: el('div', {}, [
          el('p', { class: 'hinweis', style: { marginTop: '0' },
            text: 'Hinterlegen Sie zuerst unter Einstellungen den Zugriffsschlüssel aus Pipedrive. ' +
                  'Danach lassen sich Aufmaße direkt aus einem Deal anlegen.' })
        ]),
        knoepfe: [
          { fuellen: true },
          { text: 'Abbrechen' },
          { text: 'Zu den Einstellungen', klasse: 'haupt', aktion: function (schliessen) {
            schliessen();
            global.App.wechseln('einstellungen');
            return false;
          } }
        ]
      });
      return;
    }

    var liste = el('div');
    var dlg = A.dialogOeffnen({
      titel: 'Aufmaß aus einem Pipedrive-Deal anlegen',
      inhalt: el('div', {}, [
        el('p', { class: 'hinweis', style: { marginTop: '0' },
          text: e.pipedrivePipelineName
            ? ('Offene Deals aus „' + e.pipedrivePipelineName + '“' +
               (e.pipedrivePhaseName ? (', Phase „' + e.pipedrivePhaseName + '“') : '') +
               ', zu denen noch kein Aufmaß vorliegt.')
            : 'Offene Deals aus allen Pipelines. Unter Einstellungen lassen sich Pipeline und Phase festlegen.' }),
        liste
      ]),
      knoepfe: [{ fuellen: true }, { text: 'Schließen' }]
    });

    liste.appendChild(el('p', { class: 'zart', text: 'Deals werden abgerufen …' }));

    Promise.all([
      PD.deals(e, e.pipedrivePipelineId || undefined, {
        phaseId: e.pipedrivePhaseId || undefined, status: 'open', limit: 100 }),
      Store.alleProjekte()
    ]).then(function (teile) {
      var deals = teile[0], vorhandene = teile[1];
      A.leeren(liste);

      /* Jeden Deal gegen die festgelegte Regel prüfen */
      var geprueft = deals.map(function (deal) {
        return { deal: deal, pruefung: PD.istZuUebernehmen(deal, e, vorhandene) };
      });
      var offen = geprueft.filter(function (g) { return g.pruefung.uebernehmen; });
      var schonDa = geprueft.filter(function (g) { return g.pruefung.code === 'vorhanden'; });
      var nichtOffen = geprueft.filter(function (g) { return g.pruefung.code === 'status'; });

      if (!offen.length) {
        /* Der Grund wird beim Namen genannt - „nichts da“ und „alles schon
         * übernommen“ sind zwei verschiedene Lagen mit verschiedener Abhilfe. */
        var text;
        if (!deals.length) {
          text = 'Pipedrive liefert für ' +
            (e.pipedrivePipelineName ? ('die Pipeline „' + e.pipedrivePipelineName + '“') : 'diese Einstellung') +
            (e.pipedrivePhaseName ? (' in der Phase „' + e.pipedrivePhaseName + '“') : '') +
            ' derzeit keinen offenen Deal zurück.';
        } else if (schonDa.length === deals.length) {
          text = 'Alle ' + deals.length + ' Deals in dieser Phase haben bereits ein Aufmaß.';
        } else if (nichtOffen.length) {
          text = 'Von ' + deals.length + ' Deals sind ' + nichtOffen.length +
            ' nicht mehr offen (gewonnen, verloren oder gelöscht); die übrigen haben ein Aufmaß.';
        } else {
          text = 'Von ' + deals.length + ' gelesenen Deals passt derzeit keiner auf die ' +
            'eingestellte Regel.';
        }
        liste.appendChild(el('div', { class: 'leer' }, [
          el('h3', { text: 'Kein Deal zur Übernahme' }),
          el('p', { text: text }),
          el('div', { class: 'knopfleiste', style: { justifyContent: 'center', marginTop: '10px' } },
            el('button', { class: 'haupt', text: 'Warum? – Verbindung prüfen',
              onclick: function (ev) { diagnoseLaufenLassen(ev.target, liste); } }))
        ]));
      } else {
        liste.appendChild(el('p', { class: 'zart', style: { marginBottom: '8px' },
          text: offen.length + (offen.length === 1 ? ' Deal wartet' : ' Deals warten') + ' auf ein Aufmaß' }));
        var box = el('div', { class: 'tuer-liste deal-offen', style: { border: '1px solid var(--rand)',
          borderRadius: 'var(--radius)' } });
        offen.forEach(function (g) {
          var deal = g.deal;
          box.appendChild(el('div', {
            class: 'tuer-zeile',
            onclick: function () { dealUebernehmen(deal, null, dlg, neuLaden); }
          }, [
            el('div', { class: 'statusbalken', style: { background: 'var(--gruen)' } }),
            el('div', { class: 'inhalt' }, [
              el('div', { class: 'haupt' }, [
                el('div', { class: 'bez', text: deal.titel || ('Deal ' + deal.id) }),
                el('div', { class: 'detail', text:
                  ['Deal-Nr. ' + deal.id,
                   deal.wert ? (Number(deal.wert).toLocaleString('de-DE') + ' ' + (deal.waehrung || '')) : '',
                   deal.geaendert ? ('geändert ' + datumKurz(deal.geaendert)) : ''
                  ].filter(Boolean).join('  ·  ') })
              ]),
              el('div', { class: 'marken' },
                el('span', { class: 'marke-pille gruen', text: 'Aufmaß anlegen' }))
            ])
          ]));
        });
        liste.appendChild(box);
      }

      /* Bereits übernommene Deals nur auf Wunsch zeigen */
      if (schonDa.length) {
        var aufklapp = el('details', { class: 'abschnitt', style: { marginTop: '14px' } }, [
          el('summary', {}, [
            el('span', { text: 'Bereits übernommen' }),
            el('span', { class: 'zusatz', text: schonDa.length + (schonDa.length === 1 ? ' Deal' : ' Deals') })
          ]),
          el('div', { class: 'koerper' }, (function () {
            var innen = el('div', { class: 'tuer-liste deal-vorhanden', style: { border: '1px solid var(--rand)',
              borderRadius: 'var(--radius)' } });
            schonDa.forEach(function (g) {
              var pr = g.pruefung.projekt || {};
              innen.appendChild(el('div', { class: 'tuer-zeile', style: { cursor: 'default' } }, [
                el('div', { class: 'statusbalken', style: { background: 'var(--text-zart)' } }),
                el('div', { class: 'inhalt' }, [
                  el('div', { class: 'haupt' }, [
                    el('div', { class: 'bez', text: g.deal.titel || ('Deal ' + g.deal.id) }),
                    el('div', { class: 'detail',
                      text: 'Aufmaß vorhanden: ' + (pr.kunde || pr.name || '–') })
                  ]),
                  el('div', { class: 'marken' }, [
                    el('button', { class: 'klein', text: 'Öffnen', onclick: function (ev) {
                      ev.stopPropagation();
                      if (dlg) dlg.schliessen();
                      projektOeffnen(pr.id, neuLaden);
                    } }),
                    el('button', { class: 'klein', text: 'Trotzdem neu anlegen', onclick: function (ev) {
                      ev.stopPropagation();
                      dealUebernehmen(g.deal, pr, dlg, neuLaden);
                    } })
                  ])
                ])
              ]));
            });
            return innen;
          })())
        ]);
        liste.appendChild(aufklapp);
      }
    })
    .catch(function (fehler) {
      A.leeren(liste);
      liste.appendChild(el('div', { class: 'meldung fehler' }, el('div', {}, [
        el('b', { text: fehler.message || 'Die Deals konnten nicht abgerufen werden.' }),
        fehler.zusatz ? el('div', { style: { marginTop: '6px', fontSize: '13px' }, text: fehler.zusatz }) : null
      ])));
    });
  }

  /* =========================================================================
   * Diagnose: Was liefert Pipedrive wirklich?
   * ======================================================================
   * Wird sichtbar, sobald kein Deal angeboten wird. Sie liest die offenen
   * Deals ohne Filter und zeigt zu jedem, in welcher Pipeline und Phase er
   * steht - damit die Lücke zwischen Erwartung und Datenlage sichtbar wird.
   */
  function diagnoseLaufenLassen(knopf, ziel) {
    var e = Zustand.einstellungen || {};
    var beschriftung = knopf ? knopf.textContent : '';
    /* Der Knopf wird in jedem Fall wieder benutzbar - auch wenn er noch
     * dasteht, weil der Bericht woanders erscheint. */
    function freigeben() {
      if (knopf && knopf.parentNode) { knopf.disabled = false; knopf.textContent = beschriftung; }
    }
    if (knopf) { knopf.disabled = true; knopf.textContent = 'Prüfe …'; }
    Store.alleProjekte().then(function (vorhandene) {
      return global.Pipedrive.diagnose(e, vorhandene);
    }).then(function (bericht) {
      A.leeren(ziel);
      ziel.appendChild(diagnoseAnzeigen(bericht));
      freigeben();
    }).catch(function (fehler) {
      freigeben();
      A.leeren(ziel);
      ziel.appendChild(el('div', { class: 'meldung fehler' }, el('div', {}, [
        el('b', { text: fehler.message || 'Die Prüfung ist fehlgeschlagen.' }),
        fehler.zusatz ? el('div', { style: { marginTop: '6px', fontSize: '13px' },
          text: fehler.zusatz }) : null
      ])));
    });
  }

  /* Den Bericht darstellen. Er enthält nie den Zugriffsschlüssel. */
  function diagnoseAnzeigen(b) {
    var z = b.zahlen || {};
    var kasten = el('div', { class: 'pd-diagnose' });

    kasten.appendChild(el('h3', { style: { margin: '0 0 8px' }, text: 'Prüfbericht' }));

    var schritte = el('div', { class: 'tuer-liste', style: { border: '1px solid var(--rand)',
      borderRadius: 'var(--radius)', marginBottom: '12px' } });
    (b.schritte || []).forEach(function (sch) {
      schritte.appendChild(el('div', { class: 'tuer-zeile', style: { cursor: 'default' } }, [
        el('div', { class: 'statusbalken',
          style: { background: sch.ok ? 'var(--gruen)' : 'var(--rot)' } }),
        el('div', { class: 'inhalt' }, el('div', { class: 'haupt' }, [
          el('div', { class: 'bez', text: (sch.ok ? '✓ ' : '✕ ') + sch.name }),
          el('div', { class: 'detail', text: sch.text })
        ]))
      ]));
    });
    kasten.appendChild(schritte);

    kasten.appendChild(el('p', { class: 'zart', style: { marginBottom: '10px' }, text:
      z.gelesen + ' offene Deals gelesen  ·  ' + z.inPipeline + ' in der Pipeline  ·  ' +
      z.inPhase + ' in der Phase  ·  ' + z.uebernehmbar + ' ohne Aufmaß' }));

    (b.hinweise || []).forEach(function (h) {
      kasten.appendChild(el('div', { class: 'meldung warn', style: { marginBottom: '10px' } },
        el('div', { text: h })));
    });

    /* Die gelesenen Deals im Klartext - hier wird der Unterschied sichtbar */
    if ((b.deals || []).length) {
      var innen = el('div', { class: 'tuer-liste deal-diagnose', style: {
        border: '1px solid var(--rand)', borderRadius: 'var(--radius)' } });
      b.deals.slice(0, 40).forEach(function (d) {
        innen.appendChild(el('div', { class: 'tuer-zeile', style: { cursor: 'default' } }, [
          el('div', { class: 'statusbalken',
            style: { background: d.uebernehmen ? 'var(--gruen)' : 'var(--text-zart)' } }),
          el('div', { class: 'inhalt' }, [
            el('div', { class: 'haupt' }, [
              el('div', { class: 'bez', text: d.titel || ('Deal ' + d.id) }),
              el('div', { class: 'detail', text:
                ['Nr. ' + d.id,
                 'Pipeline ' + (d.pipelineName || d.pipelineId || '–'),
                 'Phase ' + (d.phaseName || d.phaseId || '–'),
                 d.status || ''].filter(Boolean).join('  ·  ') })
            ]),
            el('div', { class: 'marken' }, el('span', {
              class: 'marke-pille ' + (d.uebernehmen ? 'gruen' : ''),
              text: d.uebernehmen ? 'würde angeboten' : d.grund }))
          ])
        ]));
      });
      kasten.appendChild(el('details', { class: 'abschnitt', open: true }, [
        el('summary', {}, [
          el('span', { text: 'Gelesene Deals' }),
          el('span', { class: 'zusatz', text: b.deals.length + '' })
        ]),
        el('div', { class: 'koerper' }, innen)
      ]));
    }

    kasten.appendChild(el('div', { class: 'knopfleiste', style: { marginTop: '12px' } },
      el('button', { class: 'klein', text: 'Bericht kopieren', onclick: function () {
        var text = diagnoseAlsText(b);
        var fertig = function () { A.toast('Bericht kopiert.', 'ok'); };
        if (global.navigator && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(fertig, function () { ersatzKopie(text); });
        } else { ersatzKopie(text); }
      } })));
    return kasten;
  }

  function ersatzKopie(text) {
    var feld = el('textarea', { value: text, style: { position: 'fixed', top: '-1000px' } });
    document.body.appendChild(feld);
    feld.select();
    try { document.execCommand('copy'); A.toast('Bericht kopiert.', 'ok'); }
    catch (x) { A.toast('Kopieren nicht möglich.', 'fehler'); }
    document.body.removeChild(feld);
  }

  /* Als Text zum Weitergeben - bewusst ohne Zugriffsschlüssel. */
  function diagnoseAlsText(b) {
    var z = b.zahlen || {};
    var zeilen = ['Pipedrive-Prüfbericht', 'Adresse: ' + b.host,
      'Pipeline: ' + (b.pipelineName || '–') + ' (Nr. ' + (b.pipelineId || '–') + ')',
      'Phase: ' + (b.phaseName || '–') + ' (Nr. ' + (b.phaseId || '–') + ')', ''];
    (b.schritte || []).forEach(function (sch) {
      zeilen.push((sch.ok ? '[ok] ' : '[!] ') + sch.name + ': ' + sch.text);
    });
    zeilen.push('');
    zeilen.push('Gelesen: ' + z.gelesen + ', in Pipeline: ' + z.inPipeline +
      ', in Phase: ' + z.inPhase + ', übernehmbar: ' + z.uebernehmbar +
      ', gefilterte Abfrage: ' + (z.gefiltert === null ? '–' : z.gefiltert));
    (b.hinweise || []).forEach(function (h) { zeilen.push('Hinweis: ' + h); });
    zeilen.push('');
    (b.deals || []).slice(0, 40).forEach(function (d) {
      zeilen.push('Deal ' + d.id + ' | Pipeline ' + (d.pipelineName || d.pipelineId) +
        ' | Phase ' + (d.phaseName || d.phaseId) + ' | ' + d.status +
        ' | ' + (d.uebernehmen ? 'würde angeboten' : d.grund));
    });
    return zeilen.join('\n');
  }

  function dealUebernehmen(deal, bekannt, dlg, neuLaden) {
    var e = Zustand.einstellungen || {};
    var PD = global.Pipedrive;

    if (bekannt) {
      A.bestaetigen('Deal bereits übernommen',
        'Zu diesem Deal gibt es schon das Aufmaß „' + (bekannt.kunde || bekannt.name) +
        '“. Soll trotzdem ein weiteres angelegt werden?', 'Weiteres anlegen')
        .then(function (ja) { if (ja) holenUndAnlegen(); });
      return;
    }
    holenUndAnlegen();

    function holenUndAnlegen() {
      A.toast('Stammdaten werden aus Pipedrive geholt …');
      PD.dealVollstaendig(e, deal).then(function (daten) {
        var projekt = M.neuesProjekt(deal.titel || 'Aufmaß aus Pipedrive');
        if (e.standardBearbeiter) projekt.bearbeiter = e.standardBearbeiter;
        var ergebnis = PD.aufProjektAbbilden(projekt, daten, e);

        return Store.projektSpeichern(projekt).then(function () {
          if (dlg) dlg.schliessen();
          A.projektOeffnenIntern(projekt, 'stammdaten');
          neuLaden();
          var n = ergebnis.uebernommen.length;
          A.toast(n ? (n + ' Angaben aus Pipedrive übernommen: ' + ergebnis.uebernommen.join(', '))
                    : 'Aufmaß angelegt. In Pipedrive waren keine Stammdaten hinterlegt.', 'ok');
        });
      }).catch(function (fehler) {
        A.toast(fehler.message || 'Die Übernahme ist fehlgeschlagen.', 'fehler');
      });
    }
  }

  function neuesProjektAnlegen(neuLaden) {
    A.textAbfragen('Neues Aufmaß', 'Kunde oder Objektbezeichnung', '', 'z. B. Müller GmbH – Verwaltung')
      .then(function (name) {
        if (name === null) return;
        var p = M.neuesProjekt(name || 'Neues Aufmaß');
        p.kunde = name || '';
        if (Zustand.einstellungen && Zustand.einstellungen.standardBearbeiter) {
          p.bearbeiter = Zustand.einstellungen.standardBearbeiter;
        }
        Store.projektSpeichern(p).then(function () {
          A.projektOeffnenIntern(p, 'stammdaten');
          neuLaden();
          A.toast('Aufmaß angelegt. Bitte Stammdaten ergänzen.', 'ok');
        });
      });
  }

  function projektOeffnen(id, neuLaden) {
    Store.projektLaden(id).then(function (p) {
      if (!p) { A.toast('Projekt nicht gefunden.', 'fehler'); return; }
      var geladen = M.migriere(p);
      geladen.id = p.id;
      A.projektOeffnenIntern(geladen, 'tueren');
      neuLaden();
    });
  }

  function importDialog(neuLaden) {
    var dateiEingabe = el('input', {
      type: 'file', accept: '.json,application/json',
      onchange: function (e) {
        var datei = e.target.files && e.target.files[0];
        if (!datei) return;
        var leser = new FileReader();
        leser.onerror = function () { A.toast('Die Datei konnte nicht gelesen werden.', 'fehler'); };
        leser.onload = function () {
          var ergebnis;
          try { ergebnis = Store.importParsen(leser.result); }
          catch (fehler) { A.toast(fehler.message, 'fehler'); return; }
          Store.alleProjekte().then(function (vorhandene) {
            var gleich = vorhandene.filter(function (v) { return v.id === ergebnis.projekt.id; })[0];
            var fortsetzen = function (projekt) {
              Store.projektSpeichern(projekt).then(function () {
                A.projektOeffnenIntern(projekt, 'tueren');
                A.toast('Projekt importiert: ' + projekt.tueren.length + ' Türen.', 'ok');
                dlg.schliessen(); neuLaden();
              });
            };
            if (gleich) {
              A.bestaetigen('Projekt bereits vorhanden',
                'Ein Projekt mit derselben Kennung existiert bereits („' + (gleich.kunde || gleich.name) +
                '“). Soll es überschrieben werden? Andernfalls wird eine Kopie angelegt.',
                'Überschreiben').then(function (ueberschreiben) {
                  fortsetzen(ueberschreiben ? ergebnis.projekt
                    : Store.projektKlonen(ergebnis.projekt, (ergebnis.projekt.name || 'Import') + ' (Import)'));
                });
            } else { fortsetzen(ergebnis.projekt); }
          });
        };
        leser.readAsText(datei);
      }
    });
    var dlg = A.dialogOeffnen({
      titel: 'Projekt importieren', klein: true,
      inhalt: el('div', {}, [
        el('p', { class: 'hinweis', text: 'Wählen Sie eine zuvor exportierte Aufmaß-Datei (.json) aus.' }),
        dateiEingabe
      ]),
      knoepfe: [{ fuellen: true }, { text: 'Abbrechen' }]
    });
  }

  /* =========================================================================
   * Stammdaten
   * ====================================================================== */
  function ansichtStammdaten(behaelter) {
    var p = Zustand.projekt;
    var seite = el('div', { class: 'seite' });
    behaelter.appendChild(seite);

    seite.appendChild(el('h1', { text: 'Projekt-Stammdaten' }));
    seite.appendChild(el('p', { class: 'hinweis', text: 'Diese Angaben erscheinen im Kopf jeder PDF-Ausgabe.' }));

    /* Verknüpfung zu Pipedrive, sofern das Aufmaß von dort stammt */
    if (p.pipedrive && p.pipedrive.dealId) {
      seite.appendChild(el('div', { class: 'meldung info' }, el('div', {}, [
        el('b', { text: 'Verknüpft mit Pipedrive' }),
        el('div', { style: { marginTop: '4px', fontSize: '13.5px' }, text:

    function anlageZeichnen() {

        })

      var art = K.ANLAGENART.filter(function (a) { return a.id === p.anlagenart; })[0];

    /* --- Angaben, die nur die Bestellung braucht ------------------------

      ]),
      el('div', { class: 'raster', style: { marginTop: '12px' } }, [
        A.bereichFeld(p, 'bemerkung', 'Projektbemerkung', {
          zeilen: 4,

  /* =========================================================================
   * Struktur: Standorte → Gebäude → Bereiche/Etagen
   * ====================================================================== */
  var EBENEN = {
    standort: { label: 'Standort', kind: 'gebaeude', kindLabel: 'Gebäude' },
    gebaeude: { label: 'Gebäude', kind: 'bereich',  kindLabel: 'Bereich / Etage' },
    bereich:  { label: 'Bereich', kind: 'bereich',  kindLabel: 'Unterbereich' }
  };

  function ansichtStruktur(behaelter, neuZeichnen) {
    var p = Zustand.projekt;
    var seite = el('div', { class: 'seite' });
    behaelter.appendChild(seite);

    seite.appendChild(el('div', { class: 'zeile-verteilt', style: { marginBottom: '6px' } }, [
      el('div', { class: 'fuellen' }, [
        el('h1', { text: 'Standorte, Gebäude und Bereiche' }),
        el('p', { class: 'hinweis', text: 'Die Gliederung bestimmt die Gruppierung in Türliste und Kreuzschließplan. Die Reihenfolge hier ist auch die Reihenfolge in der PDF-Ausgabe.' })
      ]),
      el('button', { class: 'haupt', text: '+ Standort',
        onclick: function () { knotenAnlegen('standort', null, neuZeichnen); } })
    ]));

    var wurzeln = M.kinderVon(p, null);
    if (!wurzeln.length) {
      seite.appendChild(el('div', { class: 'leer' }, [
        el('h3', { text: 'Noch keine Gliederung angelegt' }),
        el('p', { text: 'Legen Sie zuerst einen Standort an, darunter Gebäude und Etagen. Türen ohne Zuordnung erscheinen in der PDF unter „Ohne Zuordnung“.' }),
        el('button', { class: 'haupt', text: '+ Ersten Standort anlegen',
          onclick: function () { knotenAnlegen('standort', null, neuZeichnen); } })
      ]));
      return;
    }

    var liste = el('ul', { class: 'baum' });
    wurzeln.forEach(function (k) { liste.appendChild(knotenZeichnen(k, neuZeichnen)); });
    seite.appendChild(el('div', { class: 'karte' }, liste));
  }

  /* =========================================================================
   * Bereichsansicht: Türen eines Standorts, Gebäudes oder Bereichs
   * ======================================================================
   * Entsteht durch Antippen eines Eintrags in der Gliederung. Gezeigt werden
   * die Türen dieses Eintrags einschließlich seiner Unterbereiche, nach
   * Unterbereich gruppiert. Eine neue Tür entsteht hier bereits mit dem
   * richtigen Bereich - er muss nicht erneut gewählt werden.
   */
  function bereichOeffnen(knotenId, neuZeichnen) {
    Zustand.bereichId = knotenId;
    global.App.wechseln('bereich');
  }

  function ansichtBereich(behaelter, neuZeichnen) {
    var p = Zustand.projekt;
    var seite = el('div', { class: 'seite' });
    behaelter.appendChild(seite);

    var knoten = M.findeStruktur(p, Zustand.bereichId);
    if (!knoten) {
      seite.appendChild(el('div', { class: 'leer' }, [
        el('h3', { text: 'Der Bereich ist nicht mehr vorhanden' }),
        el('p', { text: 'Er wurde vermutlich gelöscht oder umgehängt.' }),
        el('button', { class: 'haupt', text: '← Zurück zur Struktur',
          onclick: function () { zurueckZurStruktur(); } })
      ]));
      return;
    }

    var konfig = EBENEN[knoten.ebene] || EBENEN.bereich;
    var pfad = M.strukturPfad(p, knoten.id);
    var tueren = M.tuerenUnter(p, knoten.id);
    var unterbereiche = M.kinderVon(p, knoten.id);
    var gesamtAnzahl = tueren.reduce(function (sum, t) {
      return sum + (parseInt(t.anzahl, 10) || 1); }, 0);
    var offene = tueren.filter(function (t) { return !M.tuerVollstaendig(p, t); });

    /* --- Kopf mit Zurück-Knopf und Pfad --- */
    seite.appendChild(el('div', { class: 'bereich-kopf' }, [
      el('button', { class: 'zurueck-zeile', text: '← Zurück zur Struktur',
        onclick: function () { zurueckZurStruktur(); } }),
      el('div', { class: 'pfad' }, pfad.map(function (k, i) {
        return el('span', {}, [

          k.id === knoten.id

                onclick: function () { bereichOeffnen(k.id, neuZeichnen); } })
        ]);
      }))
